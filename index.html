<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشواري - لوحة الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://fwsizwqzmgrxqdjgtyvm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dvXnOm9j_Jzam6WGXMYVZA_7PZGlLjH';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [activeTab, setActiveTab] = useState('passengers');
      const [passengers, setPassengers] = useState([]);
      const [loading, setLoading] = useState(true);

      const fetchData = async () => {
        setLoading(true);
        const { data, error } = await supabase.from('passengers').select('*').order('created_at', { ascending: false });
        if (data) setPassengers(data);
        if (error) console.error(error);
        setLoading(false);
      };

      useEffect(() => {
        fetchData();
      }, []);

      const generateCode = async (nationalId) => {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const { error } = await supabase.from('passengers').update({ verification_code: code, is_verified: 1 }).eq('national_id', nationalId);
        if (!error) {
          alert(`تم التفعيل! الكود: ${code}`);
          fetchData();
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4">
          <header className="bg-slate-900 text-white p-4 rounded-2xl shadow-lg mb-6 flex justify-between items-center">
            <h1 className="font-black text-xl">لوحة إدارة مشواري</h1>
            <button onClick={fetchData} className="bg-slate-700 px-4 py-2 rounded-lg text-xs font-bold">تحديث البيانات</button>
          </header>

          <div className="flex gap-2 mb-6">
            <button onClick={() => setActiveTab('passengers')} className={`flex-1 py-3 rounded-xl font-bold ${activeTab === 'passengers' ? 'bg-amber-400 text-slate-900' : 'bg-white'}`}>الركاب</button>
          </div>

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
            {loading ? (
              <p className="text-center py-10">جارٍ التحميل...</p>
            ) : passengers.length === 0 ? (
              <p className="text-center py-10 text-slate-500">لا يوجد ركاب مسجلون حالياً (تأكد من تحديث الصفحة).</p>
            ) : (
              <div className="space-y-3">
                {passengers.map(p => (
                  <div key={p.national_id} className="p-4 border rounded-xl flex justify-between items-center bg-slate-50">
                    <div>
                      <p className="font-bold">{p.full_name}</p>
                      <p className="text-xs text-slate-500">بطاقة: {p.national_id}</p>
                    </div>
                    {p.is_verified === 0 ? (
                      <button onClick={() => generateCode(p.national_id)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold">توليد كود</button>
                    ) : (
                      <span className="text-xs text-emerald-600 font-bold bg-emerald-100 px-2 py-1 rounded">مفعل</span>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
