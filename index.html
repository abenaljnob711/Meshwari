<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشواري - المنصة الذكية للنقل الكاش</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 🔗 رابط السيرفر الخلفي (ضع رابط سيرفرك هنا أو اتركه محلياً)
    const API_BASE_URL = 'https://mashwary-server.onrender.com';

    function BatteryWidget() {
      const [battery, setBattery] = useState({ level: 100, charging: false });
      useEffect(() => {
        if ('getBattery' in navigator) {
          navigator.getBattery().then(bat => {
            const update = () => setBattery({ level: Math.round(bat.level * 100), charging: bat.charging });
            update();
            bat.addEventListener('levelchange', update);
            bat.addEventListener('chargingchange', update);
          });
        }
      }, []);
      return (
        <div className="flex items-center gap-1.5 px-3 py-1 bg-slate-800 text-amber-400 rounded-full text-xs font-bold border border-amber-500/30">
          <span>{battery.charging ? '⚡' : '🔋'}</span>
          <span>{battery.level}%</span>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('passenger');
      const [notice, setNotice] = useState('مرحباً بك في تطبيق مشواري - متصل بالسحاب بنجاح');
      const [deviceId] = useState('DEV-8829-YEM');

      const [governorates, setGovernorates] = useState([]);
      const [txLog, setTxLog] = useState([]);

      // جلب بيانات الإدارة والمحافظات وسجل الحركات من السيرفر حقيقياً
      useEffect(() => {
        fetch(`${API_BASE_URL}/api/admin/governorates`)
          .then(res => res.json())
          .then(data => { if (Array.isArray(data)) setGovernorates(data); })
          .catch(err => console.error('خطأ في جلب المحافظات'));

        fetch(`${API_BASE_URL}/api/admin/transactions`)
          .then(res => res.json())
          .then(data => { if (Array.isArray(data)) setTxLog(data); })
          .catch(err => console.error('خطأ في جلب السجل'));
      }, []);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between">
          <header className="bg-emerald-950 text-white p-4 sticky top-0 z-50 border-b-4 border-amber-400">
            <div className="flex justify-between items-center mb-3">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 bg-amber-400 text-emerald-950 font-black text-xl rounded-xl flex items-center justify-center shadow">م</div>
                <div>
                  <h1 className="font-black text-xl leading-none tracking-wide">مشواري</h1>
                  <span className="text-[10px] text-amber-300 font-bold">نظام الكاش المستقل</span>
                </div>
              </div>
              <BatteryWidget />
            </div>

            <div className="grid grid-cols-3 gap-1 bg-emerald-900/80 p-1 rounded-xl text-xs font-bold text-center">
              <button onClick={() => setActiveTab('passenger')} className={`py-2 rounded-lg transition ${activeTab === 'passenger' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>الزبون</button>
              <button onClick={() => setActiveTab('driver')} className={`py-2 rounded-lg transition ${activeTab === 'driver' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>السائق</button>
              <button onClick={() => setActiveTab('admin')} className={`py-2 rounded-lg transition ${activeTab === 'admin' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>الإدارة</button>
            </div>
          </header>

          <div className="bg-amber-100 border-b border-amber-300 px-4 py-2 text-xs font-bold text-amber-900 flex items-center gap-2">
            <span>📢</span>
            <span className="truncate">{notice}</span>
          </div>

          <main className="p-4 flex-1 space-y-4">
            {activeTab === 'passenger' && <PassengerScreen deviceId={deviceId} setNotice={setNotice} />}
            {activeTab === 'driver' && <DriverScreen setNotice={setNotice} />}
            {activeTab === 'admin' && <AdminScreen governorates={governorates} setGovernorates={setGovernorates} txLog={txLog} setNotice={setNotice} />}
          </main>

          <footer className="bg-slate-900 text-slate-400 text-center py-3 text-xs border-t border-slate-800">
            تطبيق مشواري © 2026 — معرف الجهاز: <span className="font-mono text-amber-400">{deviceId}</span>
          </footer>
        </div>
      );
    }

    // 1. واجهة الراكب الحقيقية المرتبطة بـ Backend
    function PassengerScreen({ deviceId, setNotice }) {
      const [nationalId, setNationalId] = useState('');
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [currentUser, setCurrentUser] = useState(null);
      const [tripState, setTripState] = useState('idle');

      const handleRegisterOrLogin = async (e) => {
        e.preventDefault();
        if (!nationalId || !name || !phone) return setNotice('يرجى تعبئة كافة الحقول المطلوبة');

        try {
          const res = await fetch(`${API_BASE_URL}/api/passenger/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ national_id: nationalId, full_name: name, phone: phone, device_id: deviceId })
          });
          const data = await res.json();
          if (res.ok) {
            setCurrentUser({
              nationalId: data.passenger.national_id,
              name: data.passenger.full_name,
              debt: data.passenger.customer_debt,
              isBlocked: data.passenger.is_blocked === 1
            });
            setNotice(data.message);
          } else {
            setNotice(`خطأ: ${data.error}`);
          }
        } catch (err) {
          setNotice('فشل الاتصال بالسيرفر الخلفي.');
        }
      };

      const handleCancelTrip = async () => {
        if (!currentUser) return;
        try {
          const res = await fetch(`${API_BASE_URL}/api/trip/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ national_id: currentUser.nationalId, driver_id: 101 })
          });
          const data = await res.json();
          if (res.ok) {
            setTripState('idle');
            setCurrentUser(prev => ({ ...prev, debt: 1000, isBlocked: true }));
            setNotice(data.message);
          } else {
            setNotice(`خطأ: ${data.error}`);
          }
        } catch (err) {
          setNotice('حدث خطأ أثناء الاتصال.');
        }
      };

      if (!currentUser) {
        return (
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 className="text-base font-black text-emerald-950 mb-1">تسجيل الراكب (سحابي حقيقي)</h2>
            <p className="text-xs text-slate-500 mb-4">يستخدم رقم البطاقة كمفتاح أساسي للذمة المالية.</p>
            <form onSubmit={handleRegisterOrLogin} className="space-y-3">
              <div>
                <label className="block text-xs font-bold mb-1">رقم البطاقة الوطنية</label>
                <input type="text" className="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono" placeholder="101928374" value={nationalId} onChange={e => setNationalId(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">الاسم الكامل</label>
                <input type="text" className="w-full border border-slate-300 rounded-xl p-3 text-sm" placeholder="الاسم الرباعي" value={name} onChange={e => setName(e.target.value)} />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">رقم الجوال</label>
                <input type="text" className="w-full border border-slate-300 rounded-xl p-3 text-sm font-mono" placeholder="77XXXXXXX" value={phone} onChange={e => setPhone(e.target.value)} />
              </div>
              <button type="submit" className="w-full bg-emerald-900 text-amber-400 font-black py-3 rounded-xl shadow hover:bg-emerald-800 transition">دخول / تسجيل الحساب</button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          <div className="bg-slate-900 text-white p-4 rounded-2xl shadow">
            <h3 className="font-black text-sm">{currentUser.name}</h3>
            <p className="text-xs text-slate-400 font-mono">بطاقة: {currentUser.nationalId}</p>
            <span className={`inline-block mt-2 text-xs px-2.5 py-1 rounded-full font-bold ${currentUser.isBlocked ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
              {currentUser.isBlocked ? 'محظور بسبب دين' : 'الحساب نشط'}
            </span>
            {currentUser.debt > 0 && <p className="mt-2 text-xs text-amber-300 font-bold">عليك دين سابق: {currentUser.debt} ريال</p>}
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <div className="h-40 bg-emerald-100 rounded-xl flex items-center justify-center font-bold text-emerald-800 text-xs">📍 خريطة مشواري المباشرة</div>
            {tripState === 'idle' && (
              <button onClick={() => { setTripState('searching'); setNotice('جارٍ البحث عن سائق عبر السحاب...'); }} className="w-full bg-amber-400 text-emerald-950 font-black py-3 rounded-xl shadow">طلب تاكسي (المشوار: 2000 ريال)</button>
            )}
            {tripState === 'searching' && (
              <div className="space-y-2">
                <div className="p-3 bg-amber-50 rounded-xl text-xs font-bold text-amber-900 text-center animate-pulse">Searching... جارٍ التوصيل بأقرب سائق</div>
                <button onClick={handleCancelTrip} className="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs">إلغاء الطلب (تطبيق غرامة الدين الآلي)</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // 2. واجهة السائق الحقيقية المرتبطة بـ Backend
    function DriverScreen({ setNotice }) {
      const [driverId, setDriverId] = useState('1');
      const [passengerNationalId, setPassengerNationalId] = useState('');
      const [tripFare, setTripFare] = useState(2000);

      const handleConfirmCash = async (e) => {
        e.preventDefault();
        if (!passengerNationalId) return setNotice('أدخل رقم بطاقة الراكب لتأكيد التحصيل');

        try {
          const res = await fetch(`${API_BASE_URL}/api/trip/confirm-cash`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ national_id: passengerNationalId, new_driver_id: parseInt(driverId), trip_fare: parseInt(tripFare) })
          });
          const data = await res.json();
          if (res.ok) {
            setNotice(`✅ ${data.message} (الإجمالي المستلم: ${data.total_cash_collected} ريال)`);
            setPassengerNationalId('');
          } else {
            setNotice(`خطأ: ${data.error}`);
          }
        } catch (err) {
          setNotice('فشل الاتصال بالسيرفر لتأكيد الكاش.');
        }
      };

      return (
        <div className="space-y-4">
          <div className="bg-slate-900 text-white p-4 rounded-2xl shadow">
            <h3 className="font-black text-sm">لوحة السائق الحية</h3>
            <p className="text-xs text-amber-400">معرف السائق الحالي: #{driverId}</p>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-800">تأكيد تحصيل الكاش وتسوية الديون</h3>
            <form onSubmit={handleConfirmCash} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold mb-1">رقم بطاقة الراكب:</label>
                <input type="text" className="w-full border rounded-xl p-2.5 font-mono" placeholder="101928374" value={passengerNationalId} onChange={e => setPassengerNationalId(e.target.value)} />
              </div>
              <div>
                <label className="block font-bold mb-1">أجرة المشوار الحالي (ريال):</label>
                <input type="number" className="w-full border rounded-xl p-2.5 font-mono" value={tripFare} onChange={e => setTripFare(e.target.value)} />
              </div>
              <button type="submit" className="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow hover:bg-emerald-700">تأكيد استلام الكاش وتصفية الديون</button>
            </form>
          </div>
        </div>
      );
    }

    // 3. واجهة الإدارة الحقيقية المرتبطة بـ Backend
    function AdminScreen({ governorates, setGovernorates, txLog, setNotice }) {
      const toggleGov = async (govId, currentStatus) => {
        const newStatus = currentStatus === 1 ? 0 : 1;
        try {
          const res = await fetch(`${API_BASE_URL}/api/admin/governorate/${govId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_enabled: newStatus })
          });
          if (res.ok) {
            setGovernorates(governorates.map(g => g.id === govId ? { ...g, is_enabled: newStatus } : g));
            setNotice('تم تحديث حالة المحافظة في السحاب بنجاح');
          }
        } catch (err) {
          setNotice('فشل تحديث المحافظة');
        }
      };

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-800">إدارة تفعيل المحافظات (من قاعدة البيانات)</h3>
            <div className="space-y-2">
              {governorates.map(gov => (
                <div key={gov.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border text-xs font-bold">
                  <span>{gov.name}</span>
                  <button onClick={() => toggleGov(gov.id, gov.is_enabled)} className={`px-3 py-1 rounded-lg ${gov.is_enabled === 1 ? 'bg-emerald-600 text-white' : 'bg-slate-300 text-slate-700'}`}>
                    {gov.is_enabled === 1 ? 'مفتوحة' : 'مغلقة'}
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-800">سجل الديون والتحويلات الحقيقي (transactions_log)</h3>
            <div className="space-y-2 max-h-48 overflow-y-auto">
              {txLog.map(log => (
                <div key={log.id} className="p-3 bg-slate-900 text-white rounded-xl text-xs space-y-1">
                  <div className="flex justify-between text-amber-400 font-bold">
                    <span>{log.operation_type}</span>
                    <span>{log.amount} ريال</span>
                  </div>
                  <p className="text-slate-300">الزبون: {log.passenger_id}</p>
                  <p className="text-slate-400 text-[10px]">{log.note}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(getElementByIdOrFallback('root'));
    function getElementByIdOrFallback(id) { return document.getElementById(id); }
    root.render(<App />);
  </script>
</body>
</html>
