  --success:#167a54;
  --banner:#ffd93a;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#0e1a15;
    --surface-2:#162720;
    --ink:#f2edda;
    --muted:#b8c2b8;
    --line:#355146;
    --green:#0b3d2e;
    --green-2:#1a664d;
    --gold:#e2b53a;
    --gold-2:#463d12;
    --banner:#ffd93a;
  }
}

*{
  box-sizing:border-box
}

html{
  direction:rtl
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 6px 22px rgba(11,61,46,.07)
}

.input{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  color:var(--ink);
  padding:13px 14px;
  outline:none
}

.input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(226,181,58,.22)
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 16px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.btn-gold{
  background:var(--gold);
  color:#1d1a08
}

.btn-green{
  background:var(--green);
  color:white
}

.btn-line{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink)
}

.chip{
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:800
}

.tab-btn{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px 8px;
  font-weight:800;
  border-radius:13px
}

.tab-active{
  background:var(--green);
  color:white
}

.kbd{
  font-family:monospace;
  direction:ltr
}

.small{
  font-size:12px;
  color:var(--muted);
  line-height:1.7
}

.last\:mb-0:last-child {
  margin-bottom: 0px;
}

.last\:border-0:last-child {
  border-width: 0px;
}

.last\:pb-0:last-child {
  padding-bottom: 0px;
}

@media (min-width: 640px) {
  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
