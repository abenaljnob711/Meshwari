<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاكسي ابن الجنوب - المنصة الذكية للنقل الكاش</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 1. مكون فحص نسبة بطارية الجهاز لحظياً
    // ==========================================
    function BatteryWidget() {
      const [battery, setBattery] = useState({ level: 100, charging: false });

      useEffect(() => {
        if ('getBattery' in navigator) {
          navigator.getBattery().then(bat => {
            const update = () => setBattery({ level: Math.round(bat.level * 100), charging: bat.charging });
            update();
            bat.addEventListener('levelchange', update);
            bat.addEventListener('chargingchange', update);
          });
        }
      }, []);

      return (
        <div className="flex items-center gap-1.5 px-3 py-1 bg-slate-800 text-amber-400 rounded-full text-xs font-bold border border-amber-500/30">
          <span>{battery.charging ? '⚡' : '🔋'}</span>
          <span>{battery.level}%</span>
        </div>
      );
    }

    // ==========================================
    // 2. التطبيق الرئيسي والتحكم بالشاشات
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('passenger');
      const [notice, setNotice] = useState('مرحباً بك في تاكسي ابن الجنوب - نظام الديون والعمولات الكاش الآلي');
      const [deviceId] = useState('DEV-8829-YEM');

      // قاعدة البيانات المحلية المؤقتة المحاكاة
      const [passengers, setPassengers] = useState([
        { nationalId: '101928374', name: 'سالم بن علي الحضرمي', phone: '771234567', debt: 0, isBlocked: false, creditorDriverId: null },
        { nationalId: '202938475', name: 'عمر باوزير', phone: '739876543', debt: 1000, isBlocked: true, creditorDriverId: 101 }
      ]);

      const [drivers, setDrivers] = useState([
        { id: 101, nationalId: '901827364', name: 'الكابتن عبد الله باصرة', phone: '711223344', car: 'تويوتا كورولا (1234 / 1)', status: 'active', isOffDuty: false, wallet: 5000, withdrawable: 0 },
        { id: 102, nationalId: '801726354', name: 'الكابتن محسن الكندي', phone: '770099887', car: 'هيونداي إلنترا (5678 / 2)', status: 'active', isOffDuty: false, wallet: 200, withdrawable: 1000 }
      ]);

      const [governorates, setGovernorates] = useState([
        { name: 'حضرموت - المكلا', active: true },
        { name: 'حضرموت - سيئون', active: true },
        { name: 'عدن', active: true },
        { name: 'شبوة', active: false },
        { name: 'مأرب', active: false }
      ]);

      const [txLog, setTxLog] = useState([
        { id: 1, type: 'استرجاع دين', passenger: 'عمر باوزير', oldDriver: 'الكابتن عبد الله باصرة', newDriver: 'الكابتن محسن الكندي', amount: 1000, date: '2026-11-09' }
      ]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between">
          {/* الشريط العلوي الهيدر */}
          <header className="bg-emerald-950 text-white p-4 sticky top-0 z-50 border-b-4 border-amber-400">
            <div className="flex justify-between items-center mb-3">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 bg-amber-400 text-emerald-950 font-black text-xl rounded-xl flex items-center justify-center shadow">
                  ج
                </div>
                <div>
                  <h1 className="font-black text-lg leading-none">تاكسي ابن الجنوب</h1>
                  <span className="text-[10px] text-amber-300 font-bold">نظام الكاش المستقل</span>
                </div>
              </div>
              <BatteryWidget />
            </div>

            {/* التبديل بين الشاشات */}
            <div className="grid grid-cols-3 gap-1 bg-emerald-900/80 p-1 rounded-xl text-xs font-bold text-center">
              <button 
                onClick={() => setActiveTab('passenger')} 
                className={`py-2 rounded-lg transition ${activeTab === 'passenger' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>
                الزبون
              </button>
              <button 
                onClick={() => setActiveTab('driver')} 
                className={`py-2 rounded-lg transition ${activeTab === 'driver' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>
                السائق
              </button>
              <button 
                onClick={() => setActiveTab('admin')} 
                className={`py-2 rounded-lg transition ${activeTab === 'admin' ? 'bg-amber-400 text-emerald-950 font-black' : 'text-slate-200'}`}>
                الإدارة
              </button>
            </div>
          </header>

          {/* شريط الإشعارات والتنبيهات */}
          <div className="bg-amber-100 border-b border-amber-300 px-4 py-2 text-xs font-bold text-amber-900 flex items-center gap-2">
            <span>📢</span>
            <span className="truncate">{notice}</span>
          </div>

          {/* محتوى الشاشة الفعالة */}
          <main className="p-4 flex-1 space-y-4">
            {activeTab === 'passenger' && (
              <PassengerScreen 
                passengers={passengers} 
                setPassengers={setPassengers}
                deviceId={deviceId}
                setNotice={setNotice} 
              />
            )}

            {activeTab === 'driver' && (
              <DriverScreen 
                drivers={drivers} 
                setDrivers={setDrivers}
                passengers={passengers}
                setPassengers={setPassengers}
                setTxLog={setTxLog}
                setNotice={setNotice} 
              />
            )}

            {activeTab === 'admin' && (
              <AdminScreen 
                governorates={governorates} 
                setGovernorates={setGovernorates}
                txLog={txLog}
                passengers={passengers}
                drivers={drivers}
                setNotice={setNotice} 
              />
            )}
          </main>

          {/* الفوتر */}
          <footer className="bg-slate-900 text-slate-400 text-center py-3 text-xs border-t border-slate-800">
            تاكسي ابن الجنوب © 2026 — حظر الجهاز: <span className="font-mono text-amber-400">{deviceId}</span>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 3. واجهة الراكب (Passenger Screen)
    // ==========================================
    function PassengerScreen({ passengers, setPassengers, deviceId, setNotice }) {
      const [nationalId, setNationalId] = useState('');
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [currentUser, setCurrentUser] = useState(null);
      const [tripState, setTripState] = useState('idle'); // idle, searching, booked

      const handleRegisterOrLogin = (e) => {
        e.preventDefault();
        if (!nationalId || !name || !phone) return setNotice('يرجى تعبئة كافة الحقول المطلوب');

        const existing = passengers.find(p => p.nationalId === nationalId);
        if (existing) {
          setCurrentUser(existing);
          setNotice(`أهلاً بك مجدداً يا ${existing.name}`);
        } else {
          const newUser = { nationalId, name, phone, debt: 0, isBlocked: false, creditorDriverId: null };
          setPassengers([...passengers, newUser]);
          setCurrentUser(newUser);
          setNotice('تم تسجيل حسابك بنجاح بدون تصوير احتراماً لخصوصيتك.');
        }
      };

      const handleCancelTrip = () => {
        if (!currentUser) return;
        // تطبيق الغرامة 1000 ريال والتقييد بحظر الحساب
        const updated = passengers.map(p => {
          if (p.nationalId === currentUser.nationalId) {
            return { ...p, debt: 1000, isBlocked: true, creditorDriverId: 101 };
          }
          return p;
        });
        setPassengers(updated);
        const me = updated.find(p => p.nationalId === currentUser.nationalId);
        setCurrentUser(me);
        setTripState('idle');
        setNotice('تم إيقاف الطلب بعد 3 دقائق. ترتب عليك دين 1000 ريال وسيحصل عليه السائق السابق تلقائياً بالرحلة القادمة.');
      };

      if (!currentUser) {
        return (
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 className="text-base font-black text-emerald-950 mb-1">تسجيل الراكب (بدون تصوير)</h2>
            <p className="text-xs text-slate-500 mb-4">يستخدم رقم البطاقة كمفتاح أساسي فردي للذمة المالية.</p>
            <form onSubmit={handleRegisterOrLogin} className="space-y-3">
              <div>
                <label className="block text-xs font-bold mb-1">رقم البطاقة الشخصية/الوطنية (NATIONAL_ID)</label>
                <input 
                  type="text" 
                  className="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400 font-mono" 
                  placeholder="مثال: 101928374"
                  value={nationalId}
                  onChange={e => setNationalId(e.target.value)}
                />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">الاسم الرباعي الكامل</label>
                <input 
                  type="text" 
                  className="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400" 
                  placeholder="الاسم الكامل"
                  value={name}
                  onChange={e => setName(e.target.value)}
                />
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">رقم الجوال</label>
                <input 
                  type="text" 
                  className="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400 font-mono" 
                  placeholder="77XXXXXXX"
                  value={phone}
                  onChange={e => setPhone(e.target.value)}
                />
              </div>
              <button type="submit" className="w-full bg-emerald-900 text-amber-400 font-black py-3 rounded-xl shadow hover:bg-emerald-800 transition">
                تسجيل / دخول الراكب
              </button>
            </form>
          </div>
        );
      }

      return (
        <div className="space-y-4">
          {/* كارت بيانات الحساب والدين */}
          <div className="bg-slate-900 text-white p-4 rounded-2xl shadow">
            <div className="flex justify-between items-start">
              <div>
                <h3 className="font-black text-sm">{currentUser.name}</h3>
                <p className="text-xs text-slate-400 font-mono">بطاقة: {currentUser.nationalId}</p>
              </div>
              <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${currentUser.isBlocked ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-emerald-500/20 text-emerald-400'}`}>
                {currentUser.isBlocked ? 'محظور بسبب دين' : 'الحساب نشط'}
              </span>
            </div>

            {currentUser.debt > 0 && (
              <div className="mt-3 p-3 bg-red-950/80 border border-red-700/50 rounded-xl text-xs text-red-200">
                ⚠️ عليك دين سابق قدره <strong className="text-amber-400 font-black">{currentUser.debt} ريال</strong>. سيتم إضافته آلياً على الأجرة الكلية كاش للسائق الجديد ليتم السداد وفك الحظر.
              </div>
            )}
          </div>

          {/* محاكاة الخريطة وطلب الرحلة */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <div className="h-40 bg-emerald-100 rounded-xl border border-emerald-300 relative flex items-center justify-center overflow-hidden">
              <span className="text-emerald-800 text-xs font-bold bg-white/90 px-3 py-1.5 rounded-full shadow">📍 خريطة التتبع المباشر (حضرموت)</span>
            </div>

            {tripState === 'idle' && (
              <button 
                onClick={() => { setTripState('searching'); setNotice('جارٍ البحث عن سائق قريب...'); }}
                className="w-full bg-amber-400 text-emerald-950 font-black py-3.5 rounded-xl text-center shadow hover:bg-amber-300 transition">
                طلب تاكسي (المشوار الثابت: 2000 ريال)
              </button>
            )}

            {tripState === 'searching' && (
              <div className="space-y-2">
                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs font-bold text-amber-900 text-center animate-pulse">
                  Searching... جارٍ التوصيل بأقرب سائق متاح
                </div>
                <button 
                  onClick={handleCancelTrip}
                  className="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-red-700 transition">
                  إلغاء الطلب (تطبيق غرامة 1000 ريال بعد 3 دقائق)
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. واجهة السائق (Driver Screen)
    // ==========================================
    function DriverScreen({ drivers, setDrivers, passengers, setPassengers, setTxLog, setNotice }) {
      const [currentDriver, setCurrentDriver] = useState(drivers[0]);
      const [activeRide, setActiveRide] = useState(null);

      const toggleOffDuty = () => {
        const updated = drivers.map(d => d.id === currentDriver.id ? { ...d, isOffDuty: !d.isOffDuty } : d);
        setDrivers(updated);
        setCurrentDriver(updated.find(d => d.id === currentDriver.id));
        setNotice(currentDriver.isOffDuty ? 'أنت الآن متاح على الخريطة' : 'تم تفعيل زر خارج الخدمة مؤقتاً (موقعك ومعلوماتك مخفية الآن)');
      };

      // محاكاة استلام طلب لراكب عليه دين
      const simulateRideOffer = () => {
        const debtorPassenger = passengers.find(p => p.debt > 0) || passengers[0];
        setActiveRide({
          passenger: debtorPassenger,
          fare: 2000,
          debt: debtorPassenger.debt,
          totalCash: 2000 + debtorPassenger.debt
        });
      };

      const handleConfirmCashReceipt = () => {
        if (!activeRide) return;
        const debtor = activeRide.passenger;
        const debtAmount = debtor.debt;
        const oldDriverId = debtor.creditorDriverId;

        // 1. تصفية دين الراكب وفك حظره
        const updatedPassengers = passengers.map(p => {
          if (p.nationalId === debtor.nationalId) {
            return { ...p, debt: 0, isBlocked: false, creditorDriverId: null };
          }
          return p;
        });
        setPassengers(updatedPassengers);

        // 2. تحديث أرصدة السائقين (الجديد يأخذ الأجرة، والقديم يسترجع دينه)
        const updatedDrivers = drivers.map(d => {
          if (d.id === currentDriver.id) {
            return { ...d, withdrawable: d.withdrawable + activeRide.fare };
          }
          if (oldDriverId && d.id === oldDriverId) {
            return { ...d, withdrawable: d.withdrawable + debtAmount };
          }
          return d;
        });
        setDrivers(updatedDrivers);
        setCurrentDriver(updatedDrivers.find(d => d.id === currentDriver.id));

        // 3. تسجيل العملية في سجل الديون الآلي
        if (debtAmount > 0) {
          setTxLog(prev => [
            {
              id: Date.now(),
              type: 'استرجاع دين آلي',
              passenger: debtor.name,
              oldDriver: `سائق رقم #${oldDriverId}`,
              newDriver: currentDriver.name,
              amount: debtAmount,
              date: new Date().toISOString().split('T')[0]
            },
            ...prev
          ]);
        }

        setActiveRide(null);
        setNotice(`✅ تم تسديد مبلغ ${activeRide.totalCash} ريال كاش بنجاح، وتصفية دين الراكب وتحويل مستحقات السائق القديم.`);
      };

      return (
        <div className="space-y-4">
          {/* شريط حالة السائق وزر خارج الخدمة */}
          <div className="bg-slate-900 text-white p-4 rounded-2xl shadow">
            <div className="flex justify-between items-center mb-3">
              <div>
                <h3 className="font-black text-sm">{currentDriver.name}</h3>
                <p className="text-xs text-amber-400 font-mono">{currentDriver.car}</p>
              </div>
              <button 
                onClick={toggleOffDuty}
                className={`px-3 py-1.5 rounded-xl text-xs font-black transition ${currentDriver.isOffDuty ? 'bg-red-600 text-white' : 'bg-emerald-500 text-slate-950'}`}>
                {currentDriver.isOffDuty ? '🔴 خارج الخدمة' : '🟢 متصل للعمل'}
              </button>
            </div>

            <div className="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-800 text-xs">
              <div>
                <span className="text-slate-400 block">رصيد المحفظة (العمولة):</span>
                <span className="font-black text-amber-300">{currentDriver.wallet} ريال</span>
              </div>
              <div>
                <span className="text-slate-400 block">المستحقات المتاحة:</span>
                <span className="font-black text-emerald-400">{currentDriver.withdrawable} ريال</span>
              </div>
            </div>
          </div>

          {/* استقبال وتأكيد الرحلات الكاش */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-700">استقبال وتأكيد المشاوير النقدية</h3>

            {!activeRide ? (
              <button 
                onClick={simulateRideOffer}
                className="w-full bg-emerald-900 text-amber-400 font-black py-3 rounded-xl text-xs hover:bg-emerald-800 transition">
                محاكاة طلب رحلة لراكب عليه دين سابق
              </button>
            ) : (
              <div className="bg-amber-50 border-2 border-amber-400 p-4 rounded-xl space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <h4 className="font-black text-sm text-slate-900">{activeRide.passenger.name}</h4>
                    <p className="text-xs text-slate-600 font-mono">بطاقة: {activeRide.passenger.nationalId}</p>
                  </div>
                  <span className="bg-amber-200 text-amber-900 text-xs font-black px-2 py-1 rounded-lg">طلب وارد</span>
                </div>

                <div className="p-3 bg-white rounded-lg border border-amber-200 space-y-1 text-xs">
                  <div className="flex justify-between"><span>أجرة المشوار الجديد:</span><b>{activeRide.fare} ريال</b></div>
                  <div className="flex justify-between text-red-600"><span>دين سابق للزبون:</span><b>+ {activeRide.debt} ريال</b></div>
                  <div className="flex justify-between text-sm font-black text-emerald-950 pt-1 border-t">
                    <span>إجمالي المبالغ الكاش المستلمة:</span>
                    <span className="text-amber-600 font-extrabold">{activeRide.totalCash} ريال</span>
                  </div>
                </div>

                <button 
                  onClick={handleConfirmCashReceipt}
                  className="w-full bg-emerald-600 text-white font-black py-3 rounded-xl text-xs shadow hover:bg-emerald-700 transition">
                  [تأكيد استلام كاش] ({activeRide.totalCash} ريال)
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. لوحة تحكم الإدارة (Admin Screen)
    // ==========================================
    function AdminScreen({ governorates, setGovernorates, txLog, passengers, drivers, setNotice }) {
      const toggleGov = (index) => {
        const updated = [...governorates];
        updated[index].active = !updated[index].active;
        setGovernorates(updated);
        setNotice(`تم ${updated[index].active ? 'فتح' : 'إغلاق'} الخدمة في ${updated[index].name}`);
      };

      return (
        <div className="space-y-4">
          {/* التحكم بالخدمة بالمحافظات */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-800">إدارة تفعيل المحافظات (حسب الطلب)</h3>
            <div className="space-y-2">
              {governorates.map((gov, idx) => (
                <div key={idx} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold">
                  <span>{gov.name}</span>
                  <button 
                    onClick={() => toggleGov(idx)}
                    className={`px-3 py-1 rounded-lg transition ${gov.active ? 'bg-emerald-600 text-white' : 'bg-slate-300 text-slate-700'}`}>
                    {gov.active ? 'مفتوحة' : 'مغلقة'}
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* سجل الحركات المالي الآلي للديون */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
            <h3 className="text-xs font-black text-slate-800">سجل الديون والتحويلات الآلي (transactions_log)</h3>
            <div className="space-y-2 max-h-48 overflow-y-auto">
              {txLog.map(log => (
                <div key={log.id} className="p-3 bg-slate-900 text-white rounded-xl text-xs space-y-1">
                  <div className="flex justify-between text-amber-400 font-bold">
                    <span>{log.type}</span>
                    <span>{log.amount} ريال</span>
                  </div>
                  <p className="text-slate-300">الزبون: {log.passenger}</p>
                  <p className="text-slate-400 text-[10px]">من السائق الجديد إلى: {log.oldDriver}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // تشغيل التطبيق في DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
