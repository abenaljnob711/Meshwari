

name: Build Meshwari APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Meshwari Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare users application
        shell: bash
        run: |
          set -e

          test -f public/index.html
          test -f public/icon-512.png
          test -f capacitor.config.json

          mkdir -p build/user
          cp -R public build/user/public
          cp capacitor.config.json build/user/capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const file = 'build/user/public/index.html';
          let html = fs.readFileSync(file, 'utf8');

          html = html.replace(
            /location\.origin\s*\+\s*['"]\/api['"]/g,
            "'https://meshwari.onrender.com/api'"
          );

          if (!html.includes('https://meshwari.onrender.com/api')) {
            throw new Error('Users API URL was not configured');
          }

          fs.writeFileSync(file, html);
          NODE

      - name: Prepare admin application
        shell: bash
        run: |
          set -e

          test -f public/admin.html
          test -f capacitor.admin.config.json

          mkdir -p build/admin
          cp -R public build/admin/admin-build
          cp public/admin.html build/admin/admin-build/index.html
          cp capacitor.admin.config.json build/admin/capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const file = 'build/admin/admin-build/index.html';
          let html = fs.readFileSync(file, 'utf8');

          html = html.replace(
            /location\.origin\s*\+\s*['"]\/api['"]/g,
            "'https://meshwari.onrender.com/api'"
          );

          if (!html.includes('https://meshwari.onrender.com/api')) {
            throw new Error('Admin API URL was not configured');
          }

          fs.writeFileSync(file, html);
          NODE

      - name: Create users Android project
        shell: bash
        run: |
          set -e
          cd build/user

          cat > package.json <<'EOF'
          {
            "name": "meshwari-users",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Create admin Android project
        shell: bash
        run: |
          set -e
          cd build/admin

          cat > package.json <<'EOF'
          {
            "name": "meshwari-admin",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Build users APK
        shell: bash
        run: |
          set -e
          cd build/user/android

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/Meshwari-Users.apk"

      - name: Build admin APK
        shell: bash
        run: |
          set -e
          cd build/admin/android

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/Meshwari-Admin.apk"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Meshwari-APK-Files
          path: dist/*.apk
          if-no-files-found: error
