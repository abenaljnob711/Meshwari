name: Build Meshwari Separate APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Passenger, Driver and Admin APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare passenger web app
        shell: bash
        run: |
          set -euo pipefail
          test -f public/passenger/index.html
          test -f public/icon-512.png
          test -f capacitor.passenger.config.json
          mkdir -p build/passenger/passenger-build
          cp -R public/. build/passenger/passenger-build/
          cp public/passenger/index.html build/passenger/passenger-build/index.html
          cp capacitor.passenger.config.json build/passenger/capacitor.config.json
      - name: Prepare driver web app
        shell: bash
        run: |
          set -euo pipefail
          test -f public/driver/index.html
          test -f public/icon-512.png
          test -f capacitor.driver.config.json
          mkdir -p build/driver/driver-build
          cp -R public/. build/driver/driver-build/
          cp public/driver/index.html build/driver/driver-build/index.html
          cp public/driver/manifest.webmanifest build/driver/driver-build/manifest.webmanifest
          cp capacitor.driver.config.json build/driver/capacitor.config.json
      - name: Prepare admin web app
        shell: bash
        run: |
          set -euo pipefail
          test -f public/admin.html
          test -f capacitor.admin.config.json
          mkdir -p build/admin/admin-build
          cp -R public/. build/admin/admin-build/
          cp public/admin.html build/admin/admin-build/index.html
          cp capacitor.admin.config.json build/admin/capacitor.config.json
      - name: Create Android projects
        shell: bash
        run: |
          set -euo pipefail
          for app in passenger driver admin; do
            cd "$GITHUB_WORKSPACE/build/$app"
            cat > package.json <<'EOF'
          {"name":"meshwari-mobile","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/android":"7.4.3"},"devDependencies":{"@capacitor/cli":"7.4.3"}}
          EOF
            npm install --no-audit --no-fund
            npx cap add android
            npx cap sync android
          done
      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for app in passenger driver admin; do
            cd "$GITHUB_WORKSPACE/build/$app/android"
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
            case "$app" in
              passenger) output="Meshwari-Passenger.apk" ;;
              driver) output="Meshwari-Driver.apk" ;;
              admin) output="Meshwari-Admin.apk" ;;
            esac
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/$output"
          done
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Meshwari-Separate-APK-Files
          path: dist/*.apk
          if-no-files-found: error
