name: Build Meshwari - 3 Separate APKs

on:
  workflow_dispatch:

concurrency:
  group: meshwari-apks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Meshwari Passenger, Driver and Admin Apps
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meshwari_test
          POSTGRES_PASSWORD: meshwari_test
          POSTGRES_DB: meshwari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meshwari_test -d meshwari_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_TEST_DATABASE_URL: postgresql://meshwari_test:meshwari_test@localhost:5432/meshwari_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check server, app scripts and service coverage tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --check server.js
          node --check lib/migrations.js
          node --check test/migrations.test.js
          node --check test/migrations-postgres.test.js
          node --check lib/service-coverage.js
          node --check lib/firebase-push.js
          node --check mobile/set-android-version.cjs
          node --check test/service-coverage.test.js
          node --check test/firebase-push.test.js
          npm test
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['public/index.html', 'public/admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            for (const [index, match] of scripts.entries()) {
              if (match[1].trim()) {
                try { new Function(match[1]); }
                catch (error) { throw new Error(file + ' inline script #' + (index + 1) + ': ' + error.message); }
              }
            }
          }
          console.log('All inline application scripts parse successfully.');
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare passenger application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/icon-512.png
          test -f capacitor.config.json

          mkdir -p build/passenger
          cp -R public build/passenger/public
          cp capacitor.config.json build/passenger/capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const file = 'build/passenger/public/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace("const APP_VARIANT='all';", "const APP_VARIANT='passenger';");
          html = html.replace("location.origin+'/api'", "'https://meshwari.onrender.com/api'");
          if (!html.includes("const APP_VARIANT='passenger';") || !html.includes('https://meshwari.onrender.com/api')) {
            throw new Error('Passenger app configuration failed');
          }
          fs.writeFileSync(file, html);
          NODE

      - name: Prepare driver application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/icon-512.png
          test -f capacitor.driver.config.json

          mkdir -p build/driver
          cp -R public build/driver/driver-build
          cp capacitor.driver.config.json build/driver/capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const file = 'build/driver/driver-build/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace("const APP_VARIANT='all';", "const APP_VARIANT='driver';");
          html = html.replace("location.origin+'/api'", "'https://meshwari.onrender.com/api'");
          if (!html.includes("const APP_VARIANT='driver';") || !html.includes('https://meshwari.onrender.com/api')) {
            throw new Error('Driver app configuration failed');
          }
          fs.writeFileSync(file, html);
          NODE

      - name: Prepare admin application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/admin.html
          test -f capacitor.admin.config.json

          mkdir -p build/admin
          cp -R public build/admin/admin-build
          cp public/admin.html build/admin/admin-build/index.html
          cp capacitor.admin.config.json build/admin/capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const file = 'build/admin/admin-build/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace("location.origin+'/api'", "'https://meshwari.onrender.com/api'");
          if (!html.includes('https://meshwari.onrender.com/api')) {
            throw new Error('Admin API URL was not configured');
          }
          if (/push-bundle\.js|MeshwariPushNotifications|registerAdminPush/.test(html)) {
            throw new Error('Admin app must not contain native Firebase Push code');
          }
          html = html.replace('</body>', '<script src="clipboard-bundle.js"></script>\n</body>');
          if (!html.includes('clipboard-bundle.js')) throw new Error('Admin clipboard bridge was not injected');
          fs.writeFileSync(file, html);
          NODE

      - name: Create passenger Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/passenger
          cat > package.json <<'EOF'
          {
            "name": "meshwari-passenger",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3",
              "@capacitor/push-notifications": "7.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "esbuild": "0.25.11",
              "sharp": "0.34.5"
            }
          }
          EOF
          npm install --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/mobile/push-entry.js" push-entry.js
          npx esbuild push-entry.js --bundle --format=iife --outfile=public/push-bundle.js
          npx cap add android
          npx cap sync android

      - name: Create driver Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/driver
          cat > package.json <<'EOF'
          {
            "name": "meshwari-driver",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3",
              "@capacitor/push-notifications": "7.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "esbuild": "0.25.11",
              "sharp": "0.34.5"
            }
          }
          EOF
          npm install --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/mobile/push-entry.js" push-entry.js
          npx esbuild push-entry.js --bundle --format=iife --outfile=driver-build/push-bundle.js
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/meshwari/driver
          cp "$GITHUB_WORKSPACE/mobile/driver-background/DriverLocationPlugin.java" android/app/src/main/java/com/meshwari/driver/
          cp "$GITHUB_WORKSPACE/mobile/driver-background/DriverLocationService.java" android/app/src/main/java/com/meshwari/driver/
          cp "$GITHUB_WORKSPACE/mobile/driver-background/driver-location-bridge.js" driver-location-bridge.js
          npx esbuild driver-location-bridge.js --bundle --format=iife --outfile=driver-build/driver-location-bundle.js
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/src/main/java/com/meshwari/driver/MainActivity.java';
          let java = fs.readFileSync(path, 'utf8');
          if (!java.includes('DriverLocationPlugin.class')) {
            java = java.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;');
            java = java.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(DriverLocationPlugin.class);\n        super.onCreate(savedInstanceState);\n    }');
          }
          fs.writeFileSync(path, java);
          const manifest = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifest, 'utf8');
          const permissions = [
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION'
          ];
          for (const permission of permissions) {
            const tag = '<uses-permission android:name="' + permission + '" />';
            if (!xml.includes('android:name="' + permission + '"')) xml = xml.replace('<application', tag + '\n    <application');
          }
          const service = '<service android:name="com.meshwari.driver.DriverLocationService" android:enabled="true" android:exported="false" android:foregroundServiceType="location" />';
          if (!xml.includes('DriverLocationService')) xml = xml.replace('</application>', '    ' + service + '\n    </application>');
          fs.writeFileSync(manifest, xml);
          const html = 'driver-build/index.html';
          const gradle = 'android/app/build.gradle';
          let appGradle = fs.readFileSync(gradle, 'utf8');
          if (!appGradle.includes('androidx.security:security-crypto')) {
            const dependencyBlock = appGradle.match(/dependencies\s*\{/);
            if (!dependencyBlock) throw new Error('Driver Gradle dependencies block missing');
            appGradle = appGradle.replace(dependencyBlock[0], dependencyBlock[0] + "\n    implementation 'androidx.security:security-crypto:1.1.0'");
          }
          fs.writeFileSync(gradle, appGradle);
          let page = fs.readFileSync(html, 'utf8');
          if (!page.includes('driver-location-bundle.js')) page = page.replace('</body>', '<script src="driver-location-bundle.js"></script>\n</body>');
          fs.writeFileSync(html, page);
          if (!java.includes('registerPlugin(DriverLocationPlugin.class)')) throw new Error('Native driver GPS plugin was not registered');
          if (!xml.includes('ACCESS_BACKGROUND_LOCATION') || !xml.includes('FOREGROUND_SERVICE_LOCATION') || !xml.includes('DriverLocationService')) throw new Error('Driver background location manifest configuration is incomplete');
          if (!appGradle.includes('androidx.security:security-crypto')) throw new Error('Encrypted storage dependency missing for driver GPS');
          if (!fs.existsSync('driver-build/driver-location-bundle.js')) throw new Error('Native driver GPS bridge bundle missing');
          NODE
          npx cap copy android

      - name: Create admin Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/admin
          cat > package.json <<'EOF'
          {
            "name": "meshwari-admin",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3",
              "@capacitor/clipboard": "7.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "esbuild": "0.25.11",
              "sharp": "0.34.5"
            }
          }
          EOF
          npm install --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/mobile/admin-clipboard.js" admin-clipboard.js
          npx esbuild admin-clipboard.js --bundle --format=iife --outfile=admin-build/clipboard-bundle.js
          npx cap add android
          npx cap sync android

      - name: Require and validate Firebase Android configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_PASSENGER_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_PASSENGER_BASE64 }}
          FIREBASE_GOOGLE_SERVICES_DRIVER_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_DRIVER_BASE64 }}
        run: |
          set -euo pipefail
          for app in passenger driver; do
            case "$app" in
              passenger) variable="FIREBASE_GOOGLE_SERVICES_PASSENGER_BASE64"; expected_package="com.meshwari.app" ;;
              driver) variable="FIREBASE_GOOGLE_SERVICES_DRIVER_BASE64"; expected_package="com.meshwari.driver" ;;
            esac
            value="${!variable:-}"
            if [ -z "$value" ]; then
              echo "::error::Required Firebase secret $variable is missing. Refusing to build a push-enabled APK without Firebase configuration."
              exit 1
            fi
            config="build/$app/android/app/google-services.json"
            if ! printf '%s' "$value" | base64 --decode > "$config"; then
              echo "::error::Firebase secret $variable is not valid base64."
              exit 1
            fi
            EXPECTED_PACKAGE="$expected_package" node - "$config" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let config;
          try { config = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { throw new Error('Firebase configuration is not valid JSON: ' + file); }
          if (config.project_info?.project_id !== 'meshwari-85db1') {
            throw new Error('Firebase project_id mismatch in ' + file);
          }
          const expected = process.env.EXPECTED_PACKAGE;
          const clients = Array.isArray(config.client) ? config.client : [];
          if (!clients.some(client => client.client_info?.android_client_info?.package_name === expected)) {
            throw new Error('Firebase configuration has no Android client for ' + expected);
          }
          NODE
          done

          node <<'NODE'
          const fs = require('fs');
          for (const app of ['passenger', 'driver']) {
            const rootFile = 'build/' + app + '/android/build.gradle';
            const appFile = 'build/' + app + '/android/app/build.gradle';
            let rootGradle = fs.readFileSync(rootFile, 'utf8');
            let appGradle = fs.readFileSync(appFile, 'utf8');
            if (!rootGradle.includes('com.google.gms:google-services')) {
              if (!/dependencies\s*\{/.test(rootGradle)) {
                throw new Error('Google Services Gradle dependency block missing for ' + app);
              }
              rootGradle = rootGradle.replace(/dependencies\s*\{/, match =>
                match + "\n        classpath 'com.google.gms:google-services:4.4.2'");
            }
            if (!appGradle.includes("com.google.gms.google-services")) {
              appGradle += "\n\napply plugin: 'com.google.gms.google-services'\n";
            }
            fs.writeFileSync(rootFile, rootGradle);
            fs.writeFileSync(appFile, appGradle);
          }
          NODE

      - name: Verify Firebase configuration is present for passenger and driver
        shell: bash
        run: |
          set -euo pipefail
          test -s build/passenger/android/app/google-services.json
          test -s build/driver/android/app/google-services.json
          grep -q "com.meshwari.app" build/passenger/android/app/google-services.json
          grep -q "com.meshwari.driver" build/driver/android/app/google-services.json

      - name: Add microphone permissions to passenger and driver apps
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const app of ['passenger', 'driver']) {
            const file = 'build/' + app + '/android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(file, 'utf8');
            const permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE'
            ];
            for (const permission of permissions) {
              const tag = '<uses-permission android:name="' + permission + '" />';
              if (!xml.includes('android:name="' + permission + '"')) {
                xml = xml.replace('<application', tag + '\n    <application');
              }
            }
            fs.writeFileSync(file, xml);
          }
          NODE

      - name: Ensure notification permission for passenger and driver apps
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const app of ['passenger', 'driver']) {
            const file = 'build/' + app + '/android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(file, 'utf8');
            for (const permission of ['android.permission.POST_NOTIFICATIONS', 'android.permission.VIBRATE']) {
              const tag = '<uses-permission android:name="' + permission + '" />';
              if (!xml.includes('android:name="' + permission + '"')) {
                xml = xml.replace('<application', tag + '\n    <application');
              }
            }
            fs.writeFileSync(file, xml);
            if (!xml.includes('android.permission.POST_NOTIFICATIONS')) {
              throw new Error('Notification permission missing for ' + app);
            }
          }
          NODE

      - name: Generate launcher icons for all Android apps
        shell: bash
        run: |
          set -euo pipefail
          for app in passenger driver admin; do
            project="build/$app"
            cp "$GITHUB_WORKSPACE/mobile/generate-android-icons.cjs" "$project/generate-android-icons.cjs"
            (
              cd "$project"
              node generate-android-icons.cjs "$GITHUB_WORKSPACE/public/icon-512.png" android/app/src/main/res
            )
            test -s "$project/android/app/src/main/res/mipmap-mdpi/ic_launcher.png"
            test -s "$project/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          done

      - name: Configure stable release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/meshwari-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meshwari-signing/release.jks"
          test -s "$RUNNER_TEMP/meshwari-signing/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/meshwari-signing/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/meshwari-signing/release.jks"
          node <<'NODE'
          const fs = require('fs');
          function findBlock(source, expression, label) {
            const match = expression.exec(source);
            if (!match) throw new Error(label + ' block missing');
            const open = source.indexOf('{', match.index);
            let depth = 1, close = open + 1;
            for (; close < source.length && depth; close++) {
              if (source[close] === '{') depth++;
              else if (source[close] === '}') depth--;
            }
            if (depth) throw new Error(label + ' block is unbalanced');
            return { start: open + 1, end: close - 1 };
          }
          for (const app of ['passenger', 'driver', 'admin']) {
            const file = 'build/' + app + '/android/app/build.gradle';
            let gradle = fs.readFileSync(file, 'utf8');
            if (gradle.includes('signingConfigs')) throw new Error('Unexpected pre-existing signing config; refusing ambiguous signing setup: ' + app);
            const android = findBlock(gradle, /android\\s*\\{/, 'android');
            let inner = gradle.slice(android.start, android.end);
            inner += `
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          `;
            const buildTypes = findBlock(inner, /buildTypes\\s*\\{/, 'buildTypes');
            const buildTypeText = inner.slice(buildTypes.start, buildTypes.end);
            const release = findBlock(buildTypeText, /release\\s*\\{/, 'release build type');
            let releaseText = buildTypeText.slice(release.start, release.end);
            if (/signingConfig\\s+/.test(releaseText)) throw new Error('Release signing already configured: ' + app);
            releaseText += `
                      signingConfig signingConfigs.release
          `;
            const updatedBuildTypes = buildTypeText.slice(0, release.start) + releaseText + buildTypeText.slice(release.end);
            inner = inner.slice(0, buildTypes.start) + updatedBuildTypes + inner.slice(buildTypes.end);
            gradle = gradle.slice(0, android.start) + inner + gradle.slice(android.end);
            fs.writeFileSync(file, gradle);
          }
          NODE

      - name: Build passenger APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd build/passenger/android
          node "$GITHUB_WORKSPACE/mobile/set-android-version.cjs" app/build.gradle
          chmod +x gradlew
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/meshwari-signing/release.jks"
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Meshwari-Passenger.apk"

      - name: Build driver APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd build/driver/android
          node "$GITHUB_WORKSPACE/mobile/set-android-version.cjs" app/build.gradle
          chmod +x gradlew
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/meshwari-signing/release.jks"
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Meshwari-Driver.apk"

      - name: Build admin APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd build/admin/android
          node "$GITHUB_WORKSPACE/mobile/set-android-version.cjs" app/build.gradle
          chmod +x gradlew
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/meshwari-signing/release.jks"
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Meshwari-Admin.apk"

      - name: Verify all three APKs and their package IDs
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" = "3"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          verify_apk() {
            local file="$1"
            local expected_id="$2"
            test -s "$file"
            unzip -t "$file" >/dev/null
            local actual_id
            actual_id="$("$AAPT" dump badging "$file" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
            if [ "$actual_id" != "$expected_id" ]; then
              echo "::error::Package ID mismatch in $file: expected $expected_id, got $actual_id"
              exit 1
            fi
            "$APKSIGNER" verify "$file"
            echo "Verified $file -> $actual_id"
          }

          verify_apk dist/Meshwari-Passenger.apk com.meshwari.app
          verify_apk dist/Meshwari-Driver.apk com.meshwari.driver
          verify_apk dist/Meshwari-Admin.apk com.meshwari.admin
          CERT_PASSENGER="$("$APKSIGNER" verify --print-certs dist/Meshwari-Passenger.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          CERT_DRIVER="$("$APKSIGNER" verify --print-certs dist/Meshwari-Driver.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          CERT_ADMIN="$("$APKSIGNER" verify --print-certs dist/Meshwari-Admin.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CERT_PASSENGER" && test "$CERT_PASSENGER" = "$CERT_DRIVER" && test "$CERT_DRIVER" = "$CERT_ADMIN"
          echo "All three APKs use the same stable signing certificate."
          sha256sum dist/*.apk

      - name: Upload the three separate APKs
        uses: actions/upload-artifact@v4
        with:
          name: Meshwari-3-Separate-APKs
          path: |
            dist/Meshwari-Passenger.apk
            dist/Meshwari-Driver.apk
            dist/Meshwari-Admin.apk
          if-no-files-found: error
