name: Build Meshwari APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Separate Meshwari Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare passenger application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/passenger/index.html
          test -f public/icon-512.png
          mkdir -p build/passenger/passenger-build
          cp public/passenger/index.html build/passenger/passenger-build/index.html
          cp public/icon-512.png build/passenger/passenger-build/
          cp public/passenger/manifest.webmanifest build/passenger/passenger-build/manifest.webmanifest
          cp capacitor.passenger.config.json build/passenger/capacitor.config.json
          node -e "const fs=require('fs');const p='build/passenger/passenger-build/index.html';let s=fs.readFileSync(p,'utf8');if(!s.includes('https://meshwari.onrender.com/api'))throw Error('Passenger API URL missing');fs.writeFileSync(p,s)"

      - name: Prepare driver application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/driver/index.html
          test -f public/icon-512.png
          mkdir -p build/driver/driver-build
          cp public/driver/index.html build/driver/driver-build/index.html
          cp public/icon-512.png build/driver/driver-build/
          cp public/driver/manifest.webmanifest build/driver/driver-build/manifest.webmanifest
          cp capacitor.driver.config.json build/driver/capacitor.config.json
          node -e "const fs=require('fs');const p='build/driver/driver-build/index.html';let s=fs.readFileSync(p,'utf8');if(!s.includes('https://meshwari.onrender.com/api'))throw Error('Driver API URL missing');fs.writeFileSync(p,s)"

      - name: Prepare admin application
        shell: bash
        run: |
          set -euo pipefail
          test -f public/admin.html
          test -f capacitor.admin.config.json
          mkdir -p build/admin/admin-build
          cp -R public/. build/admin/admin-build/
          cp public/admin.html build/admin/admin-build/index.html
          cp capacitor.admin.config.json build/admin/capacitor.config.json

      - name: Create passenger Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/passenger
          cat > package.json <<'EOF'
          {"name":"meshwari-passenger","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/android":"7.4.3"},"devDependencies":{"@capacitor/cli":"7.4.3"}}
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Create driver Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/driver
          cat > package.json <<'EOF'
          {"name":"meshwari-driver","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/android":"7.4.3"},"devDependencies":{"@capacitor/cli":"7.4.3"}}
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Create admin Android project
        shell: bash
        run: |
          set -euo pipefail
          cd build/admin
          cat > package.json <<'EOF'
          {"name":"meshwari-admin","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"7.4.3","@capacitor/android":"7.4.3"},"devDependencies":{"@capacitor/cli":"7.4.3"}}
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Build passenger APK
        shell: bash
        run: |
          set -euo pipefail
          cd build/passenger/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Meshwari-Passenger.apk"

      - name: Build driver APK
        shell: bash
        run: |
          set -euo pipefail
          cd build/driver/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Meshwari-Driver.apk"

      - name: Build admin APK
        shell: bash
        run: |
          set -euo pipefail
          cd build/admin/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/Meshwari-Admin.apk"

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Meshwari-Separate-APK-Files
          path: dist/*.apk
          if-no-files-found: error
