name: Meshwari CI

on:
  push:
    branches:
      - feature/separate-passenger-driver-apps
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshwari-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meshwari
          POSTGRES_PASSWORD: meshwari_test
          POSTGRES_DB: meshwari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meshwari -d meshwari_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_TEST_DATABASE_URL: postgresql://meshwari:meshwari_test@localhost:5432/meshwari_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test
