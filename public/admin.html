<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مشواري"><title>إدارة مشواري</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f3f6f5;--card:#fff;--fg:#12251d;--muted:#64756e;--green:#064e3b;--gold:#e9b949}
[data-theme=dark]{--bg:#07110e;--card:#101e19;--fg:#effff7;--muted:#a6b8af;--green:#087354;--gold:#f3c34f}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif} .card{background:var(--card);border:1px solid #80958a44;border-radius:15px;padding:14px}input,select{width:100%;padding:12px;border:1px solid #80958a66;border-radius:10px;background:var(--card);color:var(--fg);margin:7px 0}button{padding:10px 13px;border-radius:10px;font-weight:bold}.primary{background:var(--green);color:white}.gold{background:var(--gold);color:#17251e}.muted{color:var(--muted)}.tab{background:var(--card);border:1px solid #80958a66}.hidden{display:none}
</style></head><body data-theme="light" class="max-w-5xl mx-auto p-3">
<header class="flex flex-wrap justify-between items-center gap-2 mb-4"><div><h1 class="text-2xl font-black">إدارة مشواري</h1><p class="muted text-xs">لوحة إشراف مستقلة</p></div><div class="flex gap-2"><button class="gold" id="lang">EN</button><button class="gold" id="theme">◐</button></div></header>
<main id="app"><section class="card max-w-md mx-auto"><h2 class="font-bold text-lg">دخول الإدارة</h2><form id="login"><input id="user" placeholder="اسم المستخدم" required><input id="pass" type="password" placeholder="كلمة المرور" required><button class="primary w-full">دخول آمن</button></form><p id="error" class="text-red-600 text-sm mt-2"></p></section></main>
<script>
const API=location.origin+'/api',app=document.getElementById('app');let token=sessionStorage.getItem('mw_admin_token')||'',theme=localStorage.getItem('mw_admin_theme')||'light',lang=localStorage.getItem('mw_admin_lang')||'ar';document.body.dataset.theme=theme;
document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_admin_theme',theme)};
document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_admin_lang',lang);if(token)dashboard()};
async function api(p,b,m='GET'){const r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem('mw_admin_token',token);dashboard()}catch(e){document.getElementById('error').textContent=e.message}};
async function dashboard(){try{const [ov,ac,tr]=await Promise.all([api('/admin/overview'),api('/admin/accounts'),api('/admin/trips')]);const o=ov.overview;app.innerHTML=`<div class="flex flex-wrap gap-2 mb-3"><button class="tab" onclick="showTab('accounts')">${lang==='ar'?'الحسابات':'Accounts'}</button><button class="tab" onclick="showTab('trips')">${lang==='ar'?'الرحلات':'Trips'}</button><button class="tab" onclick="showTab('audit')">${lang==='ar'?'سجل التدقيق':'Audit log'}</button><button class="gold" onclick="logout()">${lang==='ar'?'خروج':'Logout'}</button></div><section class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-3">${[['الركاب',o.passengers],['السائقون',o.drivers],['السائقون المعتمدون',o.active_drivers],['طلبات معلقة',o.pending_accounts],['الرحلات',o.trips]].map(x=>`<div class="card"><p class="muted text-xs">${x[0]}</p><b class="text-xl">${x[1]}</b></div>`).join('')}</section><section id="panel" class="card"></section>`;window.accounts=ac.accounts;window.trips=tr.trips;showTab('accounts')}catch(e){app.innerHTML=`<section class="card">${e.message}<button class="gold" onclick="logout()">خروج</button></section>`}}
window.showTab=async function(tab){const p=document.getElementById('panel');if(tab==='accounts'){p.innerHTML='<h2 class="font-bold text-lg mb-3">الحسابات</h2>'+window.accounts.map(a=>`<article class="border-b border-slate-400/30 py-3"><div class="flex justify-between gap-2"><b>${esc(a.full_name)}</b><span class="text-xs">${a.role==='driver'?'سائق':'راكب'} · ${a.status}</span></div><p class="muted text-xs">${esc(a.national_id)} | ${esc(a.phone)}</p>${a.role==='driver'?`<p class="text-xs mt-1">${esc(a.car_type||'')} ${esc(a.car_model||'')} - ${esc(a.car_color||'')} - ${esc(a.plate_number||'')}</p>`:''}<div class="flex flex-wrap gap-2 mt-2">${a.role==='driver'&&a.status!=='active'?`<button class="primary" onclick="setStatus(${a.id},'active')">اعتماد</button>`:''}<button class="tab" onclick="issue(${a.id})">إصدار رمز</button><button class="tab" onclick="setStatus(${a.id},'blocked')">إيقاف</button>${a.status==='blocked'?`<button class="primary" onclick="setStatus(${a.id},'active')">إعادة تفعيل</button>`:''}</div></article>`).join('')||'لا توجد حسابات'}else if(tab==='trips'){p.innerHTML='<h2 class="font-bold text-lg mb-3">الرحلات</h2>'+window.trips.map(t=>`<article class="border-b border-slate-400/30 py-3"><b>#${t.id} - ${esc(t.passenger_name||'')}</b><p class="muted text-sm">${esc(t.dropoff_address)} | ${t.fare_amount} ريال | ${t.status}</p></article>`).join('')||'لا توجد رحلات'}else{try{const d=await api('/admin/audit');p.innerHTML='<h2 class="font-bold text-lg mb-3">سجل التدقيق</h2>'+d.logs.map(x=>`<p class="border-b border-slate-400/30 py-2 text-sm">${esc(x.action)} - ${esc(x.target_id)} - ${new Date(x.created_at).toLocaleString()}</p>`).join('')}catch(e){p.textContent=e.message}}};
window.setStatus=async(id,status)=>{try{const a=window.accounts.find(x=>x.id===id);await api(`/admin/${a.role==='driver'?'drivers':'passengers'}/${id}/status`,{status},'PATCH');await dashboard()}catch(e){alert(e.message)}};
window.issue=async id=>{try{const d=await api(`/admin/accounts/${id}/issue-code`,{},'POST');alert('رمز التفعيل: '+d.code+'\nصالح لمدة 5 دقائق. أبلغ المستخدم به يدوياً.')}catch(e){alert(e.message)}};
window.logout=()=>{token='';sessionStorage.removeItem('mw_admin_token');location.reload()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(token)dashboard();
</script><script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(error => console.warn("PWA registration failed", error)));
}
</script>
</body></html>
