const API=location.origin+'/api',app=document.getElementById('app');let token=sessionStorage.getItem('mw_admin_token')||'',theme=localStorage.getItem('mw_admin_theme')||'light',lang=localStorage.getItem('mw_admin_lang')||'ar',currentScreen='login',oneTimeCodeValue='',oneTimeCodeDescription='',oneTimeCodeDone=null;

kLogin:'العودة للدخول',settingsTitle:'إعدادات أمان المدير',changePassword:'تغيير كلمة المرور',currentPassword:'كلمة المرور الحالية',passwordHint:'استخدم 12 حرفاً على الأقل.',change:'تغيير كلمة المرور',recoveryHelp:'أنشئ رمزاً جديداً بعد إدخال كلمة المرور الحالية. يظهر مرة واحدة.',generateRecovery:'إنشاء رمز استعادة جديد',copy:'نسخ الرمز',copied:'تم النسخ',passwordChanged:'تم تغيير كلمة المرور وتحديث الجلسة.',passwordMismatch:'كلمتا المرور غير متطابقتين',networkError:'تعذر الاتصال بالخادم.',minPassword:'كلمة المرور 12 حرفاً على الأقل.',inactiveLabel:'غير نشط',lastActivity:'آخر استخدام',created:'تاريخ التسجيل',reasonPrompt:'اكتب سبب العملية:',passwordPrompt:'أدخل كلمة مرور المدير الحالية:',confirmDelete:'اكتب DELETE للتأكيد النهائي',closeConfirm:'هل تريد إغلاق الحساب؟ لن يستطيع صاحبه استخدام الخدمة.',deleteConfirm:'سيتم حذف بيانات الهوية والاتصال وسجلات المركبات ورموز الدخول. ستبقى الرحلات والسجلات المالية والالتزامات اللازمة. هل تتابع؟',closedOnly:'الحذف النهائي متاح بعد إغلاق الحساب.',documents:'مستندات التسجيل',viewDocuments:'عرض الصور والمستندات',noDocuments:'لا توجد مستندات مرفوعة',idFront:'البطاقة - الأمام',idBack:'البطاقة - الخلف',vehicleDocuments:'وثائق السيارة',driverSelfie:'سيلفي السائق',vehiclePhoto:'صورة السيارة',documentLoadError:'تعذر تحميل المستندات'},en:{accounts:'Accounts',vehicles:'Vehicles awaiting approval',approveVehicle:'Approve vehicle',rejectVehicle:'Reject vehicle',trips:'Trips',audit:'Audit log',policies:'Approval policies',settings:'Security & Password',logout:'Logout',passengers:'Passengers',drivers:'Drivers',activeDrivers:'Approved drivers',pending:'Pending',tripCount:'Trips',inactive:'Inactive +6 months',suspended:'Temporarily suspended',closed:'Closed',driver:'Driver',passenger:'Passenger',active:'Active',blocked:'Blocked',rejected:'Rejected',waiting:'Pending approval',approvalTitle:'Account approval policies',passengerPolicy:'Passenger approval',driverPolicy:'Driver approval',manual:'Admin approval',automatic:'Automatic',save:'Save settings',loading:'Loading...',saved:'Settings saved',error:'Operation failed',verifyNotice:'Automatic activation remains disabled until identity/document verification is integrated.',verification:'Verification',approve:'Approve',issue:'Issue code',stop:'Suspend',reactivate:'Reactivate',close:'Close account',deleteData:'Permanently erase personal data',noAccounts:'No accounts',noTrips:'No trips',noLogs:'No records',showPassword:'Show password',hidePassword:'Hide password',username:'Username',password:'Password',login:'Secure login',loginTitle:'Administrator login',forgot:'Forgot password?',setupTitle:'Set up first administrator',setupSecret:'Server setup secret',newUsername:'New username',newPassword:'New password',confirmPassword:'Confirm password',setup:'Create administrator',setupHelp:'Requires the setup secret configured by the server owner in Render.',recoverTitle:'Recover administrator password',recoveryCode:'Recovery code',recover:'Reset password',bootstrapTitle:'No recovery code?',bootstrapHelp:'The server owner can issue an emergency code using ADMIN_SETUP_SECRET stored in Render. Never share it.',ownerSecret:'Owner secret from Render',issueEmergencyCode:'Issue emergency code',emergencyCodeNotice:'One-time code. Save it, then complete recovery.',backLogin:'Back to login',settingsTitle:'Administrator security',changePassword:'Change password',currentPassword:'Current password',passwordHint:'Use at least 12 characters.',change:'Change password',recoveryHelp:'Generate a new one-time code after verifying your current password.',generateRecovery:'Generate recovery code',copy:'Copy code',copied:'Copied',passwordChanged:'Password changed; session renewed.',passwordMismatch:'Passwords do not match',networkError:'Could not connect to server.',minPassword:'Password must be at least 12 characters.',inactiveLabel:'Inactive',lastActivity:'Last activity',created:'Registered',reasonPrompt:'Enter a reason:',passwordPrompt:'Enter current administrator password:',confirmDelete:'Type DELETE to confirm',closeConfirm:'Close this account? It will no longer be able to use the service.',deleteConfirm:'Identity, contact data, vehicle records and login codes will be erased. Trips and required financial records will remain. Continue?',closedOnly:'Final data erasure is available only after account closure.',documents:'Registration documents',viewDocuments:'View photos & documents',noDocuments:'No uploaded documents',idFront:'National ID - front',idBack:'National ID - back',vehicleDocuments:'Vehicle documents',driverSelfie:'Driver selfie',vehiclePhoto:'Vehicle photo',documentLoadError:'Could not load documents'}};
const t=k=>words[lang][k]||k;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function setDirection(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}function shell(x){app.innerHTML=x}
async function api(p,b,m='GET'){const r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b!==undefined?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}async function publicPost(p,b){const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}
function passwordField(id,placeholder,autocomplete='new-password'){return `<div class="password-field"><input id="${id}" type="password" placeholder="${esc(placeholder)}" autocomplete="${autocomplete}" required><button type="button" data-eye="${id}">👁️‍🗨️</button></div>`}function wireEyes(){document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='text'?'👁️':'👁️‍🗨️'})}
async function checkAdminStatus(){try{const r=await fetch(API+'/admin/status'),d=await r.json();if(!r.ok)throw Error(d.error||t('error'));d.setupRequired?showSetup():showLogin()}catch(e){showLogin(e.message)}}
function showLogin(error=''){currentScreen='login';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg mb-3">${t('loginTitle')}</h2><form id="loginForm"><input id="user" placeholder="${t('username')}" autocomplete="username" required>${passwordField('pass',t('password'),'current-password')}<button class="primary w-full mt-2">${t('login')}</button></form><button class="tab w-full mt-2" id="forgotBtn">${t('forgot')}</button><p id="loginError" class="text-red-600 text-sm mt-2">${esc(error)}</p></section>`);wireEyes();document.getElementById('forgotBtn').onclick=showRecover;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('loginError');try{const d=await publicPost('/admin/login',{username:user.value,password:pass.value});token=d.token;sessionStorage.setItem('mw_admin_token',token);await dashboard()}catch(x){out.textContent=x.message}}}
function showSetup(){currentScreen='setup';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg">${t('setupTitle')}</h2><p class="muted text-sm">${t('setupHelp')}</p><form id="setupForm"><input id="setupSecret" type="password" placeholder="${t('setupSecret')}" required><input id="setupUser" placeholder="${t('newUsername')}" minlength="3" required>${passwordField('setupPass',t('newPassword'))}${passwordField('setupConfirm',t('confirmPassword'))}<button class="primary w-full">${t('setup')}</button></form><p id="setupError" class="text-red-600"></p></section>`);wireEyes();document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();const password=setupPass.value,confirmation=setupConfirm.value;if(password.length<12)return setupError.textContent=t('minPassword');if(password!==confirmation)return setupError.textContent=t('passwordMismatch');try{const d=await publicPost('/admin/setup',{setupSecret:setupSecret.value,username:setupUser.value,password,confirmation});token=d.token;sessionStorage.setItem('mw_admin_token',token);showOneTimeCode(d.recoveryCode,()=>dashboard())}catch(x){setupError.textContent=x.message}}}
function showRecover(){currentScreen='recover';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg">${t('recoverTitle')}</h2><form id="recoverForm"><input id="recoverUser" placeholder="${t('username')}" required><input id="recoveryCode" placeholder="${t('recoveryCode')}" required>${passwordField('recoverPass',t('newPassword'))}${passwordField('recoverConfirm',t('confirmPassword'))}<button class="primary w-full">${t('recover')}</button></form><hr class="my-4"><h3 class="font-bold">${t('bootstrapTitle')}</h3><p class="muted text-xs">${t('bootstrapHelp')}</p><form id="bootstrapForm"><input id="bootstrapUser" placeholder="${t('username')}" required><input id="bootstrapSecret" type="password" placeholder="${t('ownerSecret')}" required><button class="tab w-full">${t('issueEmergencyCode')}</button></form><button class="tab w-full mt-3" id="backLogin">${t('backLogin')}</button><p id="recoverError" class="text-red-600 text-sm"></p></section>`);wireEyes();backLogin.onclick=showLogin;bootstrapForm.onsubmit=async e=>{e.preventDefault();try{const uname=bootstrapUser.value;const d=await publicPost('/admin/recovery-bootstrap',{username:uname,setupSecret:bootstrapSecret.value});showOneTimeCode(d.recoveryCode,()=>{showRecover();recoverUser.value=uname;recoveryCode.value=d.recoveryCode})}catch(x){recoverError.textContent=x.message}};recoverForm.onsubmit=async e=>{e.preventDefault();const np=recoverPass.value,cf=recoverConfirm.value;if(np.length<12)return recoverError.textContent=t('minPassword');if(np!==cf)return recoverError.textContent=t('passwordMismatch');try{await publicPost('/admin/recover',{username:recoverUser.value,recoveryCode:recoveryCode.value,newPassword:np,confirmation:cf});showLogin(lang==='ar'?'تمت الاستعادة. سجل الدخول.':'Password reset. Please sign in.')}catch(x){recoverError.textContent=x.message}}}
function showOneTimeCode(code,done){currentScreen='code';oneTimeCodeValue=code;oneTimeCodeDone=done;shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold">${t('recoverTitle')}</h2><div class="notice my-3">${lang==='ar'?'انسخ الرمز واحفظه الآن؛ لن يظهر مرة أخرى.':'Copy and save this code now; it will not be shown again.'}</div><textarea id="codeArea" readonly class="w-full p-3 border rounded-lg" dir="ltr" rows="3">${esc(code)}</textarea><button class="primary w-full mt-2" id="copyCode">${t('copy')}</button><button class="tab w-full mt-2" id="continueCode">${lang==='ar'?'حفظت الرمز والمتابعة':'Saved — continue'}</button><p id="copyMsg"></p></section>`);copyCode.onclick=async()=>{try{await navigator.clipboard.writeText(code);copyMsg.textContent=t('copied')}catch{codeArea.select();copyMsg.textContent='انسخ الرمز يدوياً'}};continueCode.onclick=()=>{const next=oneTimeCodeDone;oneTimeCodeValue='';oneTimeCodeDone=null;next&&next()}}
function statusText(s){return ({active:t('active'),pending:t('waiting'),blocked:t('blocked'),rejected:t('rejected')})[s]||s}function lifecycleText(a){if(a.lifecycle_state==='suspended')return t('suspended');if(a.lifecycle_state==='closed')return t('closed');if(a.lifecycle_state==='anonymized')return lang==='ar'?'بيانات مخفية':'Anonymized';if(a.is_inactive)return t('inactiveLabel');return statusText(a.status)}
async function dashboard(){currentScreen='dashboard';try{const [ov,ac,tr]=await Promise.all([api('/admin/overview'),api('/admin/accounts'),api('/admin/trips')]);window.accounts=ac.accounts;window.trips=tr.trips;const o=ov.overview;shell(`<div class="flex flex-wrap gap-2 mb-3"><button class="tab" onclick="showTab('accounts')">${t('accounts')}</button><button class="tab" onclick="showTab('vehicles')">${t('vehicles')} (${esc(o.pending_vehicles||0)})</button><button class="tab" onclick="showTab('trips')">${t('trips')}</button><button class="tab" onclick="showTab('policies')">${t('policies')}</button><button class="tab" onclick="showTab('audit')">${t('audit')}</button><button class="tab" onclick="showTab('settings')">${t('settings')}</button><button class="gold" onclick="logout()">${t('logout')}</button></div><section class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">${[[t('passengers'),o.passengers],[t('drivers'),o.drivers],[t('activeDrivers'),o.active_drivers],[t('pending'),o.pending_accounts],[t('inactive'),o.inactive_accounts],[t('suspended'),o.suspended_accounts],[t('closed'),o.closed_accounts],[t('tripCount'),o.trips]].map(x=>`<div class="card"><p class="muted text-xs">${x[0]}</p><b class="text-xl">${esc(x[1]??0)}</b></div>`).join('')}</section><section id="panel" class="card"></section>`);showTab('accounts')}catch(e){if(/session|جلسة|token/i.test(e.message)){logout();return}shell(`<section class="card"><p class="text-red-600">${esc(e.message)}</p><button class="gold mt-2" onclick="logout()">${t('logout')}</button></section>`)} }
window.showTab=async tab=>{const p=document.getElementById('panel');if(!p)return;if(tab==='accounts'){const tabs=[['all','الكل','All'],['inactive',t('inactive'),'Inactive'],['suspended',t('suspended'),'Suspended'],['closed',t('closed'),'Closed']];p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('accounts')}</h2><div class="flex flex-wrap gap-2 mb-3">${tabs.map(([k,a,b])=>`<button class="tab" onclick="renderAccounts('${k}')">${lang==='ar'?a:b}</button>`).join('')}</div><div id="accountsList"></div>`;renderAccounts('all')}else if(tab==='vehicles'){await loadPendingVehicles()}else if(tab==='trips'){p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('trips')}</h2>${(window.trips||[]).map(x=>`<article class="border-b py-3"><b>#${esc(x.id)} - ${esc(x.passenger_name||'')}</b><p class="muted text-sm">${esc(x.dropoff_address)} | ${esc(x.fare_amount)} | ${esc(x.status)}</p></article>`).join('')||t('noTrips')}`}else if(tab==='policies'){await loadPolicies()}else if(tab==='settings'){showSecurity()}else{try{const d=await api('/admin/audit');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('audit')}</h2>${d.logs.map(x=>`<p class="border-b py-2 text-sm">${esc(x.action)} - ${esc(x.target_id)} - ${new Date(x.created_at).toLocaleString(lang==='ar'?'ar':'en')}</p>`).join('')||t('noLogs')}`}catch(e){p.textContent=e.message}}};
window.renderAccounts=filter=>{const list=document.getElementById('accountsList');if(!list)return;let rows=window.accounts||[];if(filter==='inactive')rows=rows.filter(a=>a.is_inactive);if(filter==='suspended')rows=rows.filter(a=>a.lifecycle_state==='suspended');if(filter==='closed')rows=rows.filter(a=>['closed','anonymized'].includes(a.lifecycle_state));list.innerHTML=rows.map(a=>`<article class="border-b border-slate-400/30 py-3"><div class="flex justify-between gap-2 flex-wrap"><b>${esc(a.full_name)}</b><span class="text-xs">${a.role==='driver'?t('driver'):t('passenger')} · ${esc(lifecycleText(a))}</span></div><p class="muted text-xs">${esc(a.national_id||'—')} | ${esc(a.phone||'—')}</p><p class="text-xs mt-1">${t('policies')}: ${a.approval_mode==='automatic'?t('automatic'):t('manual')} · ${t('verification')}: ${esc(a.verification_status||'—')}</p><p class="text-xs muted">${t('lastActivity')}: ${a.last_activity_at?new Date(a.last_activity_at).toLocaleString(lang==='ar'?'ar':'en'):'—'} · ${t('created')}: ${new Date(a.created_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${a.role==='driver'?`<p class="text-xs mt-1">${esc(a.car_type||'')} ${esc(a.car_model||'')} - ${esc(a.car_color||'')} - ${esc(a.plate_number||'')}</p>`:''}<div class="flex flex-wrap gap-2 mt-2">${Number(a.document_count||0)>0?`<button class="tab" onclick="viewDocuments(${Number(a.id)})">${t('viewDocuments')} (${Number(a.document_count)})</button>`:''}${a.status==='pending'&&a.lifecycle_state==='open'?`<button class="primary" onclick="setStatus(${Number(a.id)},'active')">${t('approve')}</button>`:''}${a.status==='active'&&a.lifecycle_state==='open'?`<button class="tab" onclick="issue(${Number(a.id)})">${t('issue')}</button>`:''}${a.lifecycle_state==='open'?`<button class="tab" onclick="lifecycle(${Number(a.id)},'suspend')">${t('stop')}</button><button class="danger" onclick="lifecycle(${Number(a.id)},'close')">${t('close')}</button>`:''}${a.lifecycle_state==='suspended'?`<button class="primary" onclick="lifecycle(${Number(a.id)},'reactivate')">${t('reactivate')}</button><button class="danger" onclick="lifecycle(${Number(a.id)},'close')">${t('close')}</button>`:''}${a.lifecycle_state==='closed'?`<button class="danger" onclick="anonymize(${Number(a.id)})">${t('deleteData')}</button>`:''}${a.lifecycle_state==='anonymized'?`<span class="muted text-xs">${lang==='ar'?'تم إخفاء البيانات الشخصية':'Personal data anonymized'}</span>`:''}</div></article>`).join('')||t('noAccounts')};
window.viewDocuments=async id=>{
 try{
  const d=await api(`/admin/accounts/${id}/documents`);
  const old=document.getElementById('documentsModal');if(old)old.remove();
  const labels={national_id_front:t('idFront'),national_id_back:t('idBack'),vehicle_documents:t('vehicleDocuments'),driver_selfie:t('driverSelfie'),vehicle_photo:t('vehiclePhoto')};
  const modal=document.createElement('div');modal.id='documentsModal';modal.style.cssText='position:fixed;inset:0;background:#000b;z-index:10000;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:center';
  modal.innerHTML=`<section style="background:var(--card);color:var(--fg);width:100%;max-width:760px;border-radius:16px;padding:16px;margin:auto"><div class="flex justify-between items-center gap-2"><h2 class="font-bold text-lg">${t('documents')} #${Number(id)}</h2><button class="danger" id="closeDocuments">×</button></div><div id="documentsContent" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4"></div></section>`;
  document.body.appendChild(modal);document.getElementById('closeDocuments').onclick=()=>modal.remove();
  const content=document.getElementById('documentsContent');
  if(!d.documents?.length){content.textContent=t('noDocuments');return}
  for(const doc of d.documents){
   const card=document.createElement('article');card.className='card';
   const title=document.createElement('b');title.textContent=labels[doc.document_type]||doc.document_type;card.appendChild(title);
   const img=document.createElement('img');img.alt=title.textContent;img.style.cssText='width:100%;max-height:340px;object-fit:contain;margin-top:8px;border-radius:10px;background:#111';img.src='';card.appendChild(img);
   const meta=document.createElement('p');meta.className='muted text-xs mt-2';meta.textContent=`${doc.file_name} · ${(Number(doc.size_bytes||0)/1024).toFixed(0)} KB`;card.appendChild(meta);content.appendChild(card);
   fetch(API+`/admin/documents/${Number(doc.id)}`,{headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw Error('load');return r.blob()}).then(blob=>{img.src=URL.createObjectURL(blob)}).catch(()=>{meta.textContent=t('documentLoadError')});
  }
 }catch(e){alert(e.message||t('documentLoadError'))}
};
async function loadPendingVehicles(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('vehicles')}</h2><p class="muted">${t('loading')}</p>`;try{const d=await api('/admin/vehicles/pending');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('vehicles')}</h2>${(d.vehicles||[]).map(v=>`<article class="border-b py-3"><b>${esc(v.driver_name||'')} · ${esc(v.driver_phone||'')}</b><p class="text-sm mt-1">${esc(v.car_type)} ${esc(v.car_model)} · ${esc(v.car_color)}</p><p class="text-sm muted">${esc(v.plate_number)} · ${esc(v.registration_number)}</p><p class="text-xs muted">${new Date(v.submitted_at).toLocaleString(lang==='ar'?'ar':'en')}</p><div class="flex gap-2 mt-2"><button class="primary" onclick="vehicleDecision(${Number(v.id)},'approve')">${t('approveVehicle')}</button><button class="danger" onclick="vehicleDecision(${Number(v.id)},'reject')">${t('rejectVehicle')}</button></div></article>`).join('')||t('noAccounts')}`}catch(e){p.textContent=e.message}}window.vehicleDecision=async(id,decision)=>{let reason='';if(decision==='reject'){reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return}if(!confirm(decision==='approve'?t('approveVehicle')+'?':t('rejectVehicle')+'?'))return;try{await api(`/admin/vehicles/${id}/decision`,{decision,reason},'PATCH');await dashboard()}catch(e){alert(e.message)}};
window.lifecycle=async(id,action)=>{try{let reason='';if(action==='suspend'||action==='close'){reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return;if(action==='close'&&!confirm(t('closeConfirm')))return}if(action==='reactivate'&&!confirm(t('reactivate')+'?'))return;await api(`/admin/accounts/${id}/lifecycle`,{action,reason,confirmation:action==='close'?'CLOSE':''},'PATCH');await dashboard()}catch(e){alert(e.message)}};
window.anonymize=async id=>{if(!confirm(t('deleteConfirm')))return;const reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return;const currentPassword=prompt(t('passwordPrompt'));if(!currentPassword)return;const confirmation=prompt(t('confirmDelete'));if(confirmation!=='DELETE')return alert(t('error'));try{const d=await api(`/admin/accounts/${id}/anonymize`,{reason,currentPassword,confirmation},'POST');alert(d.message||t('saved'));await dashboard()}catch(e){alert(e.message)}};
window.setStatus=async(id,status)=>{try{const a=(window.accounts||[]).find(x=>String(x.id)===String(id));if(!a)throw Error(t('error'));await api(`/admin/${a.role==='driver'?'drivers':'passengers'}/${id}/status`,{status},'PATCH');await dashboard()}catch(e){alert(e.message)}};window.issue=async id=>{try{const d=await api(`/admin/accounts/${id}/issue-code`,{},'POST');alert((lang==='ar'?'رمز التفعيل: ':'Activation code: ')+d.code+'\n'+(lang==='ar'?'صالح لمدة 5 دقائق.':'Valid for 5 minutes.'))}catch(e){alert(e.message)}};
async function loadPolicies(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold">${t('approvalTitle')}</h2><p class="muted">${t('loading')}</p>`;try{const d=await api('/admin/approval-policies'),x=d.policies;p.innerHTML=`<h2 class="font-bold text-lg mb-4">${t('approvalTitle')}</h2><label>${t('passengerPolicy')}</label><select id="passengerPolicy"><option value="manual" ${x.passenger==='manual'?'selected':''}>${t('manual')}</option><option value="automatic" ${x.passenger==='automatic'?'selected':''}>${t('automatic')}</option></select><label>${t('driverPolicy')}</label><select id="driverPolicy"><option value="manual" ${x.driver==='manual'?'selected':''}>${t('manual')}</option><option value="automatic" ${x.driver==='automatic'?'selected':''}>${t('automatic')}</option></select><div class="notice text-sm my-3">${t('verifyNotice')}</div><button class="primary w-full" onclick="savePolicies()">${t('save')}</button><p id="policyMsg"></p>`}catch(e){p.textContent=e.message}}window.savePolicies=async()=>{try{await api('/admin/approval-policies',{passenger:passengerPolicy.value,driver:driverPolicy.value},'PUT');policyMsg.textContent=t('saved')}catch(e){policyMsg.textContent=e.message}};
function showSecurity(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-4">${t('settingsTitle')}</h2><section class="border-b pb-4 mb-4"><h3 class="font-bold">${t('changePassword')}</h3><p class="muted text-xs">${t('passwordHint')}</p><form id="changePasswordForm">${passwordField('currentAdminPass',t('currentPassword'),'current-password')}${passwordField('newAdminPass',t('newPassword'))}${passwordField('confirmAdminPass',t('confirmPassword'))}<button class="primary w-full">${t('change')}</button></form><p id="passwordMsg"></p></section><section><h3 class="font-bold">${t('recoverTitle')}</h3><p class="muted text-sm">${t('recoveryHelp')}</p><form id="recoveryForm">${passwordField('recoveryCurrentPass',t('currentPassword'),'current-password')}<button class="tab w-full">${t('generateRecovery')}</button></form><p id="recoveryMsg"></p></section>`;wireEyes();changePasswordForm.onsubmit=async e=>{e.preventDefault();const np=newAdminPass.value,cf=confirmAdminPass.value;if(np.length<12)return passwordMsg.textContent=t('minPassword');if(np!==cf)return passwordMsg.textContent=t('passwordMismatch');try{const d=await api('/admin/password',{currentPassword:currentAdminPass.value,newPassword:np,confirmation:cf},'PUT');token=d.token;sessionStorage.setItem('mw_admin_token',token);passwordMsg.textContent=t('passwordChanged');e.target.reset()}catch(x){passwordMsg.textContent=x.message}};recoveryForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/admin/recovery-code',{currentPassword:recoveryCurrentPass.value},'POST');showOneTimeCode(d.recoveryCode,()=>showTab('settings'))}catch(x){recoveryMsg.textContent=x.message}}}
window.logout=()=>{token='';sessionStorage.removeItem('mw_admin_token');showLogin()};document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_admin_theme',theme)};document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_admin_lang',lang);setDirection();if(currentScreen==='dashboard')dashboard();else if(currentScreen==='setup')showSetup();else if(currentScreen==='recover')showRecover();else if(currentScreen==='code')showOneTimeCode(oneTimeCodeValue,oneTimeCodeDone);else showLogin()};setDirection();if(token)dashboard();else checkAdminStatus();
</script>
