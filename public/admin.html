function showLogin(error=''){currentScreen='login';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg mb-3">${t('loginTitle')}</h2><form id="loginForm"><input id="user" placeholder="${t('username')}" autocomplete="username" required>${passwordField('pass',t('password'),'current-password')}<button class="primary w-full mt-2">${t('login')}</button></form><button class="tab w-full mt-2" id="forgotBtn">${t('forgot')}</button><p id="loginError" class="text-red-600 text-sm mt-2">${esc(error)}</p></section>`);wireEyes();document.getElementById('forgotBtn').onclick=showRecover;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('loginError');try{const d=await publicPost('/admin/login',{username:user.value,password:pass.value});if(d.lockRequired){localStorage.setItem('mw_admin_username',user.value);showPatternUnlock(d.challenge,user.value);return}localStorage.setItem('mw_admin_username',user.value);token=d.token;sessionStorage.setItem('mw_admin_token',token);await dashboard()}catch(x){out.textContent=x.message}}}
function showPatternEntry(){showPatternUnlock('',localStorage.getItem('mw_admin_username')||'')}
function showPatternUnlock(challenge,username){currentScreen='unlock';let chosen=[];shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg mb-2">${t('unlockTitle')}</h2><p class="muted text-sm mb-3">${t('unlockHelp')}</p><input id="unlockUser" placeholder="${t('username')}" value="${esc(username||'')}" autocomplete="username"><div class="grid grid-cols-3 gap-3 max-w-xs mx-auto" id="patternGrid">${Array.from({length:9},(_,i)=>`<button type="button" class="tab text-xl" data-point="${i+1}" style="height:64px;border-radius:50%">●</button>`).join('')}</div><p id="patternValue" class="muted text-center mt-3"></p><button id="clearPattern" class="tab w-full mt-2">${lang==='ar'?'مسح النمط':'Clear pattern'}</button><button id="unlockPattern" class="primary w-full mt-2">${t('unlock')}</button><p id="unlockError" class="text-red-600 text-sm mt-2"></p><button class="tab w-full mt-3" onclick="showLogin()">${t('backLogin')}</button></section>`);const update=()=>patternValue.textContent=chosen.map(Number).join(' · ');let drawing=false;const addPoint=el=>{const b=el?.closest?.('[data-point]');if(!b||!patternGrid.contains(b))return;const n=b.dataset.point;if(!chosen.includes(n)&&chosen.length<9){chosen.push(n);b.classList.add('primary');update()}};patternGrid.style.touchAction='none';patternGrid.addEventListener('pointerdown',e=>{drawing=true;patternGrid.setPointerCapture(e.pointerId);addPoint(e.target)});patternGrid.addEventListener('pointermove',e=>{if(drawing)addPoint(document.elementFromPoint(e.clientX,e.clientY))});patternGrid.addEventListener('pointerup',()=>drawing=false);patternGrid.addEventListener('pointercancel',()=>drawing=false);clearPattern.onclick=()=>{chosen=[];patternGrid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));update()};unlockPattern.onclick=async()=>{if(chosen.length<4||new Set(chosen).size<4){unlockError.textContent=t('patternInvalid');return}try{const ch=challenge|| (await publicPost('/admin/pattern-challenge',{username:unlockUser.value})).challenge;const d=await publicPost('/admin/unlock',{challenge:ch,pattern:chosen.join('')});token=d.token;localStorage.setItem('mw_admin_username',unlockUser.value);sessionStorage.setItem('mw_admin_token',token);sessionStorage.setItem('mw_admin_username',username);await dashboard()}catch(e){unlockError.textContent=e.message;challenge='';chosen=[];patternGrid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));update()}}}
function showSetup(){currentScreen='setup';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg">${t('setupTitle')}</h2><p class="muted text-sm">${t('setupHelp')}</p><form id="setupForm"><input id="setupSecret" type="password" placeholder="${t('setupSecret')}" required><input id="setupUser" placeholder="${t('newUsername')}" minlength="3" required>${passwordField('setupPass',t('newPassword'))}${passwordField('setupConfirm',t('confirmPassword'))}<button class="primary w-full">${t('setup')}</button></form><p id="setupError" class="text-red-600"></p></section>`);wireEyes();document.getElementById('setupForm').onsubmit=async e=>{e.preventDefault();const password=setupPass.value,confirmation=setupConfirm.value;if(password.length<12)return setupError.textContent=t('minPassword');if(password!==confirmation)return setupError.textContent=t('passwordMismatch');try{const d=await publicPost('/admin/setup',{setupSecret:setupSecret.value,username:setupUser.value,password,confirmation});token=d.token;sessionStorage.setItem('mw_admin_token',token);showOneTimeCode(d.recoveryCode,()=>dashboard())}catch(x){setupError.textContent=x.message}}}
function showRecover(){currentScreen='recover';shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold text-lg">${t('recoverTitle')}</h2><form id="recoverForm"><input id="recoverUser" placeholder="${t('username')}" required><input id="recoveryCode" placeholder="${t('recoveryCode')}" required>${passwordField('recoverPass',t('newPassword'))}${passwordField('recoverConfirm',t('confirmPassword'))}<button class="primary w-full">${t('recover')}</button></form><hr class="my-4"><h3 class="font-bold">${t('bootstrapTitle')}</h3><p class="muted text-xs">${t('bootstrapHelp')}</p><form id="bootstrapForm"><input id="bootstrapUser" placeholder="${t('username')}" required><input id="bootstrapSecret" type="password" placeholder="${t('ownerSecret')}" required><button class="tab w-full">${t('issueEmergencyCode')}</button></form><button class="tab w-full mt-3" id="backLogin">${t('backLogin')}</button><p id="recoverError" class="text-red-600 text-sm"></p></section>`);wireEyes();backLogin.onclick=showLogin;bootstrapForm.onsubmit=async e=>{e.preventDefault();try{const uname=bootstrapUser.value;const d=await publicPost('/admin/recovery-bootstrap',{username:uname,setupSecret:bootstrapSecret.value});showOneTimeCode(d.recoveryCode,()=>{showRecover();recoverUser.value=uname;recoveryCode.value=d.recoveryCode})}catch(x){recoverError.textContent=x.message}};recoverForm.onsubmit=async e=>{e.preventDefault();const np=recoverPass.value,cf=recoverConfirm.value;if(np.length<12)return recoverError.textContent=t('minPassword');if(np!==cf)return recoverError.textContent=t('passwordMismatch');try{await publicPost('/admin/recover',{username:recoverUser.value,recoveryCode:recoveryCode.value,newPassword:np,confirmation:cf});showLogin(lang==='ar'?'تمت الاستعادة. سجل الدخول.':'Password reset. Please sign in.')}catch(x){recoverError.textContent=x.message}}}
function showOneTimeCode(code,done){currentScreen='code';oneTimeCodeValue=code;oneTimeCodeDone=done;shell(`<section class="card max-w-md mx-auto"><h2 class="font-bold">${t('recoverTitle')}</h2><div class="notice my-3">${lang==='ar'?'انسخ الرمز واحفظه الآن؛ لن يظهر مرة أخرى.':'Copy and save this code now; it will not be shown again.'}</div><textarea id="codeArea" readonly class="w-full p-3 border rounded-lg" dir="ltr" rows="3">${esc(code)}</textarea><button class="primary w-full mt-2" id="copyCode">${t('copy')}</button><button class="tab w-full mt-2" id="continueCode">${lang==='ar'?'حفظت الرمز والمتابعة':'Saved — continue'}</button><p id="copyMsg"></p></section>`);copyCode.onclick=async()=>{try{await navigator.clipboard.writeText(code);copyMsg.textContent=t('copied')}catch{codeArea.select();copyMsg.textContent='انسخ الرمز يدوياً'}};continueCode.onclick=()=>{const next=oneTimeCodeDone;oneTimeCodeValue='';oneTimeCodeDone=null;next&&next()}}
function statusText(s){return ({active:t('active'),pending:t('waiting'),blocked:t('blocked'),rejected:t('rejected')})[s]||s}function lifecycleText(a){if(a.lifecycle_state==='suspended')return t('suspended');if(a.lifecycle_state==='closed')return t('closed');if(a.lifecycle_state==='anonymized')return lang==='ar'?'بيانات مخفية':'Anonymized';if(a.is_inactive)return t('inactiveLabel');return statusText(a.status)}

async function showWhatsAppSettings(){
 const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-2">${lang==='ar'?'إعدادات إرسال رمز التفعيل عبر واتساب':'WhatsApp OTP settings'}</h2><p id="waStatus" class="notice mb-3">${t('loading')}</p><form id="waForm"><label><input type="checkbox" id="waEnabled"> ${lang==='ar'?'تفعيل الإرسال التلقائي':'Enable automatic sending'}</label><label>${lang==='ar'?'اسم قالب OTP المعتمد في Meta':'Meta-approved OTP template name'}<input id="waTemplate" placeholder="mesh wari_otp" dir="ltr"></label><label>${lang==='ar'?'لغة القالب (مثل ar أو en)':'Template language (e.g. ar or en)'}<input id="waLanguage" value="ar" dir="ltr"></label><button class="primary w-full mt-3">${lang==='ar'?'حفظ الإعدادات':'Save settings'}</button></form><p class="muted text-xs mt-3">${lang==='ar'?'لا تُعرض مفاتيح واتساب السرية هنا؛ تحفظ حصرياً في Render Environment Variables. يجب اعتماد قالب OTP في Meta قبل التشغيل.':'WhatsApp secrets are never shown here; store them only in Render Environment Variables. An approved OTP template is required.'}</p>`;
 try{const d=await api('/admin/whatsapp/settings');waEnabled.checked=d.enabled;waTemplate.value=d.template||'';waLanguage.value=d.language||'ar';waStatus.textContent=d.configured?(lang==='ar'?'إعدادات واتساب والقالب جاهزة.':'WhatsApp credentials and template are configured.'):(lang==='ar'?'لم تكتمل متغيرات Render أو اسم القالب بعد؛ الإرسال التلقائي غير جاهز.':'Render variables or template are incomplete; automatic sending is not ready.')}catch(e){waStatus.textContent=e.message}
 waForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/admin/whatsapp/settings',{enabled:waEnabled.checked,template:waTemplate.value.trim(),language:waLanguage.value.trim()},'PUT');waStatus.textContent=d.configured?(lang==='ar'?'تم حفظ الإعدادات وهي جاهزة.':'Saved and configured.'):(lang==='ar'?'تم الحفظ، لكن الإعداد غير مكتمل بعد.':'Saved, but configuration is incomplete.');alert(lang==='ar'?'تم حفظ إعدادات واتساب.':'WhatsApp settings saved.')}catch(x){waStatus.textContent=x.message}};
}
async function showOtpAccounts(){
 const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${lang==='ar'?'إصدار رمز تفعيل':'Issue activation code'}</h2><div id="otpAccounts">${t('loading')}</div>`;
 try{const d=await api('/admin/otp-eligible-accounts');otpAccounts.innerHTML=d.accounts.map(a=>`<article class="border-b py-3 flex flex-wrap justify-between gap-2 items-center"><div><b>${esc(a.full_name)}</b><p class="muted text-xs" dir="ltr">${esc(a.phone)}</p></div><button class="primary" onclick="issue(${Number(a.id)})">${t('issue')}</button></article>`).join('')||`<p class="muted">${lang==='ar'?'لا توجد حسابات معتمدة':'No active accounts'}</p>`}catch(e){otpAccounts.textContent=e.message}
}

window.renderAccounts=filter=>{const list=document.getElementById('accountsList');if(!list)return;let rows=window.accounts||[];if(filter==='inactive')rows=rows.filter(a=>a.is_inactive);if(filter==='suspended')rows=rows.filter(a=>a.lifecycle_state==='suspended');if(filter==='closed')rows=rows.filter(a=>['closed','anonymized'].includes(a.lifecycle_state));list.innerHTML=rows.map(a=>`<article class="border-b border-slate-400/30 py-3"><div class="flex justify-between gap-2 flex-wrap"><b>${esc(a.full_name)}</b><span class="text-xs">${a.role==='driver'?t('driver'):t('passenger')} · ${esc(lifecycleText(a))}</span></div><p class="muted text-xs">${esc(a.national_id||'—')} | ${esc(a.phone||'—')}</p><p class="text-xs mt-1">${t('policies')}: ${a.approval_mode==='automatic'?t('automatic'):t('manual')} · ${t('verification')}: ${esc(a.verification_status||'—')}</p><p class="text-xs muted">${t('lastActivity')}: ${a.last_activity_at?new Date(a.last_activity_at).toLocaleString(lang==='ar'?'ar':'en'):'—'} · ${t('created')}: ${new Date(a.created_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${a.role==='driver'?`<p class="text-xs mt-1">${esc(a.car_type||'')} ${esc(a.car_model||'')} - ${esc(a.car_color||'')} - ${esc(a.plate_number||'')}</p>`:''}<div class="flex flex-wrap gap-2 mt-2">${Number(a.document_count||0)>0?`<button class="tab" onclick="viewDocuments(${Number(a.id)})">${t('viewDocuments')} (${Number(a.document_count)})</button>`:''}${a.status==='pending'&&a.lifecycle_state==='open'?`<button class="primary" onclick="setStatus(${Number(a.id)},'active')">${t('approve')}</button>`:''}${a.status==='active'&&a.lifecycle_state==='open'?`<button class="tab" onclick="issue(${Number(a.id)})">${t('issue')}</button>`:''}${a.lifecycle_state==='open'?`<button class="tab" onclick="lifecycle(${Number(a.id)},'suspend')">${t('stop')}</button><button class="danger" onclick="lifecycle(${Number(a.id)},'close')">${t('close')}</button>`:''}${a.lifecycle_state==='suspended'?`<button class="primary" onclick="lifecycle(${Number(a.id)},'reactivate')">${t('reactivate')}</button><button class="danger" onclick="lifecycle(${Number(a.id)},'close')">${t('close')}</button>`:''}${a.lifecycle_state==='closed'?`<button class="danger" onclick="anonymize(${Number(a.id)})">${t('deleteData')}</button>`:''}${a.lifecycle_state==='anonymized'?`<span class="muted text-xs">${lang==='ar'?'تم إخفاء البيانات الشخصية':'Personal data anonymized'}</span>`:''}</div></article>`).join('')||t('noAccounts')};
window.viewDocuments=async id=>{
 try{
  const d=await api(`/admin/accounts/${id}/documents`);
  const old=document.getElementById('documentsModal');if(old)old.remove();
  const labels={national_id_front:t('idFront'),national_id_back:t('idBack'),vehicle_documents:t('vehicleDocuments'),driver_selfie:t('driverSelfie'),vehicle_photo:t('vehiclePhoto')};
  const modal=document.createElement('div');modal.id='documentsModal';modal.style.cssText='position:fixed;inset:0;background:#000b;z-index:10000;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:center';
  modal.innerHTML=`<section style="background:var(--card);color:var(--fg);width:100%;max-width:760px;border-radius:16px;padding:16px;margin:auto"><div class="flex justify-between items-center gap-2"><h2 class="font-bold text-lg">${t('documents')} #${Number(id)}</h2><button class="danger" id="closeDocuments">×</button></div><div id="documentsContent" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4"></div></section>`;
  document.body.appendChild(modal);document.getElementById('closeDocuments').onclick=()=>modal.remove();
  const content=document.getElementById('documentsContent');
  if(!d.documents?.length){content.textContent=t('noDocuments');return}
  for(const doc of d.documents){
   const card=document.createElement('article');card.className='card';
   const title=document.createElement('b');title.textContent=labels[doc.document_type]||doc.document_type;card.appendChild(title);
   const img=document.createElement('img');img.alt=title.textContent;img.style.cssText='width:100%;max-height:340px;object-fit:contain;margin-top:8px;border-radius:10px;background:#111';img.src='';card.appendChild(img);
   const meta=document.createElement('p');meta.className='muted text-xs mt-2';meta.textContent=`${doc.file_name} · ${(Number(doc.size_bytes||0)/1024).toFixed(0)} KB`;card.appendChild(meta);content.appendChild(card);
   fetch(API+`/admin/documents/${Number(doc.id)}`,{headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw Error('load');return r.blob()}).then(blob=>{img.src=URL.createObjectURL(blob)}).catch(()=>{meta.textContent=t('documentLoadError')});
  }
 }catch(e){alert(e.message||t('documentLoadError'))}
};
async function loadPendingVehicles(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('vehicles')}</h2><p class="muted">${t('loading')}</p>`;try{const d=await api('/admin/vehicles/pending');p.innerHTML=`<h2 class="font-bold text-lg mb-3">${t('vehicles')}</h2>${(d.vehicles||[]).map(v=>`<article class="border-b py-3"><b>${esc(v.driver_name||'')} · ${esc(v.driver_phone||'')}</b><p class="text-sm mt-1">${esc(v.car_type)} ${esc(v.car_model)} · ${esc(v.car_color)}</p><p class="text-sm muted">${esc(v.plate_number)} · ${esc(v.registration_number)}</p><p class="text-xs muted">${new Date(v.submitted_at).toLocaleString(lang==='ar'?'ar':'en')}</p><div class="flex gap-2 mt-2"><button class="primary" onclick="vehicleDecision(${Number(v.id)},'approve')">${t('approveVehicle')}</button><button class="danger" onclick="vehicleDecision(${Number(v.id)},'reject')">${t('rejectVehicle')}</button></div></article>`).join('')||t('noAccounts')}`}catch(e){p.textContent=e.message}}window.vehicleDecision=async(id,decision)=>{let reason='';if(decision==='reject'){reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return}if(!confirm(decision==='approve'?t('approveVehicle')+'?':t('rejectVehicle')+'?'))return;try{await api(`/admin/vehicles/${id}/decision`,{decision,reason},'PATCH');await dashboard()}catch(e){alert(e.message)}};
window.lifecycle=async(id,action)=>{try{let reason='';if(action==='suspend'||action==='close'){reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return;if(action==='close'&&!confirm(t('closeConfirm')))return}if(action==='reactivate'&&!confirm(t('reactivate')+'?'))return;await api(`/admin/accounts/${id}/lifecycle`,{action,reason,confirmation:action==='close'?'CLOSE':''},'PATCH');await dashboard()}catch(e){alert(e.message)}};
window.anonymize=async id=>{if(!confirm(t('deleteConfirm')))return;const reason=prompt(t('reasonPrompt'));if(!reason||reason.trim().length<3)return;const currentPassword=prompt(t('passwordPrompt'));if(!currentPassword)return;const confirmation=prompt(t('confirmDelete'));if(confirmation!=='DELETE')return alert(t('error'));try{const d=await api(`/admin/accounts/${id}/anonymize`,{reason,currentPassword,confirmation},'POST');alert(d.message||t('saved'));await dashboard()}catch(e){alert(e.message)}};
window.setStatus=async(id,status)=>{try{const a=(window.accounts||[]).find(x=>String(x.id)===String(id));if(!a)throw Error(t('error'));await api(`/admin/${a.role==='driver'?'drivers':'passengers'}/${id}/status`,{status},'PATCH');await dashboard()}catch(e){alert(e.message)}};window.issue=async id=>{try{const d=await api(`/admin/accounts/${id}/issue-code`,{},'POST');if(d.delivery==='sent')alert(lang==='ar'?'تم إرسال رمز التفعيل إلى واتساب بنجاح. صالح لمدة 5 دقائق.':'OTP sent to WhatsApp. Valid for 5 minutes.');else alert((lang==='ar'?'تعذر الإرسال التلقائي. سلّم الرمز يدوياً: ':'Automatic delivery unavailable. Deliver manually: ')+d.code+'\n'+(lang==='ar'?'صالح لمدة 5 دقائق.':'Valid for 5 minutes.'))}catch(e){alert(e.message)}};
async function loadPolicies(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold">${t('approvalTitle')}</h2><p class="muted">${t('loading')}</p>`;try{const d=await api('/admin/approval-policies'),x=d.policies;p.innerHTML=`<h2 class="font-bold text-lg mb-4">${t('approvalTitle')}</h2><label>${t('passengerPolicy')}</label><select id="passengerPolicy"><option value="manual" ${x.passenger==='manual'?'selected':''}>${t('manual')}</option><option value="automatic" ${x.passenger==='automatic'?'selected':''}>${t('automatic')}</option></select><label>${t('driverPolicy')}</label><select id="driverPolicy"><option value="manual" ${x.driver==='manual'?'selected':''}>${t('manual')}</option><option value="automatic" ${x.driver==='automatic'?'selected':''}>${t('automatic')}</option></select><div class="notice text-sm my-3">${t('verifyNotice')}</div><button class="primary w-full" onclick="savePolicies()">${t('save')}</button><p id="policyMsg"></p>`}catch(e){p.textContent=e.message}}window.savePolicies=async()=>{try{await api('/admin/approval-policies',{passenger:passengerPolicy.value,driver:driverPolicy.value},'PUT');policyMsg.textContent=t('saved')}catch(e){policyMsg.textContent=e.message}};
function bindPatternSetup(gridId,valueId,clearId){const grid=document.getElementById(gridId),label=document.getElementById(valueId);let points=[];const add=el=>{const b=el?.closest?.('[data-point]');if(!b||!grid.contains(b))return;const n=b.dataset.point;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('primary');label.textContent=points.join(' · ')}};let drawing=false;grid.style.touchAction='none';grid.addEventListener('pointerdown',e=>{drawing=true;grid.setPointerCapture(e.pointerId);add(e.target)});grid.addEventListener('pointermove',e=>{if(drawing)add(document.elementFromPoint(e.clientX,e.clientY))});grid.addEventListener('pointerup',()=>drawing=false);grid.addEventListener('pointercancel',()=>drawing=false);document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''};return()=>points.join('')}
function showSecurity(){const p=document.getElementById('panel');p.innerHTML=`<h2 class="font-bold text-lg mb-4">${t('settingsTitle')}</h2><section class="border-b pb-4 mb-4"><h3 class="font-bold mb-2">${t('lockTitle')}</h3><form id="lockForm"><label>${t('lockTitle')}<select id="lockMethod"><option value="password">${t('lockPassword')}</option><option value="pattern">${t('lockPattern')}</option></select></label><p class="muted text-xs">${t('patternHelp')}</p><div id="patternSetup" class="hidden"><p class="muted text-xs mt-2">${t('pattern')}</p><div id="adminPatternGrid" class="grid grid-cols-3 gap-2 max-w-xs mx-auto">${Array.from({length:9},(_,i)=>`<button type="button" class="tab" data-point="${i+1}" style="height:54px;border-radius:50%">●</button>`).join('')}</div><p id="adminPatternValue" class="muted text-center text-sm"></p><button type="button" id="adminPatternClear" class="tab w-full mt-1">${lang==='ar'?'مسح النمط':'Clear pattern'}</button><p class="muted text-xs mt-2">${t('patternAgain')}</p><div id="adminPatternGrid2" class="grid grid-cols-3 gap-2 max-w-xs mx-auto">${Array.from({length:9},(_,i)=>`<button type="button" class="tab" data-point="${i+1}" style="height:54px;border-radius:50%">●</button>`).join('')}</div><p id="adminPatternValue2" class="muted text-center text-sm"></p><button type="button" id="adminPatternClear2" class="tab w-full mt-1">${lang==='ar'?'مسح النمط':'Clear pattern'}</button></div>${passwordField('lockCurrentPass',t('currentPassword'),'current-password')}<button class="primary w-full">${t('saveLock')}</button></form><p id="lockMsg"></p></section><section class="border-b pb-4 mb-4"><h3 class="font-bold">${t('changePassword')}</h3><p class="muted text-xs">${t('passwordHint')}</p><form id="changePasswordForm">${passwordField('currentAdminPass',t('currentPassword'),'current-password')}${passwordField('newAdminPass',t('newPassword'))}${passwordField('confirmAdminPass',t('confirmPassword'))}<button class="primary w-full">${t('change')}</button></form><p id="passwordMsg"></p></section><section><h3 class="font-bold">${t('recoverTitle')}</h3><p class="muted text-sm">${t('recoveryHelp')}</p><form id="recoveryForm">${passwordField('recoveryCurrentPass',t('currentPassword'),'current-password')}<button class="tab w-full">${t('generateRecovery')}</button></form><p id="recoveryMsg"></p></section>`;wireEyes();let patternA=()=>'',patternB=()=>'';lockMethod.onchange=()=>{patternSetup.classList.toggle('hidden',lockMethod.value!=='pattern');if(lockMethod.value==='pattern'){patternA=bindPatternSetup('adminPatternGrid','adminPatternValue','adminPatternClear');patternB=bindPatternSetup('adminPatternGrid2','adminPatternValue2','adminPatternClear2')}};lockForm.onsubmit=async e=>{e.preventDefault();const method=lockMethod.value,pattern=patternA(),again=patternB();if(method==='pattern'&&(pattern.length<4||!/^[1-9]{4,9}$/.test(pattern)||new Set(pattern).size<4||pattern!==again)){lockMsg.textContent=t('patternInvalid');return}try{const d=await api('/admin/lock',{method,pattern,currentPassword:lockCurrentPass.value},'PUT');token=d.token;sessionStorage.setItem('mw_admin_token',token);lockMsg.textContent=t('lockSaved');e.target.reset();lockMethod.value=method;patternSetup.classList.toggle('hidden',method!=='pattern')}catch(x){lockMsg.textContent=x.message}};changePasswordForm.onsubmit=async e=>{e.preventDefault();const np=newAdminPass.value,cf=confirmAdminPass.value;if(np.length<12)return passwordMsg.textContent=t('minPassword');if(np!==cf)return passwordMsg.textContent=t('passwordMismatch');try{const d=await api('/admin/password',{currentPassword:currentAdminPass.value,newPassword:np,confirmation:cf},'PUT');token=d.token;sessionStorage.setItem('mw_admin_token',token);passwordMsg.textContent=t('passwordChanged');e.target.reset()}catch(x){passwordMsg.textContent=x.message}};recoveryForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/admin/recovery-code',{currentPassword:recoveryCurrentPass.value},'POST');showOneTimeCode(d.recoveryCode,()=>showTab('settings'))}catch(x){recoveryMsg.textContent=x.message}}}
window.logout=()=>{token='';sessionStorage.removeItem('mw_admin_token');checkAdminStatus()};document.getElementById('theme').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_admin_theme',theme)};document.getElementById('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_admin_lang',lang);setDirection();if(currentScreen==='dashboard')dashboard();else if(currentScreen==='setup')showSetup();else if(currentScreen==='recover')showRecover();else if(currentScreen==='code')showOneTimeCode(oneTimeCodeValue,oneTimeCodeDone);else showLogin()};
// Delegated ripple: covers every current and future button in passenger/driver UI.
document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

setDirection();token='';sessionStorage.removeItem('mw_admin_token');checkAdminStatus();
</script>
