<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>مشواري - الراكب</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#e9e9e9;--card:#ffffff;--fg:#111111;--muted:#555555;--accent:#00c853;--green:#00c853}
*{box-sizing:border-box}body{margin:0;background:#e9e9e9!important;color:#111!important;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:560px;min-height:100dvh;margin:auto;background:#e9e9e9!important;border:0}
.mesh-header{height:70px;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;background:#00c853;border-radius:16px;margin:12px 12px 0}
.mesh-brand-art{position:absolute;inset:0;background-image:url('/assets/mesh-header.jpg');background-repeat:no-repeat;background-position:left center;background-size:auto 100%}
.mesh-header-actions{position:relative;z-index:2;display:flex;gap:8px}
.mesh-header-actions button{background:#fff!important;color:#111!important;border:1px solid #ddd;border-radius:30px;min-width:44px;min-height:42px;padding:8px 13px}
main{padding:14px 14px 18px;flex:1}
.card{background:#fff!important;border:0!important;border-radius:20px!important;padding:20px!important;color:#111!important;box-shadow:0 2px 10px #0001!important}
.card>h2{background:#fff;border:0;border-radius:16px;padding:16px 12px;text-align:center;font-size:20px;color:#111}
button{border:0;border-radius:12px;padding:13px;font-weight:bold;cursor:pointer}
.primary{background:#00c853!important;color:#fff!important;border:0!important;border-radius:15px!important}
.gold{background:#fff!important;color:#111!important;border:1px solid #ddd!important;border-radius:15px!important}
input,select{display:block;width:100%;min-height:52px;padding:14px 15px;font-size:16px;border:1px solid #ddd;border-radius:12px;background:#fff;color:#111;margin-top:8px;margin-bottom:8px}
label{display:block;font-size:14px;margin-top:12px}
.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#0c3043;border:1px solid #17c9e077;margin:10px 0;font-size:13px}
#passengerMap{height:340px;width:100%;border-radius:20px;border:0;z-index:1;background:#d9d9d9}
.map-caption{font-size:12px;color:#555;margin-top:8px}
.mw-route-summary{display:grid;gap:9px}.mw-route-card{display:flex;gap:12px;padding:13px 14px;border:0;border-radius:13px;background:#f8fafc}.mw-route-card>span{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#e2e8f0;color:#334155;font-weight:900}.mw-route-card b{font-size:14px;color:#0f172a}.mw-route-card small{font-size:11px;color:#64748b}
.mw-route-metrics{margin-top:9px;padding:10px 12px;border:1px solid #00c85366;border-radius:12px;background:#e8f5e9;color:#111;font-size:13px}
/* تعديل الراكب حسب الصور - كاروسيل تمرير سلس يمين ويسار */
.mw-vehicle-picker{margin-top:18px;padding:15px 0 10px;border-top:1px solid #ddd}
.mw-vehicle-heading{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.mw-vehicle-heading strong{font-size:17px}.mw-vehicle-heading span{font-size:11px;color:#666}
.mw-vehicle-rail{display:flex;gap:14px;overflow-x:auto;direction:ltr;padding:7px max(18px,calc((100% - 232px)/2)) 16px;scroll-padding-inline:max(18px,calc((100% - 232px)/2));scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scrollbar-width:none}
.mw-vehicle-rail::-webkit-scrollbar{display:none}
.mw-vehicle-card{position:relative;flex:0 0 232px;width:232px;height:174px;padding:0!important;border:0!important;border-radius:20px!important;overflow:hidden;background:#fff!important;scroll-snap-align:center;scroll-snap-stop:always;direction:rtl;text-align:right;box-shadow:0 2px 10px #0002!important}
.mw-vehicle-card img{display:block;width:100%;height:100%;object-fit:cover}
.mw-vehicle-card:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,#020b18ed)}
.mw-vehicle-card .mw-vehicle-name{position:absolute;z-index:2;right:15px;bottom:13px;left:12px;color:#fff;font-size:17px;font-weight:900;display:flex;justify-content:space-between}
.mw-vehicle-card .mw-vehicle-name small{font-size:10px;color:#c5eaf5}
.mw-vehicle-card.is-selected{border:3px solid #00c853!important;box-shadow:0 2px 12px #00c85333!important;transform:translateY(-2px)}
.mw-vehicle-hint{margin:0 5px;color:#555;font-size:12px}
.mw-selected-vehicle{padding:10px 12px;margin:8px 0 12px;border:1px solid #00c85366;border-radius:12px;background:#e8f5e9;color:#111;font-size:13px}
.mw-bottom-nav{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));margin-top:12px;background:#e9e9e9;border-top:0}
.mw-bottom-item{display:flex;min-height:72px;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:#fff!important;color:#111!important;border-radius:20px!important;font:700 12px Tahoma;box-shadow:0 2px 8px #0001}
.mw-bottom-item.active{color:#fff!important;background:#00c853!important;border-radius:20px!important}
#meshwariSplash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#e9e9e9!important;color:#111!important;transition:opacity .28s,visibility .28s}
#meshwariSplash.mw-splash-hidden{opacity:0;visibility:hidden;pointer-events:none}
#mwPullRefreshSpacer{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#111;border-bottom:1px solid #00c85366;font:bold 13px Tahoma}
</style>
<style>#meshwariSplash .mw-splash-content{display:flex;flex-direction:column;align-items:center;gap:18px}.mw-splash-logo{width:124px;height:124px;border-radius:28px}.mw-splash-title{font-size:27px;font-weight:900}.mw-splash-status{display:flex;gap:10px;color:#333;font-weight:700}.mw-splash-spinner{width:22px;height:22px;border:3px solid #ddd;border-top-color:#00c853;border-radius:50%;animation:mwSpin .75s linear infinite}@keyframes mwSpin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="meshwariSplash"><div class="mw-splash-content"><img class="mw-splash-logo" src="/icon-512.png" alt="مشواري" onerror="this.style.display='none'"><div class="mw-splash-title">مشواري</div><div class="mw-splash-status"><span class="mw-splash-spinner"></span><span>تهيئة التطبيق</span></div></div></div>
<script>(function(){const s=document.getElementById('meshwariSplash'),st=Date.now();window.hideMeshwariSplash=async function(){const r=Math.max(0,2200-(Date.now()-st));if(r)await new Promise(x=>setTimeout(x,r));s.classList.add('mw-splash-hidden');setTimeout(()=>s.remove(),350);};})();</script>
<div class="wrap">
<header class="mesh-header"><div class="mesh-brand-art"></div><div class="mesh-header-actions"><button class="gold" onclick="refreshMeshwariPage(this)">↻ تحديث</button><button class="gold" id="langBtn">EN</button><button class="gold">☾</button></div></header>
<main id="app"><section class="card text-center"><h2>أهلاً بك في مشواري</h2><p style="color:#d7e6f0">تسجيل الراكب - المكلا حضرموت</p><div style="display:grid;grid-template-columns:1fr;gap:9px"><button class="primary" style="width:100%;min-height:58px;font-size:19px" onclick="chooseRole('passenger')">👤 أنا راكب</button></div></section></main>
<footer style="min-height:80px;display:flex;justify-content:center;padding:12px;color:#555">مشواري © 2026</footer></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const API=location.origin+'/api';let lang='ar',token=localStorage.getItem('mw_token')||'',account=null,chosenRole='';
let selectedPassengerVehicle='taxi',passengerMap=null,passengerUserMarker=null,passengerDestinationMarker=null,passengerDriverLayer=null,passengerWatchId=null,passengerMapPosition=null,passengerDestinationPosition=null,passengerPickupAddress='المكلا، الشرج',passengerDestinationAddress='',passengerRouteLayer=null,passengerRouteRequestPending=false,passengerRouteSignature='';
const app=document.getElementById('app');
const t=k=>({welcome:'أهلاً بك في مشواري',choose:'تسجيل الراكب - المكلا حضرموت',passenger:'أنا راكب',driver:'أنا سائق',name:'الاسم الكامل',nid:'رقم البطاقة',phone:'رقم الجوال',register:'إرسال طلب التسجيل',login:'لدي حساب - دخول',code:'رمز الدخول المكوّن من 6 أرقام',request:'طلب رمز من الإدارة',verify:'تأكيد الدخول',pending:'طلبك قيد المراجعة. ستتواصل معك الإدارة.',logout:'تسجيل الخروج',back:'رجوع',error:'حدث خطأ، حاول مرة أخرى'}[k]||k);
async function api(path,body,method='POST'){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){const e=Error(d.error||t('error'));e.status=r.status;throw e}return d}
function start(){app.innerHTML=`<section class="card text-center"><h2>${t('welcome')}</h2><p>تسجيل الراكب - المكلا حضرموت</p><div style="display:grid;grid-template-columns:1fr;gap:9px"><button class="primary" style="width:100%;min-height:58px;font-size:19px" onclick="chooseRole('passenger')">👤 ${t('passenger')}</button></div></section>`}
function chooseRole(r){chosenRole='passenger';formScreen(false)}
function formScreen(login){app.innerHTML=`<section class="card"><h2>${login?t('login'):t('register')} - ${t(chosenRole)}</h2><form id="regForm">${login?`<label>${t('nid')}<input id="nid" required></label>`:`<label>${t('name')}<input id="name" required></label><label>${t('nid')}<input id="nid" required></label><label>${t('phone')}<input id="phone" required></label>`}<button class="primary w-full mt-4" style="width:100%">${login?t('request'):t('register')}</button></form><button class="w-full mt-2 gold" style="width:100%" onclick="formScreen(${!login})">${login?t('back'):t('login')}</button><p id="msg" class="notice hidden"></p></section>`;
document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();try{const nid=document.getElementById('nid').value.trim();if(login){await api('/auth/request-code',{nationalId:nid});codeScreen(nid);return}await api('/register',{role:chosenRole,nationalId:nid,fullName:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim()});message(t('pending'))}catch(err){message(err.message)}};}
function message(s){const m=document.getElementById('msg');if(m){m.textContent=s;m.classList.remove('hidden')}else alert(s)}
function codeScreen(nid){app.innerHTML=`<section class="card"><h2>${t('verify')}</h2><p>${t('code')}</p><input id="otp" maxlength="6" placeholder="000000"><button class="primary" style="width:100%" id="verify">${t('verify')}</button><p id="msg" class="notice hidden"></p></section>`;document.getElementById('verify').onclick=async()=>{try{const d=await api('/auth/verify-code',{nationalId:nid,code:document.getElementById('otp').value});token=d.token;localStorage.setItem('mw_token',token);account=d.account;home()}catch(e){message(e.message)}}}
async function home(){try{const d=await api('/me',undefined,'GET');account=d.account;chosenRole=account.role;renderHome()}catch(e){if(e.status===401){token='';localStorage.removeItem('mw_token');account=null;start();return}app.innerHTML=`<section class="card">${e.message}<button class="primary" style="width:100%" onclick="home()">إعادة المحاولة</button></section>`}}
function passengerBottomTab(tab){
 const nav=document.getElementById('passengerBottomNav');if(nav)nav.querySelectorAll('.mw-bottom-item').forEach(i=>i.classList.toggle('active',i.dataset.tab===tab));
 if(tab==='home')window.scrollTo({top:0,behavior:'smooth'});
 if(tab==='trips')document.getElementById('passengerNegotiations')?.scrollIntoView({behavior:'smooth'});
 if(tab==='wallet'){let p=document.getElementById('passengerWalletPanel');if(!p){p=document.createElement('section');p.id='passengerWalletPanel';p.className='card mt-3';p.innerHTML='<h3>محفظتي</h3><p>رصيد المحفظة</p><p id="passengerWalletBalance" style="font-size:26px;font-weight:900"></p>';nav.parentNode.insertBefore(p,nav)}document.getElementById('passengerWalletBalance').textContent=String(account?.wallet_balance??0)+' ريال';p.scrollIntoView({behavior:'smooth'})}
 if(tab==='account')document.getElementById('settingsPanel')?.scrollIntoView({behavior:'smooth'});
}
// ==== واجهة الراكب حسب الصور ====
function renderHome(){const a=account;
 if(a.role!=='passenger'){
  app.innerHTML=`<section class="card"><b>${escapeHtml(a.full_name)}</b><p>${escapeHtml(a.phone||'')}</p><p>المحفظة: ${escapeHtml(a.wallet_balance||0)} ريال</p><button class="primary" style="width:100%" onclick="logout()">${t('logout')}</button></section>`;return;
 }
 app.innerHTML=`<section class="card"><div style="display:flex;justify-content:space-between"><b>${escapeHtml(a.full_name)}</b><span>راكب</span></div><p style="color:#b6c9d7;font-size:12px">${escapeHtml(a.phone||'')}</p></section>
 <section class="card mt-3" style="margin-top:12px"><div id="passengerMap"></div>
 <h3 style="font-weight:900;margin-top:12px">طلب مشوار والتفاوض على الأجرة</h3>
 <p class="map-caption">🔵 موقعك الحالي &nbsp; 🔴 الوجهة &nbsp; 🟢 السائقون — اضغط على الخريطة لتحديد الوجهة</p>
 <p id="mapStatus" class="map-caption">جارٍ تحديد موقعك لإظهار السائقين القريبين...</p>
 <div class="mw-route-summary" style="margin-top:12px">
  <div class="mw-route-card"><span>من</span><div><small>موقع الانطلاق</small><br><b id="passengerPickupLabel">المكلا، الشرج</b></div></div>
  <div style="display:flex;gap:8px"><div class="mw-route-card" style="flex:1"><span>إلى</span><div><small>الوجهة</small><br><b id="passengerDestinationLabel">حدد وجهتك على الخريطة</b></div></div><button type="button" class="primary" onclick="addNewDestination()" style="min-width:52px;font-size:22px">+</button></div>
  <small style="color:#64748b">+ وجهة جديدة — اضغط + لإضافة وجهة جديدة</small>
 </div>
 <div id="passengerRouteMetrics" class="mw-route-metrics">سيظهر طول الطريق والوقت التقريبي بعد تحديد الوجهة</div>
 <div class="mw-vehicle-picker"><div class="mw-vehicle-heading"><strong>اختر نوع المركبة</strong><span>مرّر يميناً ويساراً — تمرير سلس</span></div>
 <div id="passengerVehicleRail" class="mw-vehicle-rail">
  <button type="button" class="mw-vehicle-card is-selected" data-vehicle="taxi" onclick="findDriversForNegotiation('taxi')"><img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=900&q=82" alt="تاكسي" onerror="this.style.display='none'"><span class="mw-vehicle-name">التاكسي الأصفر <small>4 ركاب</small></span></button>
  <button type="button" class="mw-vehicle-card" data-vehicle="foxy" onclick="findDriversForNegotiation('foxy')"><img src="https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=900&q=82" alt="فوكسي" onerror="this.style.display='none'"><span class="mw-vehicle-name">فوكسي <small>7 ركاب</small></span></button>
  <button type="button" class="mw-vehicle-card" data-vehicle="smallbus" onclick="findDriversForNegotiation('smallbus')"><img src="https://images.unsplash.com/photo-1566933293069-b55c7f326dd4?auto=format&fit=crop&w=900&q=82" alt="باص صغير" onerror="this.style.display='none'"><span class="mw-vehicle-name">باص صغير <small>12 راكب</small></span></button>
  <button type="button" class="mw-vehicle-card" data-vehicle="bus25" onclick="findDriversForNegotiation('bus25')"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=82" alt="باص 25" onerror="this.style.display='none'"><span class="mw-vehicle-name">باص 25 راكب <small>25 راكب</small></span></button>
 </div>
 <p class="mw-vehicle-hint" id="passengerVehicleHint">اسحب يمين ويسار للتنقل — البطاقة في الوسط هي المختارة</p></div>
 <input id="dest" type="hidden">
 <div id="nearbyDrivers" style="margin-top:12px"></div>
 <div id="passengerNegotiations" style="margin-top:12px"></div>
 <p id="result" class="notice hidden"></p></section>
 <section class="card mt-3" id="settingsPanel" style="margin-top:12px"><button class="gold" style="width:100%" onclick="logout()">${t('logout')}</button></section>
 <nav id="passengerBottomNav" class="mw-bottom-nav"><button class="mw-bottom-item active" data-tab="home" onclick="passengerBottomTab('home')"><span>🏠</span><span>الرئيسية</span></button><button class="mw-bottom-item" data-tab="trips" onclick="passengerBottomTab('trips')"><span>🧾</span><span>رحلاتي</span></button><button class="mw-bottom-item" data-tab="wallet" onclick="passengerBottomTab('wallet')"><span>👛</span><span>محفظتي</span></button><button class="mw-bottom-item" data-tab="account" onclick="passengerBottomTab('account')"><span>👤</span><span>حسابي</span></button></nav>`;
 initPassengerMap();loadPassengerNegotiations();
}
function addNewDestination(){const d=prompt('اكتب الوجهة الجديدة - المكلا:');if(d){passengerDestinationAddress=d;const l=document.getElementById('passengerDestinationLabel');if(l)l.textContent=d;const h=document.getElementById('dest');if(h)h.value=d;}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function lookupPassengerPlace(p){try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ar&lat='+p.lat+'&lon='+p.lng);const j=await r.json(),a=j.address||{};return a.neighbourhood||a.suburb||a.quarter||a.village||a.town||a.city||a.road||j.name||j.display_name||''}catch{return ''}}
function updatePassengerRouteSummary(){const p=document.getElementById('passengerPickupLabel'),d=document.getElementById('passengerDestinationLabel');if(p)p.textContent=passengerPickupAddress||'المكلا، الشرج';if(d)d.textContent=passengerDestinationAddress||'حدد وجهتك على الخريطة';refreshPassengerRoadRoute();}
async function initPassengerMap(){const el=document.getElementById('passengerMap');if(!el||!window.L)return;
 if(!passengerMap){passengerMap=L.map(el).setView([14.542,49.124],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap'}).addTo(passengerMap);passengerDriverLayer=L.layerGroup().addTo(passengerMap);passengerRouteLayer=L.layerGroup().addTo(passengerMap);
  passengerMap.on('click',async e=>{const pt={lat:e.latlng.lat,lng:e.latlng.lng};passengerDestinationPosition=pt;passengerDestinationAddress='';const d=document.getElementById('dest');if(d)d.value=pt.lat.toFixed(6)+', '+pt.lng.toFixed(6);updatePassengerRouteSummary();if(passengerDestinationMarker)passengerDestinationMarker.setLatLng([pt.lat,pt.lng]);else passengerDestinationMarker=L.marker([pt.lat,pt.lng]).addTo(passengerMap);passengerDestinationMarker.bindPopup('الوجهة المحددة').openPopup();const name=await lookupPassengerPlace(pt);passengerDestinationAddress=name||'الوجهة المحددة على الخريطة';if(d)d.value=passengerDestinationAddress;updatePassengerRouteSummary();});}
 setTimeout(()=>passengerMap&&passengerMap.invalidateSize(),250);
 if(!navigator.geolocation)return;
 if(passengerWatchId!==null)navigator.geolocation.clearWatch(passengerWatchId);
 passengerWatchId=navigator.geolocation.watchPosition(async pos=>{passengerMapPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};if(!passengerUserMarker){passengerUserMarker=L.marker([passengerMapPosition.lat,passengerMapPosition.lng]).addTo(passengerMap).bindPopup('موقعك الحالي - المكلا');passengerMap.setView([passengerMapPosition.lat,passengerMapPosition.lng],14);}else passengerUserMarker.setLatLng([passengerMapPosition.lat,passengerMapPosition.lng]);await refreshPassengerMapDrivers();},{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
}
