<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="مشواري"><meta name="theme-color" content="#10b981">
<title>مشواري - واجهة الراكب</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f2f3f5;--card:#ffffff;--fg:#111827;--muted:#6b7280;--accent:#10b981;--green:#10b981;--green-dark:#059669;--green-soft:#dcfce7;--border:#e5e7eb;--danger:#ef4444;--danger-soft:#fee2e2}
[data-theme=dark]{--bg:#0d1412;--card:#15201c;--fg:#f3f4f6;--muted:#9ca3af;--accent:#10b981;--green:#10b981;--green-dark:#059669;--green-soft:#143628;--border:#263831;--danger:#f87171;--danger-soft:#3b1619}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;overscroll-behavior-y:contain}
input:not([type=file]),select,textarea{display:block;width:100%;min-width:0;min-height:48px;padding:12px 14px;font-size:15px;line-height:1.4;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--fg);margin-top:6px;margin-bottom:8px}
label{display:block;width:100%;font-size:13px;font-weight:700;margin-top:10px;color:var(--fg)}
form{width:100%}
input[type=file]{display:none}
button{position:relative;overflow:hidden;isolation:isolate;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer;transition:filter .12s ease,transform .12s ease}
button:active{filter:brightness(.92);transform:scale(.985)}
.ripple-wave{position:absolute;z-index:5;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%) scale(0);animation:meshButtonRipple .55s ease-out forwards}
@keyframes meshButtonRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.wrap{max-width:520px;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px #00000012}

/* Top bar matching the passenger screens */
.passenger-topbar{position:sticky;top:0;z-index:40;background:var(--card);color:var(--fg);padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 2px 10px #00000008}
.location-pill{flex:1;min-width:0;background:var(--green-soft);color:#065f46;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme=dark] .location-pill{color:#6ee7b7}
.location-pin-icon{width:22px;height:22px;border-radius:50%;background:#10b981;color:#fff;display:grid;place-items:center;font-size:12px;flex:0 0 22px}
.topbar-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.top-mini-btn{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;min-height:34px}

main#app{padding:12px 14px 20px;flex:1}

/* Map box */
.map-box-wrap{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 14px #0000000d;background:#e5e7eb;margin-bottom:12px}
#passengerMap{height:230px;width:100%;z-index:1}
.map-city-badge{position:absolute;top:12px;right:12px;z-index:500;background:#ffffffeb;color:#111827;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:900;box-shadow:0 2px 8px #0000001a}
.map-you-badge{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:500;background:#2563eb;color:#fff;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 3px 10px #2563eb44;pointer-events:none}

/* Location & destination cards matching screenshot 1 */
.mw-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:13px 14px;box-shadow:0 4px 12px #00000008;margin-bottom:10px}
.pickup-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.pickup-texts{flex:1;min-width:0}
.pickup-main{font-size:15px;font-weight:900;color:var(--fg)}
.pickup-sub{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.pickup-icon-ring{width:42px;height:42px;border-radius:50%;border:2px solid #0284c7;color:#0284c7;display:grid;place-items:center;font-size:18px;font-weight:900;flex:0 0 42px;background:#f0f9ff}
[data-theme=dark] .pickup-icon-ring{background:#0c2d42}

.dest-row-box{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dest-new-btn{background:linear-gradient(135deg,#17c978,#10b981);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:900;white-space:nowrap;flex:0 0 auto}
.dest-input-wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;cursor:pointer}
.dest-placeholder{font-size:16px;font-weight:800;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-circle-icon{width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--muted);display:grid;place-items:center;font-size:15px;flex:0 0 34px}

.chat-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chat-now-btn{background:linear-gradient(135deg,#17c978,#10b981);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:900;white-space:nowrap;flex:0 0 auto}
.chat-texts{flex:1;min-width:0;text-align:right}
.chat-title{font-size:15px;font-weight:900;color:var(--fg)}
.chat-sub{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.5}
.car-ring-green{width:46px;height:46px;border-radius:50%;border:2px solid #10b981;color:#10b981;display:grid;place-items:center;font-size:20px;flex:0 0 46px;background:var(--green-soft)}

/* Primary green trip CTA */
.btn-trip-main{width:100%;background:linear-gradient(135deg,#17c978,#10b981);color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 6px 16px #10b9813a;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.btn-trip-main-texts{flex:1;text-align:center}
.btn-trip-main-title{font-size:19px;font-weight:900;line-height:1.2}
.btn-trip-main-sub{font-size:12px;font-weight:700;opacity:.95;margin-top:3px}
.btn-trip-main-icon{width:38px;height:38px;border-radius:12px;background:#ffffff2b;display:grid;place-items:center;font-size:18px;flex:0 0 38px}

/* Vehicle carousel & trip type matching screenshot 3 */
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.section-title-row h3{margin:0;font-size:17px;font-weight:900;color:var(--fg)}
.section-title-row span{font-size:12px;font-weight:700;color:var(--muted)}
.count-pill{background:#10b981;color:#fff;border-radius:12px;padding:5px 12px;font-size:13px;font-weight:900}

.vehicles-carousel{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.vehicle-slide-card{flex:0 0 185px;background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px 12px;text-align:center;scroll-snap-align:center;box-shadow:0 4px 12px #00000008;cursor:pointer;transition:.15s}
.vehicle-slide-card.active{border-color:#10b981;background:var(--green-soft)}
.vehicle-emoji-box{font-size:38px;line-height:1.2;margin-bottom:8px}
.vehicle-name{font-size:17px;font-weight:900;color:var(--fg)}
.vehicle-desc{font-size:12px;font-weight:700;color:var(--muted);margin-top:3px}
.vehicle-tag-pill{display:inline-block;margin-top:8px;background:#10b981;color:#fff;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:800}

.selected-vehicle-banner{text-align:center;font-size:14px;font-weight:900;color:var(--fg);margin:8px 0 14px}

.trip-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.trip-type-card{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px 12px;text-align:right;cursor:pointer;transition:.15s}
.trip-type-card.active{border-color:#10b981;background:var(--green-soft)}
.trip-type-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.trip-type-badge{background:var(--green-soft);color:#065f46;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:900}
[data-theme=dark] .trip-type-badge{color:#6ee7b7}
.trip-type-icon{width:38px;height:38px;border-radius:12px;background:#10b981;color:#fff;display:grid;place-items:center;font-size:18px}
.trip-type-title{font-size:16px;font-weight:900;color:var(--fg)}
.trip-type-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px;line-height:1.4}

/* Account screen matching screenshot 2 */
.account-page-heading{text-align:center;font-size:24px;font-weight:900;color:var(--fg);margin:6px 0 16px}
.profile-header-box{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.profile-avatar-circle{width:84px;height:84px;border-radius:50%;border:3px solid #10b981;background:var(--green-soft);color:#059669;display:grid;place-items:center;font-size:34px;font-weight:900;flex:0 0 84px}
.profile-meta{flex:1;min-width:0}
.profile-name{font-size:22px;font-weight:900;color:var(--fg);margin:0}
.profile-sub-line{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px;word-break:break-word}
.verified-badge-wrap{text-align:center;margin-bottom:16px}
.verified-pill{display:inline-flex;align-items:center;gap:6px;background:#10b981;color:#fff;border-radius:999px;padding:7px 20px;font-size:14px;font-weight:900}

.account-menu-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.account-menu-item{width:100%;background:var(--green-soft);color:var(--fg);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:900;text-align:right}
.account-menu-item.danger-item{background:var(--danger-soft);color:#dc2626}
[data-theme=dark] .account-menu-item.danger-item{color:#f87171}
.account-menu-left{display:flex;align-items:center;gap:12px}
.account-menu-icon{font-size:20px;color:#059669}
[data-theme=dark] .account-menu-icon{color:#34d399}
.account-menu-item.danger-item .account-menu-icon{color:#dc2626}
[data-theme=dark] .account-menu-item.danger-item .account-menu-icon{color:#f87171}

.star-btn{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:18px;line-height:1}
.star-btn.active{background:var(--green-soft);border-color:#10b981;color:#d97706}

.notice{padding:11px 13px;border-radius:12px;background:#fef3c7;color:#92400e;border:1px solid #f59e0b55;margin:10px 0;font-size:13px;font-weight:700}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Passenger 4-item bottom navigation matching screenshots */
.passenger-bottom-nav{position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border-top:1px solid var(--border);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0000000d}
.passenger-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:6px 4px;border-radius:16px;background:transparent;color:#4b5563;font-size:12px;font-weight:800}
[data-theme=dark] .passenger-nav-btn{color:#9ca3af}
.passenger-nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.passenger-nav-btn.active{background:#10b981;color:#fff}
.passenger-nav-btn.active span{font-weight:900}

#mwPullRefreshSpacer{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;background:#10b981;color:#fff;transition:height .12s ease;font:bold 13px Tahoma,Arial,sans-serif;will-change:height}
#mwPullRefreshSpacer .mw-pull-icon{display:inline-block;color:#fff;font-size:20px;line-height:1}
#mwPullRefreshSpacer.mw-refreshing .mw-pull-icon{animation:mwPullSpin .8s linear infinite}
@keyframes mwPullSpin{to{transform:rotate(360deg)}}
</style>

<style id="meshwariSplashStyles">
#meshwariSplash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#17c978 0%,#059669 100%);color:#fff;font-family:Tahoma,Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease}
#meshwariSplash.mw-splash-hidden{opacity:0;visibility:hidden;pointer-events:none}
#meshwariSplash .mw-splash-content{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#meshwariSplash .mw-splash-logo{width:108px;height:108px;object-fit:contain;border-radius:26px;background:#ffffff22;padding:8px}
#meshwariSplash .mw-splash-title{font-size:26px;font-weight:900}
#meshwariSplash .mw-splash-status{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800}
#meshwariSplash .mw-splash-spinner{width:20px;height:20px;border:3px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:mwSplashSpin .75s linear infinite}
@keyframes mwSplashSpin{to{transform:rotate(360deg)}}
</style>

<body data-theme="light">

<div id="meshwariSplash" role="status" aria-live="polite" aria-label="تهيئة التطبيق">
 <div class="mw-splash-content">
  <img class="mw-splash-logo" src="/icon-512.png" alt="مشواري" onerror="this.style.display='none'">
  <div class="mw-splash-title">مشواري</div>
  <div class="mw-splash-status"><span class="mw-splash-spinner" aria-hidden="true"></span><span>تهيئة التطبيق</span></div>
 </div>
</div>
<script>
(function(){
 const splash=document.getElementById('meshwariSplash');
 const started=Date.now();
 window.hideMeshwariSplash=async function(){
  const remaining=Math.max(0,1400-(Date.now()-started));
  if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
  if(splash){splash.classList.add('mw-splash-hidden');setTimeout(()=>splash.remove(),320);}
 };
})();
</script>

function initPassengerMap(){

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17}).addTo(passengerMap);
 L.circleMarker(userLatLng,{radius:9,color:'#fff',weight:2.5,fillColor:'#2563eb',fillOpacity:1}).addTo(passengerMap);

function accountLockKey(){return 'mw_passenger_lock_'+(account?.id||'default');}
function getLocalLockConfig(){try{const raw=localStorage.getItem(accountLockKey());return raw?JSON.parse(raw):null}catch{return null}}
async function lockDigest(value,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(value)),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16))),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAccountLockFields(){
 const method=document.getElementById('accountLockMethod')?.value,box=document.getElementById('accountLockFields');
 if(!box)return;
 if(method==='pattern'){
  box.innerHTML=`<p class="small muted mt-2">${t('lockSecret')}</p><div id="accountPatternGrid" class="grid grid-cols-3 gap-2 max-w-xs mx-auto">${Array.from({length:9},(_,i)=>`<button type="button" class="top-mini-btn" data-dot="${i+1}" style="height:48px">●</button>`).join('')}</div><p id="accountPatternText" class="small text-center muted mt-1"></p><button type="button" id="accountPatternClear" class="top-mini-btn w-full mt-1">${t('cancel')}</button><p class="small muted mt-2">${t('lockSecretAgain')}</p><div id="accountPatternGrid2" class="grid grid-cols-3 gap-2 max-w-xs mx-auto">${Array.from({length:9},(_,i)=>`<button type="button" class="top-mini-btn" data-dot="${i+1}" style="height:48px">●</button>`).join('')}</div><p id="accountPatternText2" class="small text-center muted mt-1"></p><button type="button" id="accountPatternClear2" class="top-mini-btn w-full mt-1">${t('cancel')}</button>`;
  window.accountPatternA=wireAccountPattern('accountPatternGrid','accountPatternText','accountPatternClear');
  window.accountPatternB=wireAccountPattern('accountPatternGrid2','accountPatternText2','accountPatternClear2');
 }else{
  box.innerHTML=`<label>${t('lockSecret')}<input id="accountLockSecret" type="password" minlength="4" autocomplete="new-password"></label><label>${t('lockSecretAgain')}<input id="accountLockSecretAgain" type="password" minlength="4" autocomplete="new-password"></label>`;
 }
}
function wireAccountPattern(gridId,textId,clearId){
 const grid=document.getElementById(gridId),label=document.getElementById(textId);
 let points=[];
 const add=e=>{const b=e.target.closest('[data-dot]');if(!b||!grid.contains(b))return;const n=b.dataset.dot;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('active');label.textContent=points.join(' · ')}};
 grid.addEventListener('click',add);
 document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('active'));label.textContent=''};
 return()=>points.join('');
}
async function saveAccountLock(){
 const method=document.getElementById('accountLockMethod').value,msg=document.getElementById('accountLockMessage');
 msg.classList.remove('hidden');
 try{
  if(method==='off'){localStorage.removeItem(accountLockKey());accountUnlocked=true;msg.textContent=t('lockSaved');return}
  let a,b;
  if(method==='pattern'){a=window.accountPatternA?.()||'';b=window.accountPatternB?.()||''}
  else{a=document.getElementById('accountLockSecret').value;b=document.getElementById('accountLockSecretAgain').value}
  if(a.length<4||a!==b||(method==='pattern'&&(!/^[1-9]{4,9}$/.test(a)||new Set(a).size<4))){msg.textContent=t('lockNeed');return}
  const salt=lockSalt();
  localStorage.setItem(accountLockKey(),JSON.stringify({method,salt,hash:await lockDigest(a,salt)}));
  accountUnlocked=true;msg.textContent=t('lockSaved');
 }catch(e){msg.textContent=t('error')}
}
function showAccountUnlock(cfg){
 app.innerHTML=`<section class="mw-card text-center"><h2 class="font-bold text-xl">${t('lockScreenTitle')}</h2><p class="muted text-sm my-2">${t('lockScreenHelp')}</p><input id="accountUnlockSecret" type="password" autocomplete="off" placeholder="${t('lockSecret')}"><button id="accountUnlockButton" class="btn-trip-main mt-2" style="justify-content:center">${t('lockOpen')}</button><p id="accountUnlockError" class="notice hidden"></p></section>`;
 document.getElementById('accountUnlockButton').onclick=async()=>{
  const candidate=document.getElementById('accountUnlockSecret').value;
  const err=document.getElementById('accountUnlockError');
  if(await lockDigest(candidate,cfg.salt)===cfg.hash){accountUnlocked=true;switchPassengerTab('home')}
  else{err.textContent=t('lockWrong');err.classList.remove('hidden')}
 };
}

function logout(){
 token='';
 account=null;
 accountUnlocked=false;
 localStorage.removeItem('mw_token');
 switchPassengerTab('home');
}

async function factoryReset(){
 if(!confirm(t('factoryConfirm')))return;
 try{
  localStorage.removeItem(accountLockKey());
  for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);
  if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
  if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}
  alert(t('resetDone'));location.reload();
 }catch(e){alert(e.message||t('error'))}
}

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

async function refreshMeshwariPage(button){
 if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='…';}
 const freshUrl=new URL(location.href);
 freshUrl.searchParams.set('_mw_refresh',String(Date.now()));
 location.replace(freshUrl.href);
}

(async()=>{
 setDir();
 const cfg=getLocalLockConfig();
 if(cfg&&!accountUnlocked)showAccountUnlock(cfg);
 else switchPassengerTab('home');
 await window.hideMeshwariSplash();
})();
</script>

<script>
(function(){
  let startY=0,pullDistance=0,tracking=false,refreshing=false;
  const threshold=76,maxHeight=96;
  const spacer=document.createElement('div');
  spacer.id='mwPullRefreshSpacer';
  spacer.innerHTML='<span class="mw-pull-icon">↻</span><span class="mw-pull-label">اسحب للأسفل للتحديث</span>';
  document.body.insertBefore(spacer,document.body.firstChild);
  const label=spacer.querySelector('.mw-pull-label');
  const icon=spacer.querySelector('.mw-pull-icon');
  function pageAtTop(){return Math.max(window.pageYOffset||0,document.documentElement.scrollTop||0,document.body.scrollTop||0)<=1}
  function reset(){tracking=false;pullDistance=0;spacer.style.height='0px';spacer.classList.remove('mw-refreshing');label.textContent='اسحب للأسفل للتحديث';icon.textContent='↻'}
  document.addEventListener('touchstart',function(event){
    if(refreshing||event.touches.length!==1||!pageAtTop())return;
    const target=event.target;
    if(target&&target.closest&&target.closest('input,textarea,select,button,a,[contenteditable="true"],.leaflet-control'))return;
    tracking=true;startY=event.touches[0].clientY;pullDistance=0;
  },{passive:true,capture:true});
  document.addEventListener('touchmove',function(event){
    if(!tracking||refreshing||event.touches.length!==1)return;
    const distance=event.touches[0].clientY-startY;
    if(distance<=0){if(pullDistance===0)tracking=false;return}
    if(distance<7)return;
    if(event.cancelable)event.preventDefault();
    pullDistance=Math.min(distance,maxHeight);
    spacer.style.height=Math.round(pullDistance*.78)+'px';
    label.textContent=pullDistance>=threshold?'أفلت للتحديث':'اسحب للأسفل للتحديث';
  },{passive:false,capture:true});
  document.addEventListener('touchend',function(){
    if(!tracking)return;
    if(pullDistance>=threshold&&!refreshing){
      refreshing=true;tracking=false;spacer.classList.add('mw-refreshing');spacer.style.height='66px';label.textContent='يتم التحديث...';icon.textContent='⟳';
      if(typeof window.refreshMeshwariPage==='function')window.refreshMeshwariPage(null);else location.reload();
    }else reset();
  },{passive:true,capture:true});
  document.addEventListener('touchcancel',reset,{passive:true,capture:true});
})();
</script>
