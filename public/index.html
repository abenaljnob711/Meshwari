<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="مشواري"><meta name="theme-color" content="#07130f">
<title>مشواري - تطبيق النقل الذكي</title><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f4f7f6;--card:#fff;--fg:#10251d;--muted:#64756e;--accent:#e9b949;--green:#064e3b}[data-theme=dark]{--bg:#07110e;--card:#101e19;--fg:#effff7;--muted:#a6b8af;--accent:#f3c34f;--green:#063e30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif}.card{background:var(--card);border:1px solid #80958a33;border-radius:18px;padding:16px}input,select{width:100%;padding:13px;border:1px solid #80958a66;border-radius:12px;background:var(--card);color:var(--fg);margin-top:7px}button{border:0;border-radius:12px;padding:13px;font-weight:bold;cursor:pointer}.primary{background:var(--green);color:white}.gold{background:var(--accent);color:#17251e}.danger{background:#b91c1c;color:#fff}.muted{color:var(--muted)}.wrap{max-width:520px;min-height:100dvh;margin:auto;background:var(--bg);display:flex;flex-direction:column}header{background:#063d30;color:white;padding:18px;position:sticky;top:0;z-index:2}main{padding:15px;flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{padding:11px;border-radius:10px;background:#e9b94922;margin:10px 0;font-size:13px}.hidden{display:none!important}label{display:block;font-size:13px;margin-top:9px}.small{font-size:12px}
</style></head>
<body data-theme="light"><div class="wrap">
<header><div class="flex justify-between items-center"><div><b class="text-xl">مشواري</b><div class="text-xs text-amber-200" data-i="subtitle">تطبيق النقل الذكي</div></div><div class="flex gap-2"><button class="gold" id="langBtn">EN</button><button class="gold" id="themeBtn">◐</button></div></div></header>
<main id="app"><div class="card text-center"><h2 class="text-xl font-bold mb-3">أهلاً بك في مشواري</h2><p class="muted text-sm mb-4">اختر نوع الحساب للتسجيل</p><div class="grid2"><button class="primary" onclick="chooseRole('passenger')">أنا راكب</button><button class="gold" onclick="chooseRole('driver')">أنا سائق</button></div></div></main>
<footer class="text-center text-xs muted p-4">مشواري © 2026</footer></div>
<script>
'use strict';
const API=location.origin+'/api';let lang=localStorage.getItem('mw_lang')||'ar',theme=localStorage.getItem('mw_theme')||'light',token=localStorage.getItem('mw_token')||'',account=null,chosenRole='';
document.body.dataset.theme=theme;const app=document.getElementById('app');
const dict={ar:{subtitle:'تطبيق النقل الذكي',welcome:'أهلاً بك في مشواري',choose:'اختر نوع الحساب للتسجيل',passenger:'أنا راكب',driver:'أنا سائق',name:'الاسم الكامل',nid:'رقم البطاقة',phone:'رقم الجوال',register:'إرسال طلب التسجيل',login:'لدي حساب - دخول',code:'رمز الدخول المكوّن من 6 أرقام',request:'طلب رمز من الإدارة',verify:'تأكيد الدخول',pending:'طلبك قيد المراجعة. ستتواصل معك الإدارة.',destination:'الوجهة',trip:'طلب تاكسي',fare:'السعر التقديري',duty:'التوفر للرحلات',logout:'تسجيل الخروج',carType:'نوع السيارة',model:'الموديل',color:'اللون',plate:'رقم اللوحة',reg:'رقم الملكية',wait:'يرجى انتظار اعتماد الإدارة',error:'حدث خطأ، حاول مرة أخرى',back:'رجوع',wallet:'المحفظة',rial:'ريال',onDuty:'تشغيل استقبال الرحلات',offDuty:'إيقاف استقبال الرحلات',changeVehicle:'طلب تغيير السيارة',vehicleHelp:'السيارة الجديدة لا تستخدم في الرحلات حتى تعتمدها الإدارة. تبقى بيانات السيارة السابقة محفوظة في سجل المركبات.',sendVehicle:'إرسال طلب تغيير السيارة',vehicleSent:'تم إرسال طلب تغيير السيارة. انتظر اعتماد الإدارة.',pendingVehicle:'لديك طلب سيارة قيد المراجعة',vehicleHistory:'سجل المركبات',factory:'استعادة ضبط المصنع',factoryWarn:'سيتم تسجيل خروجك ومسح بيانات التطبيق المحلية من هذا الجهاز فقط. لن يتم حذف حسابك أو رحلاتك أو بياناتك من مشواري.',factoryConfirm:'هل تريد استعادة ضبط المصنع على هذا الجهاز؟ لن يُحذف حسابك من الخادم.',resetDone:'تم مسح بيانات التطبيق من هذا الجهاز. يمكنك تسجيل الدخول مجدداً.',cancel:'إلغاء',status:'الحالة',current:'السيارة الحالية',approved:'معتمدة',pendingStatus:'بانتظار الاعتماد',rejected:'مرفوضة',replaced:'سابقة / مستبدلة',date:'تاريخ الطلب',noHistory:'لا يوجد سجل مركبات بعد',loginFirst:'سجل الدخول أولاً',colorNote:'أدخل اللون كما يظهر في صورة السيارة ووثائقها.',vehicleUrl:'رابط صورة السيارة (اختياري)',vehicleRejected:'سبب الرفض',closed:'الحساب مغلق أو موقوف'} ,en:{subtitle:'Smart transport application',welcome:'Welcome to Meshwari',choose:'Choose account type',passenger:'Passenger',driver:'Driver',name:'Full name',nid:'National ID',phone:'Phone number',register:'Submit registration',login:'I have an account - Sign in',code:'6-digit access code',request:'Request code from admin',verify:'Verify and sign in',pending:'Your application is under review.',destination:'Destination',trip:'Request taxi',fare:'Estimated fare',duty:'Trip availability',logout:'Sign out',carType:'Car type',model:'Model',color:'Color',plate:'Plate number',reg:'Registration number',wait:'Waiting for admin approval',error:'Something went wrong. Try again.',back:'Back',wallet:'Wallet',rial:'YER',onDuty:'Go available',offDuty:'Stop receiving trips',changeVehicle:'Request vehicle change',vehicleHelp:'The new vehicle cannot be used for trips until approved by administration. Your previous vehicle remains in your vehicle history.',sendVehicle:'Submit vehicle change',vehicleSent:'Vehicle change request submitted. Wait for admin approval.',pendingVehicle:'You already have a vehicle request under review',vehicleHistory:'Vehicle history',factory:'Factory reset',factoryWarn:'This signs you out and clears local app data on this device only. Your account, trips and server data will not be deleted.',factoryConfirm:'Reset this device? Your server account will not be deleted.',resetDone:'Local app data cleared. You can sign in again.',cancel:'Cancel',status:'Status',current:'Current vehicle',approved:'Approved',pendingStatus:'Pending approval',rejected:'Rejected',replaced:'Previous / replaced',date:'Request date',noHistory:'No vehicle history yet',loginFirst:'Please sign in first',colorNote:'Enter the vehicle color as shown in its photo and documents.',vehicleUrl:'Vehicle photo URL (optional)',vehicleRejected:'Rejection reason',closed:'Account is closed or suspended'}};
const t=k=>dict[lang][k]||k;function setDir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
document.getElementById('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_theme',theme)};
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_lang',lang);setDir();if(account)home();else start()};setDir();
async function api(path,body,method='POST'){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}
function start(){app.innerHTML=`<section class="card text-center"><h2 class="font-bold text-xl mb-3">${t('welcome')}</h2><p class="muted text-sm mb-4">${t('choose')}</p><div class="grid2"><button class="primary" onclick="chooseRole('passenger')">${t('passenger')}</button><button class="gold" onclick="chooseRole('driver')">${t('driver')}</button></div><button class="danger w-full mt-3" onclick="factoryReset()">${t('factory')}</button></section>`}
function chooseRole(r){chosenRole=r;formScreen(false)}
function countryPhone(){return `<div class="grid2"><select id="country"><option value="+967">🇾🇪 Yemen +967</option><option value="+966">🇸🇦 Saudi Arabia +966</option><option value="+971">🇦🇪 UAE +971</option><option value="+968">🇴🇲 Oman +968</option><option value="+20">🇪🇬 Egypt +20</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option></select><input id="phone" placeholder="${t('phone')}" inputmode="tel" required></div>`}
function formScreen(login){app.innerHTML=`<section class="card"><h2 class="font-bold text-lg">${login?t('login'):t('register')} - ${t(chosenRole)}</h2><form id="regForm">${login?`<label>${t('nid')}<input id="nid" required inputmode="numeric"></label>`:`<label>${t('name')}<input id="name" required></label><label>${t('nid')}<input id="nid" required inputmode="numeric"></label><label>${t('phone')}${countryPhone()}</label>`}${!login&&chosenRole==='driver'?`<hr class="my-3"><label>${t('carType')}<input id="carType" required></label><label>${t('model')}<input id="carModel" required></label><label>${t('color')}<input id="carColor" required></label><label>${t('plate')}<input id="plateNumber" required></label><label>${t('reg')}<input id="registrationNumber" required></label>`:''}<button class="primary w-full mt-4">${login?t('request'):t('register')}</button></form><button class="w-full mt-2 gold" onclick="formScreen(${!login})">${login?t('back'):t('login')}</button><p id="msg" class="notice hidden"></p></section>`;
document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();try{const nid=document.getElementById('nid').value.trim();if(login){await api('/auth/request-code',{nationalId:nid});codeScreen(nid);return}const phone=document.getElementById('country').value+document.getElementById('phone').value.trim();const body={role:chosenRole,nationalId:nid,fullName:document.getElementById('name').value.trim(),phone};if(chosenRole==='driver')body.car={type:document.getElementById('carType').value,model:document.getElementById('carModel').value,color:document.getElementById('carColor').value,plateNumber:document.getElementById('plateNumber').value,registrationNumber:document.getElementById('registrationNumber').value};await api('/register',body);message(t('pending'))}catch(err){message(err.message)}}}
function message(s){const m=document.getElementById('msg');if(m){m.textContent=s;m.classList.remove('hidden')}else alert(s)}
function codeScreen(nid){app.innerHTML=`<section class="card"><h2 class="font-bold">${t('verify')}</h2><p class="muted text-sm mt-2">${t('code')}</p><input id="otp" maxlength="6" inputmode="numeric" placeholder="000000"><button class="primary w-full mt-3" id="verify">${t('verify')}</button><p id="msg" class="notice hidden"></p></section>`;document.getElementById('verify').onclick=async()=>{try{const d=await api('/auth/verify-code',{nationalId:nid,code:document.getElementById('otp').value});token=d.token;localStorage.setItem('mw_token',token);account=d.account;home()}catch(e){message(e.message)}}}
async function home(){try{const d=await api('/me',undefined,'GET');account=d.account;chosenRole=account.role;renderHome()}catch(e){token='';localStorage.removeItem('mw_token');account=null;app.innerHTML=`<section class="card">${e.message}<button class="primary w-full mt-3" onclick="start()">${t('back')}</button></section>`}}
function renderHome(){const a=account;app.innerHTML=`<section class="card"><div class="flex justify-between"><b>${escapeHtml(a.full_name)}</b><span class="text-xs text-green-700">${t(a.role)}</span></div><p class="muted text-xs mt-1">${escapeHtml(a.phone||'')}</p></section>${a.role==='passenger'?`<section class="card mt-3"><label>${t('destination')}<input id="dest" placeholder="${t('destination')}"></label><button id="trip" class="gold w-full mt-3">${t('trip')}</button><p id="result" class="notice hidden"></p></section>`:`<section class="card mt-3"><p>${escapeHtml(a.car_type||'')} - ${escapeHtml(a.car_model||'')} - ${escapeHtml(a.car_color||'')}</p><p class="mt-2">${t('wallet')}: ${escapeHtml(a.wallet_balance||0)} ${t('rial')}</p><button id="duty" class="primary w-full mt-3">${a.is_off_duty?t('onDuty'):t('offDuty')}</button><div class="notice">${t('vehicleHelp')}</div><button id="vehicleToggle" class="gold w-full">${t('changeVehicle')}</button><div id="vehicleForm" class="hidden mt-3"><form id="vehicleChangeForm"><label>${t('carType')}<input id="newCarType" required></label><label>${t('model')}<input id="newCarModel" required></label><label>${t('color')}<input id="newCarColor" required></label><label>${t('plate')}<input id="newPlate" required></label><label>${t('reg')}<input id="newReg" required></label><label>${t('vehicleUrl')}<input id="newVehicleUrl" type="url" placeholder="https://..."></label><button class="primary w-full mt-3">${t('sendVehicle')}</button></form><p id="vehicleMsg" class="notice hidden"></p></div><button id="historyToggle" class="tab gold w-full mt-3">${t('vehicleHistory')}</button><div id="vehicleHistory" class="hidden mt-2"></div></section>`}<section class="card mt-3"><button onclick="logout()" class="gold w-full">${t('logout')}</button><button onclick="factoryReset()" class="danger w-full mt-2">${t('factory')}</button><p class="muted small mt-2">${t('factoryWarn')}</p></section>`;
if(a.role==='passenger')document.getElementById('trip').onclick=async()=>{try{const d=await api('/trips',{destination:document.getElementById('dest').value});const p=document.getElementById('result');p.textContent=t('fare')+': '+d.trip.fare_amount+' '+t('rial');p.classList.remove('hidden')}catch(e){alert(e.message)}};
else{document.getElementById('duty').onclick=async()=>{try{await api('/driver/duty',{offDuty:!a.is_off_duty},'PUT');a.is_off_duty=!a.is_off_duty;renderHome()}catch(e){alert(e.message)}};document.getElementById('vehicleToggle').onclick=()=>document.getElementById('vehicleForm').classList.toggle('hidden');document.getElementById('vehicleChangeForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/driver/vehicles',{car:{type:document.getElementById('newCarType').value,model:document.getElementById('newCarModel').value,color:document.getElementById('newCarColor').value,plateNumber:document.getElementById('newPlate').value,registrationNumber:document.getElementById('newReg').value,vehicleImageUrl:document.getElementById('newVehicleUrl').value}},'POST');document.getElementById('vehicleMsg').textContent=d.message||t('vehicleSent');document.getElementById('vehicleMsg').classList.remove('hidden');e.target.reset()}catch(x){document.getElementById('vehicleMsg').textContent=x.message;document.getElementById('vehicleMsg').classList.remove('hidden')}};document.getElementById('historyToggle').onclick=async()=>{const el=document.getElementById('vehicleHistory');el.classList.toggle('hidden');if(!el.classList.contains('hidden')){try{const d=await api('/driver/vehicles',undefined,'GET');el.innerHTML=(d.vehicles||[]).map(v=>`<article class="border-b py-2 text-sm"><b>${escapeHtml(v.car_type)} ${escapeHtml(v.car_model)}</b><p>${escapeHtml(v.car_color)} · ${escapeHtml(v.plate_number)}</p><p class="muted small">${t('status')}: ${t(v.status==='approved'?'approved':v.status==='pending'?'pendingStatus':v.status==='rejected'?'rejected':'replaced')} · ${new Date(v.submitted_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${v.review_reason?`<p class="small">${t('vehicleRejected')}: ${escapeHtml(v.review_reason)}</p>`:''}</article>`).join('')||t('noHistory')}catch(e){el.textContent=e.message}}}}
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){token='';account=null;chosenRole='';localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(!confirm(t('factoryConfirm')))return;try{token='';account=null;chosenRole='';for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}
if(token)home();else start();
</script>
<script>if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(error=>console.warn('PWA registration failed',error)))}</script>
</body></html>
