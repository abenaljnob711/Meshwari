document.body.dataset.theme=theme;const app=document.getElementById('app');

d sign in',pending:'Your application is under review.',destination:'Destination',trip:'Request taxi',fare:'Estimated fare',duty:'Trip availability',logout:'Sign out',carType:'Car type',model:'Model',color:'Color',plate:'Plate number',reg:'Registration number',wait:'Waiting for admin approval',error:'Something went wrong. Try again.',back:'Back',wallet:'Wallet',rial:'YER',onDuty:'Go available',offDuty:'Stop receiving trips',changeVehicle:'Request vehicle change',vehicleHelp:'The new vehicle cannot be used for trips until approved by administration. Your previous vehicle remains in your vehicle history.',sendVehicle:'Submit vehicle change',vehicleSent:'Vehicle change request submitted. Wait for admin approval.',pendingVehicle:'You already have a vehicle request under review',vehicleHistory:'Vehicle history',factory:'Factory reset',factoryWarn:'This signs you out and clears local app data on this device only. Your account, trips and server data will not be deleted.',factoryConfirm:'Reset this device? Your server account will not be deleted.',resetDone:'Local app data cleared. You can sign in again.',cancel:'Cancel',status:'Status',current:'Current vehicle',approved:'Approved',pendingStatus:'Pending approval',rejected:'Rejected',replaced:'Previous / replaced',date:'Request date',noHistory:'No vehicle history yet',loginFirst:'Please sign in first',colorNote:'Enter the vehicle color as shown in its photo and documents.',vehicleUrl:'Vehicle photo URL (optional)',vehicleRejected:'Rejection reason',closed:'Account is closed or suspended'}};
const t=k=>dict[lang][k]||k;function setDir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
document.getElementById('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_theme',theme)};
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_lang',lang);setDir();if(account)home();else start()};setDir();
async function api(path,body,method='POST'){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}
function start(){document.getElementById('menuBtn').style.display='none';toggleSettings(false);app.innerHTML=`<section class="card text-center"><h2 class="font-bold text-xl mb-3">${t('welcome')}</h2><p class="muted text-sm mb-4">${t('choose')}</p><div class="grid2"><button class="primary" onclick="chooseRole('passenger')">${t('passenger')}</button><button class="gold" onclick="chooseRole('driver')">${t('driver')}</button></div></section>`}
function chooseRole(r){chosenRole=r;formScreen(false)}
function countryPhone(){return `<div class="grid2"><select id="country"><option value="+967">🇾🇪 Yemen +967</option><option value="+966">🇸🇦 Saudi Arabia +966</option><option value="+971">🇦🇪 UAE +971</option><option value="+968">🇴🇲 Oman +968</option><option value="+20">🇪🇬 Egypt +20</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option></select><input id="phone" placeholder="${t('phone')}" inputmode="tel" required></div>`}
function formScreen(login){app.innerHTML=`<section class="card"><h2 class="font-bold text-lg">${login?t('login'):t('register')} - ${t(chosenRole)}</h2><form id="regForm">${login?`<label>${t('nid')}<input id="nid" required inputmode="numeric"></label>`:`<label>${t('name')}<input id="name" required></label><label>${t('nid')}<input id="nid" required inputmode="numeric"></label><label>${t('phone')}${countryPhone()}</label>`}${!login&&chosenRole==='driver'?`<hr class="my-3"><label>${t('carType')}<input id="carType" required></label><label>${t('model')}<input id="carModel" required></label><label>${t('color')}<input id="carColor" required></label><label>${t('plate')}<input id="plateNumber" required></label><label>${t('reg')}<input id="registrationNumber" required></label>`:''}<button class="primary w-full mt-4">${login?t('request'):t('register')}</button></form><button class="w-full mt-2 gold" onclick="formScreen(${!login})">${login?t('back'):t('login')}</button><p id="msg" class="notice hidden"></p></section>`;
document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();try{const nid=document.getElementById('nid').value.trim();if(login){await api('/auth/request-code',{nationalId:nid});codeScreen(nid);return}const phone=document.getElementById('country').value+document.getElementById('phone').value.trim();const body={role:chosenRole,nationalId:nid,fullName:document.getElementById('name').value.trim(),phone};if(chosenRole==='driver')body.car={type:document.getElementById('carType').value,model:document.getElementById('carModel').value,color:document.getElementById('carColor').value,plateNumber:document.getElementById('plateNumber').value,registrationNumber:document.getElementById('registrationNumber').value};await api('/register',body);message(t('pending'))}catch(err){message(err.message)}}}
function message(s){const m=document.getElementById('msg');if(m){m.textContent=s;m.classList.remove('hidden')}else alert(s)}
function codeScreen(nid){app.innerHTML=`<section class="card"><h2 class="font-bold">${t('verify')}</h2><p class="muted text-sm mt-2">${t('code')}</p><input id="otp" maxlength="6" inputmode="numeric" placeholder="000000"><button class="primary w-full mt-3" id="verify">${t('verify')}</button><p id="msg" class="notice hidden"></p></section>`;document.getElementById('verify').onclick=async()=>{try{const d=await api('/auth/verify-code',{nationalId:nid,code:document.getElementById('otp').value});token=d.token;localStorage.setItem('mw_token',token);account=d.account;home()}catch(e){message(e.message)}}}
async function home(){try{const d=await api('/me',undefined,'GET');account=d.account;chosenRole=account.role;renderHome()}catch(e){token='';localStorage.removeItem('mw_token');account=null;app.innerHTML=`<section class="card">${e.message}<button class="primary w-full mt-3" onclick="start()">${t('back')}</button></section>`}}
let meshMap=null,passengerCoords=null,nearbyTimer=null,driverWatch=null,driverTripTimer=null,passengerTripTimer=null,chatTimer=null,activeTripId=null,lastChatCount=0,lastDriverLocationSent=0;
function stopTimers(){if(nearbyTimer){clearInterval(nearbyTimer);nearbyTimer=null}if(driverTripTimer){clearInterval(driverTripTimer);driverTripTimer=null}if(passengerTripTimer){clearInterval(passengerTripTimer);passengerTripTimer=null}if(chatTimer){clearInterval(chatTimer);chatTimer=null}}
function renderHome(){
 const a=account;stopTimers();
 document.getElementById('menuBtn').style.display='block';
 document.getElementById('settingsTitle').textContent=t('menuTitle');
 document.getElementById('settingsUser').textContent=(a.full_name||'')+' · '+t(a.role);
 document.getElementById('roleHistoryLabel').textContent=t(a.role==='passenger'?'menuHistoryPassenger':'menuHistoryDriver');
 if(a.role==='passenger'){
  app.innerHTML=`<section class="card"><div class="flex justify-between"><b>${escapeHtml(a.full_name)}</b><span class="text-xs text-green-700">${t('passenger')}</span></div><p class="muted text-xs mt-1">${escapeHtml(a.phone||'')}</p></section><section class="card mt-3"><label>${t('destination')}<input id="dest" placeholder="${t('destination')}"></label><button id="openMapBtn" class="primary w-full mt-3">${t('openMap')}</button><div id="mapPanel" class="hidden mt-3"><p class="font-bold mb-2">${t('mapTitle')}</p><div id="meshMap"></div><p class="map-note">${t('locating')}</p><button id="refreshDrivers" class="gold w-full mt-2">${t('refresh')}</button><div id="nearbyDrivers"></div></div><div id="passengerTrip" class="hidden mt-3 notice"></div><div id="passengerChat" class="hidden mt-3"></div></section>`;
  document.getElementById('openMapBtn').onclick=openPassengerMap;
  document.getElementById('refreshDrivers').onclick=refreshNearby;
  pollPassengerTrip();passengerTripTimer=setInterval(pollPassengerTrip,5000);
 }else{
  app.innerHTML=`<section class="card"><div class="flex justify-between"><b>${escapeHtml(a.full_name)}</b><span class="text-xs text-green-700">${t('driver')}</span></div><p class="muted text-xs mt-1">${escapeHtml(a.phone||'')}</p><p class="mt-2">${escapeHtml(a.car_type||'')} - ${escapeHtml(a.car_model||'')} - ${escapeHtml(a.car_color||'')}</p><p class="mt-2">${t('wallet')}: ${escapeHtml(a.wallet_balance||0)} ${t('rial')}</p><button id="duty" class="primary w-full mt-3">${a.is_off_duty?t('onDuty'):t('offDuty')}</button><p class="map-note">${t('shareLocation')}</p><div id="driverLocationNote" class="notice">${a.is_off_duty?t('offDuty'):t('locationUpdated')}</div><div id="driverTrips" class="mt-3"></div><div class="notice mt-3">${t('vehicleHelp')}</div><button id="vehicleToggle" class="gold w-full">${t('changeVehicle')}</button><div id="vehicleForm" class="hidden mt-3"><form id="vehicleChangeForm"><label>${t('carType')}<input id="newCarType" required></label><label>${t('model')}<input id="newCarModel" required></label><label>${t('color')}<input id="newCarColor" required></label><label>${t('plate')}<input id="newPlate" required></label><label>${t('reg')}<input id="newReg" required></label><label>${t('vehicleUrl')}<input id="newVehicleUrl" type="url" placeholder="https://..."></label><button class="primary w-full mt-3">${t('sendVehicle')}</button></form><p id="vehicleMsg" class="notice hidden"></p></div><button id="historyToggle" class="tab gold w-full mt-3">${t('vehicleHistory')}</button><div id="vehicleHistory" class="hidden mt-2"></div></section>`;
  document.getElementById('duty').onclick=async()=>{try{await api('/driver/duty',{offDuty:!a.is_off_duty},'PUT');a.is_off_duty=!a.is_off_duty;if(a.is_off_duty)stopDriverLocation();else startDriverLocation();renderHome()}catch(e){alert(e.message)}};
  document.getElementById('vehicleToggle').onclick=()=>document.getElementById('vehicleForm').classList.toggle('hidden');
  document.getElementById('vehicleChangeForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/driver/vehicles',{car:{type:document.getElementById('newCarType').value,model:document.getElementById('newCarModel').value,color:document.getElementById('newCarColor').value,plateNumber:document.getElementById('newPlate').value,registrationNumber:document.getElementById('newReg').value,vehicleImageUrl:document.getElementById('newVehicleUrl').value}},'POST');document.getElementById('vehicleMsg').textContent=d.message||t('vehicleSent');document.getElementById('vehicleMsg').classList.remove('hidden');e.target.reset()}catch(x){document.getElementById('vehicleMsg').textContent=x.message;document.getElementById('vehicleMsg').classList.remove('hidden')}};
  document.getElementById('historyToggle').onclick=async()=>{const el=document.getElementById('vehicleHistory');el.classList.toggle('hidden');if(!el.classList.contains('hidden')){try{const d=await api('/driver/vehicles',undefined,'GET');el.innerHTML=(d.vehicles||[]).map(v=>`<article class="border-b py-2 text-sm"><b>${escapeHtml(v.car_type)} ${escapeHtml(v.car_model)}</b><p>${escapeHtml(v.car_color)} · ${escapeHtml(v.plate_number)}</p><p class="muted small">${t('status')}: ${t(v.status==='approved'?'approved':v.status==='pending'?'pendingStatus':v.status==='rejected'?'rejected':'replaced')} · ${new Date(v.submitted_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${v.review_reason?`<p class="small">${t('vehicleRejected')}: ${escapeHtml(v.review_reason)}</p>`:''}</article>`).join('')||t('noHistory')}catch(e){el.textContent=e.message}}};
  if(!a.is_off_duty)startDriverLocation();refreshDriverTrips();driverTripTimer=setInterval(refreshDriverTrips,5000);
 }
}
function openPassengerMap(){
 const panel=document.getElementById('mapPanel');panel.classList.remove('hidden');
 if(!navigator.geolocation){alert(t('locationDenied'));return}
 navigator.geolocation.getCurrentPosition(async pos=>{
  passengerCoords={lat:pos.coords.latitude,lng:pos.coords.longitude};
  if(!meshMap){meshMap=L.map('meshMap').setView([passengerCoords.lat,passengerCoords.lng],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(meshMap)}else meshMap.setView([passengerCoords.lat,passengerCoords.lng],14);
  if(window.passengerPin)window.passengerPin.setLatLng([passengerCoords.lat,passengerCoords.lng]);else window.passengerPin=L.marker([passengerCoords.lat,passengerCoords.lng]).addTo(meshMap).bindPopup(lang==='ar'?'موقعك':'Your location');
  setTimeout(()=>meshMap.invalidateSize(),150);await refreshNearby();if(nearbyTimer)clearInterval(nearbyTimer);nearbyTimer=setInterval(refreshNearby,7000);
 },err=>alert(t('locationDenied')),{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
}
async function refreshNearby(){if(!passengerCoords)return;try{const q=new URLSearchParams({lat:passengerCoords.lat,lng:passengerCoords.lng});const d=await api('/drivers/nearby?'+q.toString(),undefined,'GET');const list=document.getElementById('nearbyDrivers');if(!list)return;window.nearbyPins=window.nearbyPins||[];window.nearbyPins.forEach(m=>meshMap&&meshMap.removeLayer(m));window.nearbyPins=[];list.innerHTML='';(d.drivers||[]).forEach(driver=>{const marker=L.marker([driver.latitude,driver.longitude]).addTo(meshMap).bindPopup(`<b>${escapeHtml(driver.full_name)}</b><br>${escapeHtml(driver.car_type)} ${escapeHtml(driver.car_model)}`);marker.on('click',()=>selectNearbyDriver(driver.id));window.nearbyPins.push(marker);const card=document.createElement('div');card.className='driver-card';card.innerHTML=`<b>${escapeHtml(driver.full_name)}</b><p class="text-sm">${escapeHtml(driver.car_type)} ${escapeHtml(driver.car_model)} · ${escapeHtml(driver.car_color)}</p><p class="text-sm">${t('plateLabel')}: ${escapeHtml(driver.plate_number)} · ${t('distance')} ${Number(driver.distance_km).toFixed(1)} ${t('km')}</p><button class="primary w-full mt-2">${t('chooseDriver')}</button>`;card.querySelector('button').onclick=()=>selectNearbyDriver(driver.id);list.appendChild(card)});if(!d.drivers?.length)list.textContent=t('noDrivers')}catch(e){const list=document.getElementById('nearbyDrivers');if(list)list.textContent=e.message}}
async function selectNearbyDriver(driverId){const destination=document.getElementById('dest')?.value.trim();if(!destination){alert(t('destinationRequired'));return}if(!passengerCoords){alert(t('locationDenied'));return}try{const d=await api('/trips',{driverId,pickupLat:passengerCoords.lat,pickupLng:passengerCoords.lng,destination});activeTripId=d.trip.id;if(nearbyTimer){clearInterval(nearbyTimer);nearbyTimer=null}const box=document.getElementById('passengerTrip');box.classList.remove('hidden');box.textContent=t('tripSent');pollPassengerTrip()}catch(e){alert(e.message)}}
function startDriverLocation(){if(!navigator.geolocation||driverWatch!==null)return;driverWatch=navigator.geolocation.watchPosition(async pos=>{if(Date.now()-lastDriverLocationSent<10000)return;lastDriverLocationSent=Date.now();try{await api('/driver/location',{latitude:pos.coords.latitude,longitude:pos.coords.longitude},'PUT');const n=document.getElementById('driverLocationNote');if(n)n.textContent=t('locationUpdated')}catch(e){const n=document.getElementById('driverLocationNote');if(n)n.textContent=e.message}},err=>{const n=document.getElementById('driverLocationNote');if(n)n.textContent=t('locationDenied')},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});}
function stopDriverLocation(){if(driverWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(driverWatch);driverWatch=null}}
async function pollPassengerTrip(){try{const d=await api('/passenger/trips',undefined,'GET');const trip=d.trip;const box=document.getElementById('passengerTrip');if(!trip){if(box&&activeTripId){box.textContent=t('completed')}return}activeTripId=trip.id;if(box){box.classList.remove('hidden');box.innerHTML=`<b>${t('tripStatus')}: ${t(trip.status)||escapeHtml(trip.status)}</b><p>${escapeHtml(trip.driver_name||'')} · ${escapeHtml(trip.car_type||'')} ${escapeHtml(trip.car_model||'')}</p><p>${t('fare')}: ${escapeHtml(trip.fare_amount)} ${t('rial')}</p>${trip.status==='requested'?`<button id="cancelTrip" class="danger mt-2">${t('cancel')}</button>`:''}`;if(trip.status==='requested')document.getElementById('cancelTrip').onclick=()=>updateTripStatus(trip.id,'cancelled')}
 if(['accepted','arrived','in_progress'].includes(trip.status))showChat(trip.id,trip.status,trip.driver_name||'');else hideChat();
 }catch(e){console.warn(e)}}
async function refreshDriverTrips(){try{const d=await api('/driver/trips',undefined,'GET');const el=document.getElementById('driverTrips');if(!el)return;el.innerHTML=`<b>${t('driverRequests')}</b>`+(d.trips||[]).map(tr=>`<article class="driver-card"><b>${escapeHtml(tr.passenger_name)}</b><p class="text-sm">${escapeHtml(tr.dropoff_address)}</p><p class="text-sm">${t('fare')}: ${escapeHtml(tr.fare_amount)} ${t('rial')} · ${t('status')}: ${t(tr.status)||escapeHtml(tr.status)}</p><div class="flex gap-2 mt-2">${tr.status==='requested'?`<button class="primary flex-1" data-status="accepted" data-id="${tr.id}">${t('accept')}</button>`:''}${tr.status==='accepted'?`<button class="gold flex-1" data-status="arrived" data-id="${tr.id}">${t('markArrived')}</button>`:''}${tr.status==='arrived'?`<button class="gold flex-1" data-status="in_progress" data-id="${tr.id}">${t('startRide')}</button>`:''}${tr.status==='in_progress'?`<button class="primary flex-1" data-status="completed" data-id="${tr.id}">${t('finishRide')}</button>`:''}</div></article>`).join('')||`<p class="notice">${t('noRequests')}</p>`;el.querySelectorAll('button[data-status]').forEach(b=>b.onclick=()=>updateTripStatus(Number(b.dataset.id),b.dataset.status));const active=(d.trips||[]).find(x=>['accepted','arrived','in_progress'].includes(x.status));if(active)showChat(active.id,active.status,active.passenger_name);else hideChat()}catch(e){console.warn(e)}}
async function updateTripStatus(id,status){try{await api('/trips/'+id+'/status',{status},'PATCH');if(account.role==='driver')refreshDriverTrips();else pollPassengerTrip()}catch(e){alert(e.message)}}
function showChat(id,status,otherName){const target=account.role==='passenger'?document.getElementById('passengerChat'):document.getElementById('driverTrips');if(!target)return;let wrap=document.getElementById('tripChatPanel');if(wrap&&wrap.dataset.tripId===String(id)){loadChat(id);return}if(!wrap){wrap=document.createElement('section');wrap.id='tripChatPanel';wrap.className='driver-card';target.parentNode.insertBefore(wrap,target.nextSibling)}wrap.dataset.tripId=String(id);wrap.innerHTML=`<b>${t('chatTitle')} · ${escapeHtml(otherName||'')}</b><div id="tripChatMessages" class="chat-box"></div><form id="tripChatForm" class="flex gap-2"><input id="tripChatInput" placeholder="${t('messagePlaceholder')}" maxlength="1000" required><button class="primary">${t('send')}</button></form><p id="chatLocked" class="map-note"></p>`;loadChat(id);if(chatTimer)clearInterval(chatTimer);chatTimer=setInterval(()=>loadChat(id),3000);document.getElementById('tripChatForm').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('tripChatInput');const text=input.value.trim();if(!text)return;try{await api('/trips/'+id+'/messages',{message:text});input.value='';loadChat(id)}catch(err){alert(err.message)}}}
async function loadChat(id){try{const d=await api('/trips/'+id+'/messages',undefined,'GET');const box=document.getElementById('tripChatMessages');if(!box)return;box.innerHTML=(d.messages||[]).map(m=>`<div class="chat-line ${String(m.sender_id)===String(account.id)?'mine':''}"><b>${escapeHtml(m.sender_name||'')}</b><div>${escapeHtml(m.message)}</div><small>${new Date(m.created_at).toLocaleTimeString(lang==='ar'?'ar':'en',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<p class="map-note">—</p>';box.scrollTop=box.scrollHeight;if(d.locked){document.getElementById('tripChatForm')?.classList.add('hidden');const l=document.getElementById('chatLocked');if(l)l.textContent=t('chatLocked')}}catch(e){}}
function hideChat(){if(chatTimer){clearInterval(chatTimer);chatTimer=null}document.getElementById('tripChatPanel')?.remove()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleSettings(open){const el=document.getElementById('settingsOverlay');if(el)el.style.display=open?'block':'none'}
function settingsAction(key){toggleSettings(false);if(key==='appearance'){theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_theme',theme);return}if(key==='language'){lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_lang',lang);setDir();if(account)home();else start();return}if(key==='account'){alert((account?.full_name||'')+'\n'+(account?.phone||''));return}alert(t('notReady'))}
async function logout(){if(account?.role==='driver'&&!account.is_off_duty){try{await api('/driver/duty',{offDuty:true},'PUT')}catch(e){}}stopDriverLocation();stopTimers();toggleSettings(false);document.getElementById('menuBtn').style.display='none';token='';account=null;chosenRole='';localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(account?.role==='driver'&&!account.is_off_duty){try{await api('/driver/duty',{offDuty:true},'PUT')}catch(e){}}stopDriverLocation();stopTimers();toggleSettings(false);if(!confirm(t('factoryConfirm')+'\n\n'+t('factoryWarn')))return;try{token='';account=null;chosenRole='';for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}
if(token)home();else start();
</script>
<script>if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(error=>console.warn('PWA registration failed',error)))}</script>
</body></html>
