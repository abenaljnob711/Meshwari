function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();reader.onerror=()=>reject(Error(t('error')));reader.onload=()=>{
  const img=new Image();img.onerror=()=>reject(Error(t('error')));img.onload=()=>{
   const scale=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let dataUrl=canvas.toDataURL('image/jpeg',0.78);
   if(dataUrl.length>2.55*1024*1024)dataUrl=canvas.toDataURL('image/jpeg',0.62);
   if(dataUrl.length>2.55*1024*1024)return reject(Error('حجم الصورة كبير. التقط صورة أوضح بحجم أصغر.'));
   resolve({dataUrl,fileName:(file.name||'image').replace(/[^\w.\-ء-ي]/g,'_').slice(0,120)+'.jpg'});
  };img.src=reader.result;
 };reader.readAsDataURL(file);
});}
async function collectRegistrationDocuments(){
 const docs=[];
 async function add(id,type,multiple=false){const camera=Array.from(document.getElementById(id+'Camera')?.files||[]),gallery=Array.from(document.getElementById(id+'Gallery')?.files||[]),files=[...camera,...gallery];if(!files.length)throw Error(t('documentsRequired'));if(!multiple&&files.length!==1)throw Error(t('documentsRequired'));if(multiple&&files.length>3)throw Error('يمكن إرفاق 3 صور لوثائق السيارة كحد أقصى');for(const file of files){const image=await imageFileToDataUrl(file);docs.push({type,dataUrl:image.dataUrl,fileName:image.fileName});}}
 await add('idFront','national_id_front');await add('idBack','national_id_back');
 if(chosenRole==='driver'){await add('vehicleDocuments','vehicle_documents',true);await add('driverSelfie','driver_selfie');await add('vehiclePhoto','vehicle_photo');}
 if(docs.reduce((sum,item)=>sum+item.dataUrl.length,0)>16*1024*1024)throw Error('إجمالي حجم الصور كبير. اختر صوراً أصغر.');
 return docs;
}

document.getElementById('settingsToggle').onclick=()=>document.getElementById('settingsPanel').classList.toggle('hidden');

if(a.role==='passenger'){

async function lookupPassengerPlace(point){
 const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ar&lat='+encodeURIComponent(point.lat)+'&lon='+encodeURIComponent(point.lng);
 const response=await fetch(url,{headers:{'Accept':'application/json'}});
 if(!response.ok)throw new Error('تعذر تحديد اسم الموقع');
 const place=await response.json(),a=place.address||{};
 return a.neighbourhood||a.suburb||a.quarter||a.village||a.town||a.city||a.municipality||a.road||place.name||place.display_name||'';
}
function updatePassengerRouteSummary(){
 const pickup=document.getElementById('passengerPickupLabel'),destination=document.getElementById('passengerDestinationLabel'),next=document.getElementById('findDrivers');
 if(pickup)pickup.textContent=passengerPickupAddress||(passengerMapPosition?'جارٍ تحديد اسم موقعك...':'جارٍ تحديد موقعك...');
 if(destination)destination.textContent=passengerDestinationAddress||(passengerDestinationPosition?'جارٍ تحديد اسم الوجهة...':'حدد وجهتك على الخريطة');
 if(next)next.disabled=!(passengerMapPosition&&passengerDestinationPosition&&!passengerDestinationLookupPending);
}
async function initPassengerMap(){
 const el=document.getElementById('passengerMap');if(!el||!token)return;
 if(!window.L){const status=document.getElementById('mapStatus');if(status)status.textContent='تعذر تحميل مكتبة الخريطة. تحقق من اتصال الإنترنت.';return}
 if(!passengerMap){
  passengerMap=L.map(el,{zoomControl:true,preferCanvas:true,updateWhenZooming:false}).setView([15.3694,44.1910],13);
  const mapTiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
   maxZoom:17,maxNativeZoom:17,keepBuffer:2,updateWhenIdle:true,updateWhenZooming:false,
   attribution:'© OpenStreetMap'
  }).addTo(passengerMap);
  mapTiles.on('tileerror',()=>{const status=document.getElementById('mapStatus');if(status)status.textContent='الاتصال بطيء: ستظهر أجزاء الخريطة المحفوظة، ويمكنك مواصلة تحديد الوجهة.'});
  mapTiles.on('load',()=>{const status=document.getElementById('mapStatus');if(status&&status.textContent.includes('الاتصال بطيء'))status.textContent='تم تحميل أجزاء الخريطة المتاحة'});
  passengerDriverLayer=L.layerGroup().addTo(passengerMap);
  const makeMapPin=color=>L.divIcon({className:'mw-map-pin-wrap',html:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 38" aria-hidden="true"><path d="M14 1C6.82 1 1 6.82 1 14c0 9.75 13 23 13 23s13-13.25 13-23C27 6.82 21.18 1 14 1Z" fill="'+color+'" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="4.5" fill="#fff"/></svg>',iconSize:[28,38],iconAnchor:[14,36],popupAnchor:[0,-34]});
  const myPin=makeMapPin('#168cff');
  const destinationPin=makeMapPin('#ef4444');
  passengerMap.on('click',async event=>{
   const point={lat:event.latlng.lat,lng:event.latlng.lng};
   passengerDestinationPosition=point;
   passengerDestinationAddress='';
   passengerDestinationLookupPending=true;
   const dest=document.getElementById('dest');
   if(dest)dest.value=point.lat.toFixed(6)+', '+point.lng.toFixed(6);
   const destinationLabel=document.getElementById('passengerDestinationLabel');
   if(destinationLabel)destinationLabel.textContent='جارٍ تحديد اسم الوجهة...';
   updatePassengerRouteSummary();
   if(passengerDestinationMarker)passengerDestinationMarker.setLatLng([point.lat,point.lng]);
   else passengerDestinationMarker=L.marker([point.lat,point.lng],{icon:destinationPin}).addTo(passengerMap);
   passengerDestinationMarker.bindPopup('الوجهة المحددة').openPopup();
   const status=document.getElementById('mapStatus');
   if(status)status.textContent='تم تحديد موقع الوجهة على الخريطة باللون الأحمر';
   try{
    const place=await lookupPassengerPlace(point);
    if(passengerDestinationPosition===point){
     passengerDestinationAddress=place||'الوجهة المحددة على الخريطة';
     if(dest)dest.value=passengerDestinationAddress;
     passengerDestinationLookupPending=false;
     updatePassengerRouteSummary();
    }
   }catch(_){
    if(passengerDestinationPosition===point){
     passengerDestinationAddress='الوجهة المحددة على الخريطة';
     if(dest)dest.value=point.lat.toFixed(6)+', '+point.lng.toFixed(6);
     passengerDestinationLookupPending=false;
     updatePassengerRouteSummary();
    }
   }
  });
 }
 setTimeout(()=>passengerMap&&passengerMap.invalidateSize(),250);
 if(!navigator.geolocation){document.getElementById('mapStatus').textContent='الموقع الجغرافي غير مدعوم في هذا الجهاز';return}
 if(passengerWatchId!==null)navigator.geolocation.clearWatch(passengerWatchId);
 passengerWatchId=navigator.geolocation.watchPosition(async pos=>{
  passengerMapPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};
  updatePassengerRouteSummary();
  if(!passengerPickupAddress&&!passengerPickupLookupPending){
   passengerPickupLookupPending=true;
   lookupPassengerPlace(passengerMapPosition).then(name=>{
    passengerPickupAddress=name||'موقعي الحالي';
    updatePassengerRouteSummary();
   }).catch(()=>{
    passengerPickupAddress='موقعي الحالي';
    updatePassengerRouteSummary();
   });
  }
  if(!passengerUserMarker){
   passengerUserMarker=L.marker([passengerMapPosition.lat,passengerMapPosition.lng],{icon:myPin}).addTo(passengerMap).bindPopup('موقعك الحالي');
   passengerMap.setView([passengerMapPosition.lat,passengerMapPosition.lng],14);
  }else passengerUserMarker.setLatLng([passengerMapPosition.lat,passengerMapPosition.lng]);
  await refreshPassengerMapDrivers();
 },err=>{
  const status=document.getElementById('mapStatus');
  if(status)status.textContent=err.code===1?'اسمح للتطبيق بالوصول إلى الموقع حتى تظهر مواقع السائقين':'تعذر تحديد موقعك. تحقق من GPS.';
 },{enableHighAccuracy:false,maximumAge:60000,timeout:30000});
 if(passengerMapRefreshTimer)clearInterval(passengerMapRefreshTimer);
 passengerMapRefreshTimer=setInterval(()=>{if(passengerMapPosition)refreshPassengerMapDrivers()},60000);
}
let passengerDriversRequestAt=0,passengerDriversRequestPending=false;
async function refreshPassengerMapDrivers(force=false){
 if(!passengerMapPosition||!passengerDriverLayer||!token||passengerDriversRequestPending)return;
 const now=Date.now();
 if(!force&&now-passengerDriversRequestAt<45000)return;
 passengerDriversRequestPending=true;passengerDriversRequestAt=now;
 try{
  const {lat,lng}=passengerMapPosition;
  const data=await api('/drivers/nearby?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lng),undefined,'GET');
  passengerDriverLayer.clearLayers();
  (data.drivers||[]).forEach(d=>{
   if(!Number.isFinite(Number(d.latitude))||!Number.isFinite(Number(d.longitude)))return;
   const marker=L.circleMarker([Number(d.latitude),Number(d.longitude)],{radius:8,color:'#fff',weight:2,fillColor:'#20d978',fillOpacity:1}).addTo(passengerDriverLayer);
   marker.bindPopup('<b>'+escapeHtml(d.car_type||'سيارة')+' '+escapeHtml(d.car_model||'')+'</b><br>'+Number(d.distance_km||0).toFixed(1)+' كم');
  });
  const status=document.getElementById('mapStatus');
  if(status)status.textContent=(data.drivers||[]).length?'السائقون المتاحون ظاهرون على الخريطة · تحديث اقتصادي للبيانات':'لم يظهر سائق متاح قريب حالياً. تأكد أن السائق فعّل استقبال الرحلات.';
 }catch(e){
  // Keep the last successfully received driver markers visible during outages.
  const status=document.getElementById('mapStatus');
  if(status)status.textContent='الاتصال ضعيف أو منقطع؛ نحتفظ بآخر مواقع السائقين المحمّلة ونحاول لاحقاً.';
  passengerDriversRequestAt=Date.now()-30000;
 }finally{passengerDriversRequestPending=false}
}
async function findDriversForNegotiation(){
 const box=document.getElementById('nearbyDrivers'),destination=document.getElementById('dest').value.trim();
 if(!destination){alert('اكتب الوجهة أولاً');return}
 if(!navigator.geolocation){alert('الموقع الجغرافي غير مدعوم في هذا الجهاز');return}
 box.textContent='جارٍ تحديد موقعك والبحث عن السائقين...';
 navigator.geolocation.getCurrentPosition(async position=>{
  try{
   const lat=position.coords.latitude,lng=position.coords.longitude;
   const data=await api('/drivers/nearby?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lng),undefined,'GET');
   const drivers=data.drivers||[];
   if(!drivers.length){box.textContent='لا يوجد سائقون متاحون قريبون حالياً';return}
   box.innerHTML='<label>اختر السائق</label><select id="negotiationDriver" class="w-full">'+drivers.map(d=>'<option value="'+Number(d.id)+'">'+escapeHtml(d.car_type||'سيارة')+' · '+escapeHtml(d.car_model||'')+' · '+Number(d.distance_km||0).toFixed(1)+' كم</option>').join('')+'</select><button id="startNegotiation" class="primary w-full mt-2">بدء محادثة والتفاوض</button>';
   document.getElementById('startNegotiation').onclick=async()=>{
    try{
     const created=await api('/pretrip-chats',{driverId:Number(document.getElementById('negotiationDriver').value),destination,pickupLat:lat,pickupLng:lng,pickupAddress:passengerPickupAddress||'موقعي الحالي'});
     box.textContent='بدأت المحادثة. انتظر رد السائق واتفقا على الأجرة.';
     await loadPassengerNegotiations();
    }catch(e){alert(e.message)}
   };
  }catch(e){box.textContent=e.message}
 },error=>{box.textContent=error.code===1?'اسمح للتطبيق بالوصول إلى موقعك للبحث عن السائقين':'تعذر تحديد موقعك. تحقق من إعدادات الموقع.'},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
async function loadPassengerNegotiations(){
 const box=document.getElementById('passengerNegotiations');if(!box||!token)return;
 try{
  const [data,tripData]=await Promise.all([api('/pretrip-chats',undefined,'GET'),api('/passenger/trips',undefined,'GET')]);
  const chats=data.chats||[],trip=tripData.trip;
  const tripBox=trip?'<article class="card mt-2"><b>رحلتك الحالية</b><p class="small mt-1">الوجهة: '+escapeHtml(trip.dropoff_address||'')+'</p><p class="small">الحالة: '+({requested:'بانتظار قبول السائق',accepted:'وافق السائق على الرحلة',arrived:'وصل السائق إلى موقعك',in_progress:'الرحلة جارية'}[trip.status]||trip.status)+'</p><p class="font-bold">الأجرة: '+escapeHtml(trip.fare_amount)+' ريال</p>'+(trip.status==='requested'?'<button class="tab w-full mt-2" onclick="cancelPassengerTrip('+Number(trip.id)+')">إلغاء الطلب</button>':'')+'</article>':'';
  box.innerHTML=tripBox+chats.map(c=>'<article class="card mt-2"><b>محادثة مع '+escapeHtml(c.other_name||'السائق')+'</b><p class="small mt-1">'+escapeHtml(c.dropoff_address||'')+'</p><p class="small">الحالة: '+(c.status==='agreed'?'تم الاتفاق على الأجرة':'بانتظار التفاوض')+'</p>'+(c.agreed_fare?'<p class="font-bold">الأجرة المتفق عليها: '+escapeHtml(c.agreed_fare)+' ريال</p><button class="primary w-full mt-2" onclick="confirmNegotiatedTrip('+Number(c.id)+')">تأكيد الأجرة وطلب الرحلة</button>':'')+'<div class="flex gap-2 mt-2"><input id="passengerMsg'+Number(c.id)+'" placeholder="اكتب رسالة للسائق"><button class="gold" onclick="sendPassengerNegotiationMessage('+Number(c.id)+')">إرسال</button></div><button class="tab w-full mt-2" onclick="showPassengerNegotiation('+Number(c.id)+')">عرض الرسائل</button><div id="passengerChat'+Number(c.id)+'" class="small mt-2"></div></article>').join('')||(!trip?'':'');
 }catch(e){box.textContent=e.message}
}
async function cancelPassengerTrip(id){if(!confirm('هل تريد إلغاء طلب الرحلة؟'))return;try{await api('/trips/'+id+'/status',{status:'cancelled'},'PATCH');await loadPassengerNegotiations()}catch(e){alert(e.message)}}
async function showPassengerNegotiation(id){
 const box=document.getElementById('passengerChat'+id);if(!box)return;
 try{const d=await api('/pretrip-chats/'+id,undefined,'GET');box.innerHTML=(d.messages||[]).map(m=>'<p>'+escapeHtml(m.message)+'</p>').join('')||'لا توجد رسائل بعد'}catch(e){box.textContent=e.message}
}
async function sendPassengerNegotiationMessage(id){
 const input=document.getElementById('passengerMsg'+id),message=input?.value.trim();if(!message)return;
 try{await api('/pretrip-chats/'+id+'/messages',{message});input.value='';await showPassengerNegotiation(id)}catch(e){alert(e.message)}
}
async function confirmNegotiatedTrip(id){
 if(!confirm('هل تؤكد الأجرة المتفق عليها وتريد إرسال طلب الرحلة؟'))return;
 try{const d=await api('/pretrip-chats/'+id+'/convert',{},'POST');alert(d.message||'تم إرسال طلب الرحلة');await loadPassengerNegotiations()}catch(e){alert(e.message)}
}
function accountLockKey(){return account?`mw_account_lock_${account.role}_${account.id}`:''}
function getLocalLockConfig(){try{const raw=accountLockKey()&&localStorage.getItem(accountLockKey());return raw?JSON.parse(raw):null}catch{return null}}
async function lockDigest(value,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(value)),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16))),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAccountLockFields(){const method=document.getElementById('accountLockMethod').value,box=document.getElementById('accountLockFields');if(method==='pattern'){box.innerHTML=`<p class=\"small muted mt-2\">${t('lockSecret')}</p><div id=\"accountPatternGrid\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear\" class=\"tab w-full mt-1\">${t('cancel')}</button><p class=\"small muted mt-2\">${t('lockSecretAgain')}</p><div id=\"accountPatternGrid2\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText2\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear2\" class=\"tab w-full mt-1\">${t('cancel')}</button>`;window.accountPatternA=wireAccountPattern('accountPatternGrid','accountPatternText','accountPatternClear');window.accountPatternB=wireAccountPattern('accountPatternGrid2','accountPatternText2','accountPatternClear2')}else{box.innerHTML=`<label>${t('lockSecret')}<input id=\"accountLockSecret\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label><label>${t('lockSecretAgain')}<input id=\"accountLockSecretAgain\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label>`}}
function wireAccountPattern(gridId,textId,clearId){const grid=document.getElementById(gridId),label=document.getElementById(textId);let points=[];const add=e=>{const b=e.target.closest('[data-dot]');if(!b||!grid.contains(b))return;const n=b.dataset.dot;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('primary');label.textContent=points.join(' · ')}};grid.addEventListener('click',add);document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''};return()=>points.join('')}
async function saveAccountLock(){const method=document.getElementById('accountLockMethod').value,msg=document.getElementById('accountLockMessage');msg.classList.remove('hidden');try{if(method==='off'){localStorage.removeItem(accountLockKey());accountUnlocked=true;msg.textContent=t('lockSaved');return}let a,b;if(method==='pattern'){a=window.accountPatternA?.()||'';b=window.accountPatternB?.()||''}else{a=document.getElementById('accountLockSecret').value;b=document.getElementById('accountLockSecretAgain').value}if(a.length<4||a!==b||(method==='pattern'&&(!/^[1-9]{4,9}$/.test(a)||new Set(a).size<4))){msg.textContent=t('lockNeed');return}const salt=lockSalt();localStorage.setItem(accountLockKey(),JSON.stringify({method,salt,hash:await lockDigest(a,salt)}));accountUnlocked=true;msg.textContent=t('lockSaved')}catch(e){msg.textContent=t('error')}}
function showAccountUnlock(cfg){app.innerHTML=`<section class=\"card text-center\"><h2 class=\"font-bold text-xl\">${t('lockScreenTitle')}</h2><p class=\"muted text-sm my-3\">${t('lockScreenHelp')}</p>${cfg.method==='pattern'?`<div id=\"accountUnlockGrid\" class=\"grid grid-cols-3 gap-3 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:64px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountUnlockPatternText\" class=\"small muted mt-2\"></p><button id=\"accountUnlockClear\" class=\"tab w-full mt-2\">${t('cancel')}</button>`:`<input id=\"accountUnlockSecret\" type=\"password\" autocomplete=\"off\" placeholder=\"${t('lockSecret')}\">`}<button id=\"accountUnlockButton\" class=\"primary w-full mt-3\">${t('lockOpen')}</button><p id=\"accountUnlockError\" class=\"notice hidden\"></p><button class=\"tab w-full mt-3\" onclick=\"logout()\">${t('logout')}</button></section>`;let value='';if(cfg.method==='pattern'){const grid=document.getElementById('accountUnlockGrid'),label=document.getElementById('accountUnlockPatternText');grid.addEventListener('click',e=>{const b=e.target.closest('[data-dot]');if(b&&!value.includes(b.dataset.dot)&&value.length<9){value+=b.dataset.dot;b.classList.add('primary');label.textContent=value.split('').join(' · ')}});document.getElementById('accountUnlockClear').onclick=()=>{value='';grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''}}document.getElementById('accountUnlockButton').onclick=async()=>{const candidate=cfg.method==='pattern'?value:document.getElementById('accountUnlockSecret').value;const err=document.getElementById('accountUnlockError');if(cfg.method==='pattern'&&(!/^[1-9]{4,9}$/.test(candidate)||new Set(candidate).size<4)){err.textContent=t('lockWrong');err.classList.remove('hidden');return}if(await lockDigest(candidate,cfg.salt)===cfg.hash){accountUnlocked=true;renderHome()}else{err.textContent=t('lockWrong');err.classList.remove('hidden');value='';if(cfg.method==='pattern')document.getElementById('accountUnlockClear').click();else document.getElementById('accountUnlockSecret').value=''}};document.getElementById('accountUnlockSecret')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('accountUnlockButton').click()})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){if(passengerNegotiationTimer)clearInterval(passengerNegotiationTimer);if(passengerMapRefreshTimer)clearInterval(passengerMapRefreshTimer);if(passengerWatchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(passengerWatchId);passengerNegotiationTimer=null;passengerMapRefreshTimer=null;passengerWatchId=null;token='';account=null;chosenRole='';accountUnlocked=false;localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(!confirm(t('factoryConfirm')))return;try{if(accountLockKey())localStorage.removeItem(accountLockKey());token='';account=null;chosenRole='';accountUnlocked=false;for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}

// Delegated ripple: covers every current and future button in passenger/driver UI.
document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

if(token)home();else start();
</script>

<script>
async function refreshMeshwariPage(button){
  if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='…';}
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.update().catch(()=>null)));
    }
  }catch(error){console.warn('Refresh update check failed',error);}
  const freshUrl=new URL(location.href);
  freshUrl.searchParams.set('_mw_refresh',String(Date.now()));
  location.replace(freshUrl.href);
}
</script>
