/* Global touch ripple for every button, including buttons rendered dynamically. */
button{position:relative;overflow:hidden;isolation:isolate;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:filter .12s ease,transform .12s ease}
button:active{filter:brightness(.88);transform:scale(.985)}
.ripple-wave{position:absolute;z-index:5;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.48);transform:translate(-50%,-50%) scale(0);animation:meshButtonRipple .58s ease-out forwards}
@keyframes meshButtonRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* Meshwari unified visual identity — based on the approved passenger registration reference */
:root{--bg:#020d1b;--card:#071b2c;--fg:#f4f8ff;--muted:#b6c9d7;--accent:#13c8ed;--green:#20d978}
[data-theme="dark"]{--bg:#020d1b;--card:#071b2c;--fg:#f4f8ff;--muted:#b6c9d7;--accent:#13c8ed;--green:#20d978}
[data-theme="light"]{--bg:#f3f6f8;--card:#ffffff;--fg:#17212b;--muted:#64748b;--accent:#0784a8;--green:#13834d}
html,body{min-height:100%;background:var(--bg)!important;color:var(--fg)!important;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:560px;min-height:100dvh;background:radial-gradient(ellipse at 50% 28%,#0b2a3d 0%,#041629 55%,#020b18 100%);border-left:1px solid #00c7d866;border-right:1px solid #00c7d866;box-shadow:0 0 35px #00d5e51c}
.mesh-header{height:178px;position:relative;display:flex;align-items:flex-start;justify-content:flex-end;padding:18px 18px 0;background:linear-gradient(180deg,#020b18,#04182b);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#20e878,#13c8ed,#20e878) 1;overflow:hidden}
.mesh-brand-art{position:absolute;inset:0;background-image:url('/assets/mesh-header.jpg');background-repeat:no-repeat;background-position:left center;background-size:auto 100%;pointer-events:none}
.mesh-header-actions{position:relative;z-index:2;display:flex;gap:8px;margin-right:0}
.mesh-header-actions button{background:#071b2dcc!important;color:#f4fbff!important;border:1px solid #7894a866;border-radius:30px;min-width:44px;min-height:42px;padding:8px 13px;box-shadow:0 0 12px #00d5e51a}
main#app{padding:14px 14px 18px;flex:1}
.card{background:linear-gradient(145deg,#0b2638f2,#071a2bf5)!important;border:1px solid #00d5d477!important;border-radius:24px!important;padding:20px!important;box-shadow:inset 0 0 18px #00d5e511,0 0 16px #00d5e511!important;color:#f4f8ff!important}
.card>h2{background:linear-gradient(110deg,#09283c,#0b3147);border:1px solid #00cde866;border-radius:16px;padding:16px 12px;color:#f8fbff;font-size:20px!important;text-align:center;box-shadow:inset 0 0 14px #00cde822}
.card>h2::first-letter{color:#13c8ed}.role-icon{display:inline-block;margin-left:10px;font-size:25px;vertical-align:middle}.role-name{color:#13c8ed}
.card p,.card label,.card h3,.muted{color:#d7e6f0!important}
form label{position:relative;font-size:15px!important;color:#eaf5fb!important;margin-top:13px!important}
form label>input:not([type=file]),form label>select,form input:not([type=file]),form select{background:linear-gradient(120deg,#102c40,#0b2235)!important;border:2px solid #536f8099!important;border-radius:17px!important;color:#f6fbff!important;min-height:58px!important;padding:13px 18px!important;font-size:17px!important;box-shadow:inset 0 2px 10px #0003!important}
form input::placeholder{color:#b9cbd7!important;opacity:1}
.grid2:has(#country){direction:ltr;gap:10px}
#country{direction:ltr;text-align:left}
#phone{direction:rtl;text-align:right}
.upload-actions{direction:ltr;gap:12px;margin-top:12px}
.upload-actions button{min-height:54px!important;border-radius:15px!important;font-size:14px!important;background:linear-gradient(120deg,#092d47,#0b253b)!important;border:2px solid #08b9f1!important;color:#eaf9ff!important;box-shadow:0 0 10px #00bfff22}
.upload-actions button:nth-child(2){border-color:#20df80!important;color:#32e88c!important;background:linear-gradient(120deg,#082d2b,#0a2532)!important}

form hr{border-color:#16c9df66!important;margin:16px 0!important}

button.primary{background:linear-gradient(105deg,#20d978,#36e78a)!important;color:#031a18!important;border:1px solid #78ffb1!important;border-radius:15px!important;box-shadow:0 0 14px #1fe78335!important}
button.gold{background:linear-gradient(105deg,#092b43,#0b2338)!important;color:#18c9ed!important;border:1px solid #13bfe5!important;border-radius:15px!important}
#regForm>label:nth-of-type(1):after{content:"♟";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(2):after{content:"▤";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(3):after{content:"☎";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(-n+3)>input{padding-right:52px!important}#regSubmit{min-height:58px!important;font-size:19px!important;font-weight:900!important;margin-top:17px!important}
#regForm~button.gold{background:transparent!important;border:0!important;color:#13c8ed!important;font-size:19px!important}
.notice{background:#0c3043!important;border:1px solid #17c9e077!important;color:#effaff!important;border-radius:14px!important}
.mesh-footer{min-height:125px;display:flex;align-items:flex-start;justify-content:center;padding:12px 8px 68px;background-image:url('/assets/mesh-footer.jpg');background-repeat:no-repeat;background-position:center bottom;background-size:100% auto;color:#f2f8ff;font-size:17px;text-shadow:0 2px 8px #000}
@media(max-width:420px){.mesh-header{height:158px;padding:13px 12px 0}.mesh-brand-art{background-size:auto 100%}.mesh-header-actions button{min-width:38px;min-height:38px;padding:6px 10px}main#app{padding:11px}.card{padding:15px!important}.card>h2{font-size:17px!important}.form label{font-size:14px}}


.trip-map-shell{position:relative;margin:-14px -14px 14px;height:46vh;min-height:300px;max-height:520px;background:#dbeafe;overflow:hidden;border-radius:0 0 22px 22px}
#passengerMap{height:100%;width:100%;z-index:1}.trip-map-recenter{position:absolute;z-index:500;left:16px;bottom:16px;background:#fff;color:#17212b;border-radius:50%;width:52px;height:52px;box-shadow:0 4px 16px #0003;font-size:23px}

.trip-add-stop{background:transparent;color:#d98a18;padding:10px 0;display:flex;align-items:center;gap:8px}.trip-add-stop .plus{border:2px solid currentColor;border-radius:50%;width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center}
.trip-action{width:100%;min-height:58px;background:#e99413;color:#fff;font-size:19px;margin-top:12px}
.trip-search-row button{background:#e99413;color:#fff;min-width:58px}.trip-results{background:#fff;border:1px solid #ddd;border-radius:12px;max-height:180px;overflow:auto;color:#222}
.trip-result{display:block;width:100%;text-align:right;background:#fff;color:#222;border-bottom:1px solid #eee;border-radius:0}

.trip-vehicle-card{flex:0 0 72%;max-width:260px;display:flex;flex-direction:column;align-items:stretch;gap:7px;background:#fff;color:#17212b;border:2px solid #d7dee7;border-radius:16px;padding:10px;text-align:right;scroll-snap-align:center}
.trip-vehicle-card.selected{border-color:#e99413;box-shadow:0 0 0 2px #e9941322}
.trip-vehicle-image{width:100%;height:138px;object-fit:cover;border-radius:11px;background:#e8edf2}

.trip-vehicle-card small{color:#64748b}

.trip-map-note{font-size:12px;color:#64748b;margin:6px 0}.leaflet-container{font-family:Tahoma,Arial,sans-serif}

#themeBtn{min-width:0;min-height:38px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;border-radius:10px;box-shadow:none;white-space:nowrap}#themeBtn span:first-child{font-size:17px;line-height:1}@media(max-width:480px){#themeBtn{min-height:36px;padding:6px 8px;font-size:12px;gap:5px}#themeBtn span:first-child{font-size:16px}}

.trip-interaction-title{font-size:18px;font-weight:900;margin:0 0 12px;color:#eaf8ff}

.trip-call-active{color:#39e6a0;font-weight:800;align-self:center}.trip-chat audio{display:none}

function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();reader.onerror=()=>reject(Error(t('error')));reader.onload=()=>{
  const img=new Image();img.onerror=()=>reject(Error(t('error')));img.onload=()=>{
   const scale=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let dataUrl=canvas.toDataURL('image/jpeg',0.78);
   if(dataUrl.length>2.55*1024*1024)dataUrl=canvas.toDataURL('image/jpeg',0.62);
   if(dataUrl.length>2.55*1024*1024)return reject(Error('حجم الصورة كبير. التقط صورة أوضح بحجم أصغر.'));
   resolve({dataUrl,fileName:(file.name||'image').replace(/[^\w.\-ء-ي]/g,'_').slice(0,120)+'.jpg'});
  };img.src=reader.result;
 };reader.readAsDataURL(file);
});}

function formatTripManeuver(step){

async function checkTripCoverage(point, label){
 if(!point||!Number.isFinite(point.lat)||!Number.isFinite(point.lng))return null;
 const key=point.lat.toFixed(5)+','+point.lng.toFixed(5),cached=tripCoverageCache.get(key);
 let coverage=cached&&Date.now()-cached.at<15000?cached.value:null;
 if(!coverage){
  try{coverage=await api('/coverage?lat='+encodeURIComponent(point.lat)+'&lng='+encodeURIComponent(point.lng),undefined,'GET');tripCoverageCache.set(key,{at:Date.now(),value:coverage});if(tripCoverageCache.size>30)tripCoverageCache.delete(tripCoverageCache.keys().next().value)}
  catch(_){tripMessage('تعذر التحقق من منطقة الخدمة بسبب الاتصال. تحقق من الإنترنت ثم أعد المحاولة.');return null}
 }
 if(coverage.enforced&&!coverage.allowed){
  tripMessage('عذراً، خدمات مشواري غير متوفرة في '+(coverage.countryName||coverage.regionName||'منطقتك')+' حالياً. يمكنك مشاهدة الخريطة، لكن لا يمكن طلب رحلة من هذه المنطقة.');
 }else if(coverage.enforced&&coverage.allowed){
  tripMessage('خدمات مشواري متاحة في '+(coverage.regionName||coverage.countryName||'منطقتك')+'.');
 }
 return coverage;
}

function locateTripPickup(){
 const requestId=++tripLocationRequest;
 tripMessage('جارٍ تحديد موقع الانطلاق من GPS...');
 if(!navigator.geolocation){tripMessage('الجهاز لا يدعم تحديد الموقع.');return}
 navigator.geolocation.getCurrentPosition(async p=>{
  if(requestId!==tripLocationRequest)return;
  const latitude=Number(p.coords.latitude),longitude=Number(p.coords.longitude);
  if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180){
   tripMessage('وصلت إحداثيات GPS غير صالحة. أعد محاولة تحديد الموقع.');return;
  }
  const accuracy=Number(p.coords.accuracy);
  tripPickup={lat:latitude,lng:longitude,label:'موقعي الحالي',accuracy:Number.isFinite(accuracy)&&accuracy>0?accuracy:null};
  const pickupInput=document.getElementById('pickupLabel');if(pickupInput)pickupInput.value='موقعي الحالي';
  const zoom=!Number.isFinite(accuracy)||accuracy<=0?15:accuracy<=50?16:accuracy<=150?15:14;
  tripMap.setView([tripPickup.lat,tripPickup.lng],zoom);drawTripMarkers();
  tripMessage(Number.isFinite(accuracy)&&accuracy>100
   ?'تم تحديد موقعك بدقة تقريبية '+Math.round(accuracy)+' متر. تحرك إلى مكان مفتوح لتحسين الدقة إذا لزم.'
   :'تم تحديد موقع الانطلاق تلقائياً'+(Number.isFinite(accuracy)&&accuracy>0?' بدقة تقريبية '+Math.round(accuracy)+' متر.':'.'));
  checkTripCoverage(tripPickup,'pickup');
  const cacheKey=lang+':'+tripPickup.lat.toFixed(4)+','+tripPickup.lng.toFixed(4),cached=tripReverseCache.get(cacheKey);
  if(cached&&cached.expiresAt>Date.now()){if(pickupInput)pickupInput.value=cached.label;return}

  const controller=new AbortController();tripReverseAbort=controller;
  try{
   const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language='+encodeURIComponent(lang==='en'?'en':'ar')+'&lat='+tripPickup.lat+'&lon='+tripPickup.lng;
   const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error();
   const d=await r.json(),label=d.display_name?d.display_name.split(',').slice(0,3).join('، '):'';

    tripReverseCache.set(cacheKey,{label,expiresAt:Date.now()+10*60*1000});
    if(tripReverseCache.size>40)tripReverseCache.delete(tripReverseCache.keys().next().value);
    if(pickupInput)pickupInput.value=label;
   }
  }catch(error){if(error.name!=='AbortError')console.warn('Reverse geocoding unavailable:',error.message)}
  finally{if(tripReverseAbort===controller)tripReverseAbort=null}
 },e=>{if(requestId!==tripLocationRequest)return;const input=document.getElementById('pickupLabel');if(input)input.value='تعذر تحديد الموقع';const messages={1:'تم رفض إذن الموقع. اسمح للتطبيق بالوصول إلى الموقع من نافذة أندرويد ثم اضغط زر تحديد موقعي مرة أخرى.',2:'تعذر قراءة موقع الجهاز. فعّل الموقع GPS وتأكد من اتصال الإنترنت ثم أعد المحاولة.',3:'انتهت مهلة تحديد الموقع. انتقل إلى مكان مفتوح ثم اضغط زر تحديد موقعي مرة أخرى.'};tripMessage(messages[e.code]||'تعذر تحديد الموقع. تحقق من إعدادات الموقع ثم أعد المحاولة.')},{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}

let mwNotificationTimer=null;
let mwNotificationBusy=false;
let mwPushListenersRegistered=false;
let mwPushToken=null;
const mwSeenNotifications=new Set();
async function refreshMeshwariNotifications(){
 if(!token||!account||mwNotificationBusy)return;
 mwNotificationBusy=true;
 try{
  const d=await api('/notifications',undefined,'GET');
  for(const n of (d.notifications||[]).reverse()){
   const id=String(n.id);
   if(mwSeenNotifications.has(id))continue;
   mwSeenNotifications.add(id);
   if(n.read_at)continue;
   if(document.visibilityState==='visible'&&document.getElementById('tripInteraction')){
    const host=document.getElementById('tripInteraction');
    const banner=document.createElement('div');
    banner.className='notice mt-2';
    banner.textContent=n.title+' — '+n.body;
    host.prepend(banner);
   }
  }
 }catch(e){console.warn('Notification inbox refresh failed:',e.message)}
 finally{mwNotificationBusy=false}
}
async function registerMeshwariPush(){
 const push=window.MeshwariPushNotifications;
 if(!push||!token||!account)return;
 try{
  if(!mwPushListenersRegistered){
  await push.addListener('registration',async event=>{
   mwPushToken=event.value;
   try{await api('/notifications/devices',{token:event.value,platform:'android'},'POST')}catch(e){console.warn('Push token registration failed:',e.message)}
  });
  await push.addListener('registrationError',error=>console.warn('Push registration error:',error));
  await push.addListener('pushNotificationReceived',notification=>{
   const host=document.getElementById('tripInteraction');
   if(host){const banner=document.createElement('div');banner.className='notice mt-2';banner.textContent=(notification.title||'مشواري')+' — '+(notification.body||'');host.prepend(banner)}
   refreshMeshwariNotifications();
  });
  await push.addListener('pushNotificationActionPerformed',event=>{
   const data=event.notification?.data||{};
   if(data.screen==='trips')tripInteractionRefresh(true);
  });
   mwPushListenersRegistered=true;
  }
  await push.createChannel({id:'meshwari_updates',name:'تنبيهات مشواري',description:'طلبات الرحلات وتحديثات الحساب',importance:5,sound:'default',vibration:true});
  let permission=await push.checkPermissions();
  if(permission.receive!=='granted')permission=await push.requestPermissions();
  if(permission.receive==='granted')await push.register();
 }catch(e){console.warn('Native push setup unavailable:',e.message||e)}
}
let mwForegroundRefreshBound=false;
function startMeshwariNotifications(){
 registerMeshwariPush();
 refreshMeshwariNotifications();
 if(mwNotificationTimer)clearInterval(mwNotificationTimer);
 mwNotificationTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshMeshwariNotifications()},30000);
 if(!mwForegroundRefreshBound){document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&token&&account)refreshMeshwariNotifications()});mwForegroundRefreshBound=true}

async function tripInteractionRefresh(forceRender=false){
 if(!token||!account||tripInteractionBusy)return;
 tripInteractionBusy=true;
 try{
  const path=account.role==='passenger'?'/passenger/trips':'/driver/trips';
  const data=await api(path,undefined,'GET');
  const trips=account.role==='passenger'?(data.trip?[data.trip]:[]):(data.trips||[]);
  tripInteractionLastTrips=trips;
  const activeTripIds=new Set(trips.map(trip=>String(trip.id)));
  for(const id of [...tripCallPeers.keys()])if(!activeTripIds.has(id)){await closeTripAudioPeer(id);tripCallSnapshots.delete(id)}
  await Promise.all(trips.filter(tripChatAllowed).map(async trip=>{
   try{
    const data=await api('/trips/'+encodeURIComponent(trip.id)+'/messages',undefined,'GET');
    tripInteractionMessages.set(String(trip.id),data.messages||[]);
   }catch(error){console.warn('Trip chat refresh failed:',error.message)}
  }));
  const host=document.getElementById('tripInteraction');
  const typing=host&&host.contains(document.activeElement)&&document.activeElement.matches('[data-trip-chat-input]');
  if(forceRender||!typing)renderTripInteraction(trips);
 }catch(error){
  const host=document.getElementById('tripInteraction');
  if(host&&!tripInteractionLastTrips.length)host.innerHTML='<p class="trip-interaction-muted">'+escapeHtml(error.message||t('error'))+'</p>';
 }finally{tripInteractionBusy=false}
}

async function tripCallSendIce(tripId,callId,candidate){
 await api('/trips/'+encodeURIComponent(tripId)+'/calls/'+encodeURIComponent(callId)+'/ice',{candidate: candidate.toJSON?candidate.toJSON():candidate},'POST');
}
async function createTripAudioPeer(tripId,callId,iceServers){
 const pc=new RTCPeerConnection({iceServers});
 const state={tripId:String(tripId),callId:String(callId),pc,remoteSet:false,iceCursor:0,pendingIce:[],sentIce:[],audioStream:null,role:'',remoteAudio:null,remoteStream:null,syncBusy:false,lastHeartbeatAt:0};
 tripCallPeers.set(String(tripId),state);
 pc.onicecandidate=event=>{
  if(!event.candidate)return;
  if(state.callId==='pending'){state.sentIce.push(event.candidate);return}
  tripCallSendIce(tripId,state.callId,event.candidate).catch(error=>console.warn('Audio call ICE send failed:',error.message));
 };
 pc.ontrack=event=>{
  const audio=document.getElementById('tripRemoteAudio-'+tripId);
  state.remoteStream=event.streams[0];
  if(audio){audio.srcObject=state.remoteStream;audio.play().catch(()=>{})}
 };
 pc.onconnectionstatechange=()=>{
  const status=document.querySelector('[data-call-status="'+tripId+'"]');
  if(status)status.textContent=pc.connectionState==='connected'?(lang==='en'?'Voice call connected':'المكالمة الصوتية متصلة'):(lang==='en'?'Connecting audio...':'جارٍ توصيل الصوت...');
  if(['failed','closed'].includes(pc.connectionState)&&state.callId!=='pending')endTripAudioCall(state.callId,tripId,true);
 };
 return state;
}
async function tripCallAddMicrophone(state){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error(lang==='en'?'Microphone access is unavailable in this app.':'الوصول إلى الميكروفون غير متاح في هذا التطبيق.');
 const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
 state.audioStream=stream;
 stream.getAudioTracks().forEach(track=>state.pc.addTrack(track,stream));
}
async function startTripAudioCall(tripId){
 const key=String(tripId);
 if(tripCallPeers.has(key)||tripCallStarting.has(key))return;
 tripCallStarting.add(key);
 try{
  const config=await api('/trips/'+encodeURIComponent(tripId)+'/calls/config',undefined,'GET');
  const state=await createTripAudioPeer(tripId,'pending',config.iceServers||[]);
  state.role='caller';
  await tripCallAddMicrophone(state);
  const offer=await state.pc.createOffer({offerToReceiveAudio:true});
  await state.pc.setLocalDescription(offer);
  const created=await api('/trips/'+encodeURIComponent(tripId)+'/calls',{offer:{type:state.pc.localDescription.type,sdp:state.pc.localDescription.sdp}},'POST');
  state.callId=String(created.call.id);
  const candidates=state.sentIce.splice(0);
  for(const candidate of candidates)await tripCallSendIce(tripId,state.callId,candidate);
  tripCallSnapshots.set(String(tripId),created.call);
  await tripInteractionRefresh(true);
 }catch(error){
  const peer=tripCallPeers.get(String(tripId));
  if(peer&&peer.callId!=='pending')try{await api('/trips/'+encodeURIComponent(tripId)+'/calls/'+encodeURIComponent(peer.callId)+'/end',{},'PATCH')}catch{}
  await closeTripAudioPeer(tripId);
  alert(error.message|| (lang==='en'?'Could not start the voice call':'تعذر بدء المكالمة الصوتية'));
 }finally{tripCallStarting.delete(key)}
}
async function answerTripAudioCall(callId,tripId){
 const key=String(tripId);
 if(tripCallPeers.has(key)||tripCallStarting.has(key))return;
 tripCallStarting.add(key);
 try{
  const config=await api('/trips/'+encodeURIComponent(tripId)+'/calls/config',undefined,'GET');
  const state=await createTripAudioPeer(tripId,callId,config.iceServers||[]);
  state.role='callee';
  await tripCallAddMicrophone(state);
  const snapshot=tripCallSnapshots.get(String(tripId))||await api('/trips/'+encodeURIComponent(tripId)+'/calls/active',undefined,'GET').then(x=>x.call);
  if(!snapshot||String(snapshot.id)!==String(callId))throw Error(lang==='en'?'This call has ended.':'انتهى هذا الاتصال.');
  await state.pc.setRemoteDescription({type:'offer',sdp:snapshot.offer_sdp});
  state.remoteSet=true;
  const answer=await state.pc.createAnswer();
  await state.pc.setLocalDescription(answer);
  const result=await api('/trips/'+encodeURIComponent(tripId)+'/calls/'+encodeURIComponent(callId)+'/answer',{answer:{type:state.pc.localDescription.type,sdp:state.pc.localDescription.sdp}},'PATCH');
  tripCallSnapshots.set(String(tripId),{...snapshot,...result.call});
  await tripInteractionRefresh(true);
 }catch(error){
  const peer=tripCallPeers.get(String(tripId));
  if(peer&&peer.callId!=='pending')try{await api('/trips/'+encodeURIComponent(tripId)+'/calls/'+encodeURIComponent(peer.callId)+'/end',{},'PATCH')}catch{}
  await closeTripAudioPeer(tripId);
  alert(error.message|| (lang==='en'?'Could not answer the call':'تعذر الرد على المكالمة'));
 }finally{tripCallStarting.delete(key)}
}
async function syncTripCalls(trips){
 for(const trip of trips.filter(trip=>['accepted','arrived','in_progress'].includes(trip.status))){
  try{
   const data=await api('/trips/'+encodeURIComponent(trip.id)+'/calls/active',undefined,'GET');
   const call=data.call;
   const key=String(trip.id),state=tripCallPeers.get(key);
   if(state&&state.callId==='pending')continue;
   if(state&&state.syncBusy)continue;
   if(state)state.syncBusy=true;
   if(call)tripCallSnapshots.set(key,call);
   else{if(state)await closeTripAudioPeer(trip.id);tripCallSnapshots.delete(key);continue}
   if(state&&call&&String(call.id)===String(state.callId)){
    if(call.status==='accepted'&&Date.now()-state.lastHeartbeatAt>30000){
     await api('/trips/'+encodeURIComponent(trip.id)+'/calls/'+encodeURIComponent(call.id)+'/heartbeat',{},'PATCH');
     state.lastHeartbeatAt=Date.now();
    }
    if(state.role==='caller'&&call.answer_sdp&&!state.remoteSet){
     await state.pc.setRemoteDescription({type:'answer',sdp:call.answer_sdp});state.remoteSet=true;
    }
    if(state.remoteSet)await tripCallPollIce(state);
   }
  }catch(error){console.warn('Audio call sync failed:',error.message)}
  finally{const current=tripCallPeers.get(String(trip.id));if(current)current.syncBusy=false}
 }
}
async function tripCallPollIce(state){
 const data=await api('/trips/'+encodeURIComponent(state.tripId)+'/calls/'+encodeURIComponent(state.callId)+'/ice?after='+state.iceCursor,undefined,'GET');
 for(const item of data.candidates||[]){
  state.iceCursor=Math.max(state.iceCursor,Number(item.id)||0);
  try{await state.pc.addIceCandidate(item.candidate)}catch(error){console.warn('Remote ICE candidate failed:',error.message)}
 }
}
async function closeTripAudioPeer(tripId){
 const state=tripCallPeers.get(String(tripId));if(!state)return;
 try{state.audioStream?.getTracks().forEach(track=>track.stop());state.pc.ontrack=null;state.pc.onicecandidate=null;state.pc.close()}catch{}
 const audio=document.getElementById('tripRemoteAudio-'+tripId);if(audio)audio.srcObject=null;
 tripCallPeers.delete(String(tripId));
}
async function endTripAudioCall(callId,tripId,quiet=false){
 try{await api('/trips/'+encodeURIComponent(tripId)+'/calls/'+encodeURIComponent(callId)+'/end',{},'PATCH')}catch(error){if(!quiet)alert(error.message)}
 await closeTripAudioPeer(tripId);
 tripCallSnapshots.delete(String(tripId));
 if(!quiet)await tripInteractionRefresh(true);
}

function startTripInteraction(){
 if(tripInteractionTimer)clearInterval(tripInteractionTimer);
 const host=document.getElementById('tripInteraction');if(!host)return;
 host.onclick=event=>{
  const cashPaid=event.target.closest('[data-trip-cash-paid]');
  if(cashPaid){
   if(confirm(lang==='en'?'Confirm that you received the cash fare?':'هل تؤكد أنك استلمت أجرة الرحلة نقداً؟'))tripCashPaymentConfirm(cashPaid.dataset.tripCashPaid,cashPaid);
   return;
  }
  const action=event.target.closest('[data-trip-action]');
  if(action){const status=action.dataset.tripAction;if(status==='cancel'&&!confirm(lang==='en'?'Cancel this trip?':'هل تريد إلغاء هذه الرحلة؟'))return;tripInteractionUpdate(action.dataset.tripId,status,action);return}
  const send=event.target.closest('[data-trip-send]');if(send)tripInteractionSend(send.dataset.tripSend);
  const callStart=event.target.closest('[data-call-start]');if(callStart)startTripAudioCall(callStart.dataset.callStart);
  const callAnswer=event.target.closest('[data-call-answer]');if(callAnswer)answerTripAudioCall(callAnswer.dataset.callId,callAnswer.dataset.callAnswer);
  const callEnd=event.target.closest('[data-call-end]');if(callEnd)endTripAudioCall(callEnd.dataset.callId,callEnd.dataset.callEnd);
 };
 const input=host.querySelector('[data-trip-chat-input]');
 host.onkeydown=event=>{if(event.key==='Enter'&&event.target.matches('[data-trip-chat-input]')){event.preventDefault();tripInteractionSend(event.target.dataset.tripChatInput)}};
 tripInteractionRefresh(true).then(()=>syncTripCalls(tripInteractionLastTrips));
 tripInteractionTimer=setInterval(()=>tripInteractionRefresh(false),5000);
 if(tripCallTimer)clearInterval(tripCallTimer);
 tripCallTimer=setInterval(()=>syncTripCalls(tripInteractionLastTrips),5000);
}
function stopTripInteraction(){
 if(tripInteractionTimer){clearInterval(tripInteractionTimer);tripInteractionTimer=null}
 if(tripCallTimer){clearInterval(tripCallTimer);tripCallTimer=null}
 for(const id of [...tripCallPeers.keys()]){const peer=tripCallPeers.get(id);if(peer&&peer.callId!=='pending')api('/trips/'+encodeURIComponent(id)+'/calls/'+encodeURIComponent(peer.callId)+'/end',{},'PATCH').catch(()=>{});closeTripAudioPeer(id)}
 tripCallSnapshots.clear();
 tripInteractionBusy=false;tripInteractionMessages.clear();tripInteractionLastTrips=[];
}

function accountLockKey(){return account?`mw_account_lock_${account.role}_${account.id}`:''}
function getLocalLockConfig(){try{const raw=accountLockKey()&&localStorage.getItem(accountLockKey());return raw?JSON.parse(raw):null}catch{return null}}
async function lockDigest(value,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(value)),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16))),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAccountLockFields(){const method=document.getElementById('accountLockMethod').value,box=document.getElementById('accountLockFields');if(method==='pattern'){box.innerHTML=`<p class=\"small muted mt-2\">${t('lockSecret')}</p><div id=\"accountPatternGrid\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear\" class=\"tab w-full mt-1\">${t('cancel')}</button><p class=\"small muted mt-2\">${t('lockSecretAgain')}</p><div id=\"accountPatternGrid2\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText2\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear2\" class=\"tab w-full mt-1\">${t('cancel')}</button>`;window.accountPatternA=wireAccountPattern('accountPatternGrid','accountPatternText','accountPatternClear');window.accountPatternB=wireAccountPattern('accountPatternGrid2','accountPatternText2','accountPatternClear2')}else{box.innerHTML=`<label>${t('lockSecret')}<input id=\"accountLockSecret\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label><label>${t('lockSecretAgain')}<input id=\"accountLockSecretAgain\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label>`}}
function wireAccountPattern(gridId,textId,clearId){const grid=document.getElementById(gridId),label=document.getElementById(textId);let points=[];const add=e=>{const b=e.target.closest('[data-dot]');if(!b||!grid.contains(b))return;const n=b.dataset.dot;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('primary');label.textContent=points.join(' · ')}};grid.addEventListener('click',add);document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''};return()=>points.join('')}
async function saveAccountLock(){const method=document.getElementById('accountLockMethod').value,msg=document.getElementById('accountLockMessage');msg.classList.remove('hidden');try{if(method==='off'){localStorage.removeItem(accountLockKey());accountUnlocked=true;msg.textContent=t('lockSaved');return}let a,b;if(method==='pattern'){a=window.accountPatternA?.()||'';b=window.accountPatternB?.()||''}else{a=document.getElementById('accountLockSecret').value;b=document.getElementById('accountLockSecretAgain').value}if(a.length<4||a!==b||(method==='pattern'&&(!/^[1-9]{4,9}$/.test(a)||new Set(a).size<4))){msg.textContent=t('lockNeed');return}const salt=lockSalt();localStorage.setItem(accountLockKey(),JSON.stringify({method,salt,hash:await lockDigest(a,salt)}));accountUnlocked=true;msg.textContent=t('lockSaved')}catch(e){msg.textContent=t('error')}}
function showAccountUnlock(cfg){app.innerHTML=`<section class=\"card text-center\"><h2 class=\"font-bold text-xl\">${t('lockScreenTitle')}</h2><p class=\"muted text-sm my-3\">${t('lockScreenHelp')}</p>${cfg.method==='pattern'?`<div id=\"accountUnlockGrid\" class=\"grid grid-cols-3 gap-3 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:64px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountUnlockPatternText\" class=\"small muted mt-2\"></p><button id=\"accountUnlockClear\" class=\"tab w-full mt-2\">${t('cancel')}</button>`:`<input id=\"accountUnlockSecret\" type=\"password\" autocomplete=\"off\" placeholder=\"${t('lockSecret')}\">`}<button id=\"accountUnlockButton\" class=\"primary w-full mt-3\">${t('lockOpen')}</button><p id=\"accountUnlockError\" class=\"notice hidden\"></p><button class=\"tab w-full mt-3\" onclick=\"logout()\">${t('logout')}</button></section>`;let value='';if(cfg.method==='pattern'){const grid=document.getElementById('accountUnlockGrid'),label=document.getElementById('accountUnlockPatternText');grid.addEventListener('click',e=>{const b=e.target.closest('[data-dot]');if(b&&!value.includes(b.dataset.dot)&&value.length<9){value+=b.dataset.dot;b.classList.add('primary');label.textContent=value.split('').join(' · ')}});document.getElementById('accountUnlockClear').onclick=()=>{value='';grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''}}document.getElementById('accountUnlockButton').onclick=async()=>{const candidate=cfg.method==='pattern'?value:document.getElementById('accountUnlockSecret').value;const err=document.getElementById('accountUnlockError');if(cfg.method==='pattern'&&(!/^[1-9]{4,9}$/.test(candidate)||new Set(candidate).size<4)){err.textContent=t('lockWrong');err.classList.remove('hidden');return}if(await lockDigest(candidate,cfg.salt)===cfg.hash){accountUnlocked=true;renderHome()}else{err.textContent=t('lockWrong');err.classList.remove('hidden');value='';if(cfg.method==='pattern')document.getElementById('accountUnlockClear').click();else document.getElementById('accountUnlockSecret').value=''}};document.getElementById('accountUnlockSecret')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('accountUnlockButton').click()})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function logout(){stopTripInteraction();if(mwNotificationTimer){clearInterval(mwNotificationTimer);mwNotificationTimer=null}mwSeenNotifications.clear();if(mwPushToken){try{await api('/notifications/devices',{token:mwPushToken},'DELETE')}catch(e){console.warn('Push token removal failed:',e.message)}mwPushToken=null}try{await api('/auth/logout',{},'POST')}catch(e){console.warn('Server logout failed:',e.message)}try{await window.MeshwariPushNotifications?.unregister()}catch{}token='';account=null;chosenRole='';accountUnlocked=false;localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(!confirm(t('factoryConfirm')))return;try{stopTripInteraction();if(mwNotificationTimer){clearInterval(mwNotificationTimer);mwNotificationTimer=null}mwSeenNotifications.clear();if(mwPushToken){try{await api('/notifications/devices',{token:mwPushToken},'DELETE')}catch(e){console.warn('Push token removal during factory reset failed:',e.message)}mwPushToken=null}try{await window.MeshwariPushNotifications?.unregister()}catch{}if(accountLockKey())localStorage.removeItem(accountLockKey());token='';account=null;chosenRole='';accountUnlocked=false;for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}

// Delegated ripple: covers every current and future button in passenger/driver UI.
document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

if(token)home();else start();
</script>
<script>if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(error=>console.warn('PWA registration failed',error)))}</script>
