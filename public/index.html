 من هذا الجهاز. يمكنك تسجيل الدخول مجدداً.',cancel:'إلغاء',status:'الحالة',current:'السيارة الحالية',approved:'معتمدة',pendingStatus:'بانتظار الاعتماد',rejected:'مرفوضة',replaced:'سابقة / مستبدلة',date:'تاريخ الطلب',noHistory:'لا يوجد سجل مركبات بعد',loginFirst:'سجل الدخول أولاً',colorNote:'أدخل اللون كما يظهر في صورة السيارة ووثائقها.',vehicleUrl:'رابط صورة السيارة (اختياري)',vehicleRejected:'سبب الرفض',closed:'الحساب مغلق أو موقوف',idFront:'صورة البطاقة الشخصية - الوجه الأمامي',idBack:'صورة البطاقة الشخصية - الوجه الخلفي',vehicleDocs:'صور وثائق السيارة (يمكن إرفاق حتى 3 صور)',driverSelfie:'صورة سيلفي واضحة للسائق',vehiclePhoto:'صورة السيارة نفسها',cameraHint:'يمكنك التقاط صورة بالكاميرا أو اختيار صورة محفوظة في الجوال',camera:'فتح الكاميرا',gallery:'تحميل ملف من المعرض',selectedFiles:'تم اختيار الملفات',documentsRequired:'أكمل جميع الصور المطلوبة قبل إرسال الطلب',uploading:'جارٍ تجهيز الصور وإرسال الطلب...'} ,en:{subtitle:'Smart transport application',welcome:'Welcome to Meshwari',choose:'Choose account type',passenger:'Passenger',driver:'Driver',name:'Full name',nid:'National ID',phone:'Phone number',register:'Submit registration',login:'I have an account - Sign in',code:'6-digit access code',request:'Request code from admin',verify:'Verify and sign in',pending:'Your application is under review.',destination:'Destination',trip:'Request taxi',fare:'Estimated fare',duty:'Trip availability',logout:'Sign out',carType:'Car type',model:'Model',color:'Color',plate:'Plate number',reg:'Registration number',wait:'Waiting for admin approval',error:'Something went wrong. Try again.',back:'Back',wallet:'Wallet',rial:'YER',onDuty:'Go available',offDuty:'Stop receiving trips',changeVehicle:'Request vehicle change',vehicleHelp:'The new vehicle cannot be used for trips until approved by administration. Your previous vehicle remains in your vehicle history.',sendVehicle:'Submit vehicle change',vehicleSent:'Vehicle change request submitted. Wait for admin approval.',pendingVehicle:'You already have a vehicle request under review',vehicleHistory:'Vehicle history',factory:'Factory reset',settings:'Settings',lockSettings:'Optional app lock',lockOff:'No extra lock',lockPattern:'Drawn pattern',lockPassword:'Local password',lockSave:'Save lock method',lockSecret:'Lock code',lockSecretAgain:'Confirm lock code',lockScreenTitle:'Unlock your account',lockScreenHelp:'Enter your selected lock method to continue.',lockOpen:'Unlock account',lockSaved:'Lock setting saved on this device.',lockWrong:'Incorrect lock code.',lockNeed:'Enter and confirm a valid code.',lockNote:'This is an additional local lock on this device and does not change OTP sign-in.',lockClear:'Disable extra lock',passengerSettings:'Passenger settings',driverSettings:'Driver settings',factoryWarn:'This signs you out and clears local app data on this device only. Your account, trips and server data will not be deleted.',factoryConfirm:'Reset this device? Your server account will not be deleted.',resetDone:'Local app data cleared. You can sign in again.',cancel:'Cancel',status:'Status',current:'Current vehicle',approved:'Approved',pendingStatus:'Pending approval',rejected:'Rejected',replaced:'Previous / replaced',date:'Request date',noHistory:'No vehicle history yet',loginFirst:'Please sign in first',colorNote:'Enter the vehicle color as shown in its photo and documents.',vehicleUrl:'Vehicle photo URL (optional)',vehicleRejected:'Rejection reason',closed:'Account is closed or suspended',idFront:'National ID - front side',idBack:'National ID - back side',vehicleDocs:'Vehicle documents (up to 3 images)',driverSelfie:'Clear driver selfie',vehiclePhoto:'Photo of the vehicle itself',cameraHint:'Take a photo with the camera or choose an image saved on your phone',camera:'Open camera',gallery:'Choose from gallery',selectedFiles:'Selected files',documentsRequired:'Complete all required images before submitting',uploading:'Preparing images and submitting...'}};
const t=k=>dict[lang][k]||k;function setDir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
document.getElementById('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_theme',theme)};
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('mw_lang',lang);setDir();if(account)home();else start()};setDir();
async function api(path,body,method='POST'){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}
function start(){app.innerHTML=`<section class="card text-center"><h2 class="font-bold text-xl mb-3">${t('welcome')}</h2><p class="muted text-sm mb-4">${t('choose')}</p><div class="grid2"><button class="primary" onclick="chooseRole('passenger')">${t('passenger')}</button><button class="gold" onclick="chooseRole('driver')">${t('driver')}</button></div></section>`}
function chooseRole(r){chosenRole=r;formScreen(false)}
function countryPhone(){return `<div class="grid2"><select id="country"><option value="+967">🇾🇪 Yemen +967</option><option value="+966">🇸🇦 Saudi Arabia +966</option><option value="+971">🇦🇪 UAE +971</option><option value="+968">🇴🇲 Oman +968</option><option value="+20">🇪🇬 Egypt +20</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option></select><input id="phone" placeholder="${t('phone')}" inputmode="tel" required></div>`}
function documentInput(id,label,multiple=false,capture='environment'){
 return `<label class="mt-3">${label}<input id="${id}Camera" type="file" accept="image/*" capture="${capture}" onchange="showPickedFiles('${id}')"><input id="${id}Gallery" type="file" accept="image/*" ${multiple?'multiple':''} onchange="showPickedFiles('${id}')"><div class="upload-actions"><button type="button" class="primary" onclick="document.getElementById('${id}Camera').click()">📷 ${t('camera')}</button><button type="button" class="gold" onclick="document.getElementById('${id}Gallery').click()">🖼️ ${t('gallery')}</button></div><small id="${id}Selected" class="muted small upload-name">${t('cameraHint')}</small></label>`;
}
function showPickedFiles(id){const a=Array.from(document.getElementById(id+'Camera')?.files||[]),b=Array.from(document.getElementById(id+'Gallery')?.files||[]),files=[...a,...b];const el=document.getElementById(id+'Selected');if(el)el.textContent=files.length?`${t('selectedFiles')}: ${files.map(f=>f.name).join('، ')}`:t('cameraHint');}

function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();reader.onerror=()=>reject(Error(t('error')));reader.onload=()=>{
  const img=new Image();img.onerror=()=>reject(Error(t('error')));img.onload=()=>{
   const scale=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let dataUrl=canvas.toDataURL('image/jpeg',0.78);
   if(dataUrl.length>2.55*1024*1024)dataUrl=canvas.toDataURL('image/jpeg',0.62);
   if(dataUrl.length>2.55*1024*1024)return reject(Error('حجم الصورة كبير. التقط صورة أوضح بحجم أصغر.'));
   resolve({dataUrl,fileName:(file.name||'image').replace(/[^\w.\-ء-ي]/g,'_').slice(0,120)+'.jpg'});
  };img.src=reader.result;
 };reader.readAsDataURL(file);
});}
async function collectRegistrationDocuments(){
 const docs=[];
 async function add(id,type,multiple=false){const camera=Array.from(document.getElementById(id+'Camera')?.files||[]),gallery=Array.from(document.getElementById(id+'Gallery')?.files||[]),files=[...camera,...gallery];if(!files.length)throw Error(t('documentsRequired'));if(!multiple&&files.length!==1)throw Error(t('documentsRequired'));if(multiple&&files.length>3)throw Error('يمكن إرفاق 3 صور لوثائق السيارة كحد أقصى');for(const file of files){const image=await imageFileToDataUrl(file);docs.push({type,dataUrl:image.dataUrl,fileName:image.fileName});}}
 await add('idFront','national_id_front');await add('idBack','national_id_back');
 if(chosenRole==='driver'){await add('vehicleDocuments','vehicle_documents',true);await add('driverSelfie','driver_selfie');await add('vehiclePhoto','vehicle_photo');}
 if(docs.reduce((sum,item)=>sum+item.dataUrl.length,0)>16*1024*1024)throw Error('إجمالي حجم الصور كبير. اختر صوراً أصغر.');
 return docs;
}
function formScreen(login){app.innerHTML=`<section class="card"><h2 class="font-bold text-lg">${login?t('login'):t('register')} - ${t(chosenRole)}</h2><form id="regForm">${login?`<label>${t('nid')}<input id="nid" required inputmode="numeric"></label>`:`<label>${t('name')}<input id="name" required></label><label>${t('nid')}<input id="nid" required inputmode="numeric"></label><label>${t('phone')}${countryPhone()}</label><hr class="my-3"><h3 class="font-bold">${t('idFront')}</h3>${documentInput('idFront',t('idFront'))}${documentInput('idBack',t('idBack'))}${chosenRole==='driver'?`<hr class="my-3"><h3 class="font-bold">${t('vehicleDocs')}</h3>${documentInput('vehicleDocuments',t('vehicleDocs'),true)}${documentInput('driverSelfie',t('driverSelfie'),false,'user')}${documentInput('vehiclePhoto',t('vehiclePhoto'))}<hr class="my-3"><h3 class="font-bold">${t('carType')}</h3><label>${t('carType')}<input id="carType" required></label><label>${t('model')}<input id="carModel" required></label><label>${t('color')}<input id="carColor" required></label><label>${t('plate')}<input id="plateNumber" required></label><label>${t('reg')}<input id="registrationNumber" required></label>`:''}` }<button id="regSubmit" class="primary w-full mt-4">${login?t('request'):t('register')}</button></form><button class="w-full mt-2 gold" onclick="formScreen(${!login})">${login?t('back'):t('login')}</button><p id="msg" class="notice hidden"></p></section>`;
 document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();const submit=document.getElementById('regSubmit');submit.disabled=true;try{const nid=document.getElementById('nid').value.trim();if(login){await api('/auth/request-code',{nationalId:nid});codeScreen(nid);return}const phone=document.getElementById('country').value+document.getElementById('phone').value.trim();const body={role:chosenRole,nationalId:nid,fullName:document.getElementById('name').value.trim(),phone};body.documents=await collectRegistrationDocuments();if(chosenRole==='driver')body.car={type:document.getElementById('carType').value,model:document.getElementById('carModel').value,color:document.getElementById('carColor').value,plateNumber:document.getElementById('plateNumber').value,registrationNumber:document.getElementById('registrationNumber').value};submit.textContent=t('uploading');await api('/register',body);message(t('pending'))}catch(err){message(err.message)}finally{if(document.getElementById('regSubmit')){submit.disabled=false;submit.textContent=login?t('request'):t('register')}}};}
function message(s){const m=document.getElementById('msg');if(m){m.textContent=s;m.classList.remove('hidden')}else alert(s)}
function codeScreen(nid){app.innerHTML=`<section class="card"><h2 class="font-bold">${t('verify')}</h2><p class="muted text-sm mt-2">${t('code')}</p><input id="otp" maxlength="6" inputmode="numeric" placeholder="000000"><button class="primary w-full mt-3" id="verify">${t('verify')}</button><p id="msg" class="notice hidden"></p></section>`;document.getElementById('verify').onclick=async()=>{try{const d=await api('/auth/verify-code',{nationalId:nid,code:document.getElementById('otp').value});token=d.token;localStorage.setItem('mw_token',token);account=d.account;home()}catch(e){message(e.message)}}}
async function home(){try{const d=await api('/me',undefined,'GET');account=d.account;chosenRole=account.role;const cfg=getLocalLockConfig();if(cfg&&!accountUnlocked){showAccountUnlock(cfg);return}renderHome()}catch(e){token='';localStorage.removeItem('mw_token');account=null;app.innerHTML=`<section class="card">${e.message}<button class="primary w-full mt-3" onclick="start()">${t('back')}</button></section>`}}
function renderHome(){const a=account;app.innerHTML=`<section class="card"><div class="flex justify-between"><b>${escapeHtml(a.full_name)}</b><span class="text-xs text-green-700">${t(a.role)}</span></div><p class="muted text-xs mt-1">${escapeHtml(a.phone||'')}</p></section>${a.role==='passenger'?`<section class="card mt-3"><label>${t('destination')}<input id="dest" placeholder="${t('destination')}"></label><button id="trip" class="gold w-full mt-3">${t('trip')}</button><p id="result" class="notice hidden"></p></section>`:`<section class="card mt-3"><p>${escapeHtml(a.car_type||'')} - ${escapeHtml(a.car_model||'')} - ${escapeHtml(a.car_color||'')}</p><p class="mt-2">${t('wallet')}: ${escapeHtml(a.wallet_balance||0)} ${t('rial')}</p><button id="duty" class="primary w-full mt-3">${a.is_off_duty?t('onDuty'):t('offDuty')}</button><div class="notice">${t('vehicleHelp')}</div><button id="vehicleToggle" class="gold w-full">${t('changeVehicle')}</button><div id="vehicleForm" class="hidden mt-3"><form id="vehicleChangeForm"><label>${t('carType')}<input id="newCarType" required></label><label>${t('model')}<input id="newCarModel" required></label><label>${t('color')}<input id="newCarColor" required></label><label>${t('plate')}<input id="newPlate" required></label><label>${t('reg')}<input id="newReg" required></label><label>${t('vehicleUrl')}<input id="newVehicleUrl" type="url" placeholder="https://..."></label><button class="primary w-full mt-3">${t('sendVehicle')}</button></form><p id="vehicleMsg" class="notice hidden"></p></div><button id="historyToggle" class="tab gold w-full mt-3">${t('vehicleHistory')}</button><div id="vehicleHistory" class="hidden mt-2"></div></section>`}<section class="card mt-3"><button id="settingsToggle" class="gold w-full">${a.role==='passenger'?t('passengerSettings'):t('driverSettings')}</button><div id="settingsPanel" class="hidden mt-3"><p class="font-bold mb-2">${t('settings')}</p><p class="font-bold mb-2">${t('lockSettings')}</p><p class="muted small mb-2">${t('lockNote')}</p><label>${t('lockSettings')}<select id="accountLockMethod"><option value="off">${t('lockOff')}</option><option value="pattern">${t('lockPattern')}</option><option value="password">${t('lockPassword')}</option></select></label><div id="accountLockFields" class="hidden"><label>${t('lockSecret')}<input id="accountLockSecret" type="password" minlength="4" autocomplete="new-password"></label><label>${t('lockSecretAgain')}<input id="accountLockSecretAgain" type="password" minlength="4" autocomplete="new-password"></label></div><button id="saveAccountLock" class="primary w-full mt-2">${t('lockSave')}</button><p id="accountLockMessage" class="notice hidden"></p><hr class="my-3"><p class="muted small mb-2">${t('factoryWarn')}</p><button id="factoryResetButton" onclick="factoryReset()" class="danger w-full">${t('factory')}</button></div><button onclick="logout()" class="tab w-full mt-2">${t('logout')}</button></section>`;
document.getElementById('settingsToggle').onclick=()=>document.getElementById('settingsPanel').classList.toggle('hidden');
const lockMethodEl=document.getElementById('accountLockMethod'),lockFields=document.getElementById('accountLockFields');const existingLock=getLocalLockConfig();if(existingLock)lockMethodEl.value=existingLock.method;lockFields.classList.toggle('hidden',lockMethodEl.value==='off');renderAccountLockFields();lockMethodEl.onchange=()=>{lockFields.classList.toggle('hidden',lockMethodEl.value==='off');renderAccountLockFields()};document.getElementById('saveAccountLock').onclick=saveAccountLock;
if(a.role==='passenger')document.getElementById('trip').onclick=async()=>{try{const d=await api('/trips',{destination:document.getElementById('dest').value});const p=document.getElementById('result');p.textContent=t('fare')+': '+d.trip.fare_amount+' '+t('rial');p.classList.remove('hidden')}catch(e){alert(e.message)}};
else{document.getElementById('duty').onclick=async()=>{try{await api('/driver/duty',{offDuty:!a.is_off_duty},'PUT');a.is_off_duty=!a.is_off_duty;renderHome()}catch(e){alert(e.message)}};document.getElementById('vehicleToggle').onclick=()=>document.getElementById('vehicleForm').classList.toggle('hidden');document.getElementById('vehicleChangeForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/driver/vehicles',{car:{type:document.getElementById('newCarType').value,model:document.getElementById('newCarModel').value,color:document.getElementById('newCarColor').value,plateNumber:document.getElementById('newPlate').value,registrationNumber:document.getElementById('newReg').value,vehicleImageUrl:document.getElementById('newVehicleUrl').value}},'POST');document.getElementById('vehicleMsg').textContent=d.message||t('vehicleSent');document.getElementById('vehicleMsg').classList.remove('hidden');e.target.reset()}catch(x){document.getElementById('vehicleMsg').textContent=x.message;document.getElementById('vehicleMsg').classList.remove('hidden')}};document.getElementById('historyToggle').onclick=async()=>{const el=document.getElementById('vehicleHistory');el.classList.toggle('hidden');if(!el.classList.contains('hidden')){try{const d=await api('/driver/vehicles',undefined,'GET');el.innerHTML=(d.vehicles||[]).map(v=>`<article class="border-b py-2 text-sm"><b>${escapeHtml(v.car_type)} ${escapeHtml(v.car_model)}</b><p>${escapeHtml(v.car_color)} · ${escapeHtml(v.plate_number)}</p><p class="muted small">${t('status')}: ${t(v.status==='approved'?'approved':v.status==='pending'?'pendingStatus':v.status==='rejected'?'rejected':'replaced')} · ${new Date(v.submitted_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${v.review_reason?`<p class="small">${t('vehicleRejected')}: ${escapeHtml(v.review_reason)}</p>`:''}</article>`).join('')||t('noHistory')}catch(e){el.textContent=e.message}}}}
}
function accountLockKey(){return account?`mw_account_lock_${account.role}_${account.id}`:''}
function getLocalLockConfig(){try{const raw=accountLockKey()&&localStorage.getItem(accountLockKey());return raw?JSON.parse(raw):null}catch{return null}}
async function lockDigest(value,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(value)),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16))),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAccountLockFields(){const method=document.getElementById('accountLockMethod').value,box=document.getElementById('accountLockFields');if(method==='pattern'){box.innerHTML=`<p class=\"small muted mt-2\">${t('lockSecret')}</p><div id=\"accountPatternGrid\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear\" class=\"tab w-full mt-1\">${t('cancel')}</button><p class=\"small muted mt-2\">${t('lockSecretAgain')}</p><div id=\"accountPatternGrid2\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText2\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear2\" class=\"tab w-full mt-1\">${t('cancel')}</button>`;window.accountPatternA=wireAccountPattern('accountPatternGrid','accountPatternText','accountPatternClear');window.accountPatternB=wireAccountPattern('accountPatternGrid2','accountPatternText2','accountPatternClear2')}else{box.innerHTML=`<label>${t('lockSecret')}<input id=\"accountLockSecret\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label><label>${t('lockSecretAgain')}<input id=\"accountLockSecretAgain\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label>`}}
function wireAccountPattern(gridId,textId,clearId){const grid=document.getElementById(gridId),label=document.getElementById(textId);let points=[];const add=e=>{const b=e.target.closest('[data-dot]');if(!b||!grid.contains(b))return;const n=b.dataset.dot;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('primary');label.textContent=points.join(' · ')}};grid.addEventListener('click',add);document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''};return()=>points.join('')}
async function saveAccountLock(){const method=document.getElementById('accountLockMethod').value,msg=document.getElementById('accountLockMessage');msg.classList.remove('hidden');try{if(method==='off'){localStorage.removeItem(accountLockKey());accountUnlocked=true;msg.textContent=t('lockSaved');return}let a,b;if(method==='pattern'){a=window.accountPatternA?.()||'';b=window.accountPatternB?.()||''}else{a=document.getElementById('accountLockSecret').value;b=document.getElementById('accountLockSecretAgain').value}if(a.length<4||a!==b||(method==='pattern'&&(!/^[1-9]{4,9}$/.test(a)||new Set(a).size<4))){msg.textContent=t('lockNeed');return}const salt=lockSalt();localStorage.setItem(accountLockKey(),JSON.stringify({method,salt,hash:await lockDigest(a,salt)}));accountUnlocked=true;msg.textContent=t('lockSaved')}catch(e){msg.textContent=t('error')}}
function showAccountUnlock(cfg){app.innerHTML=`<section class=\"card text-center\"><h2 class=\"font-bold text-xl\">${t('lockScreenTitle')}</h2><p class=\"muted text-sm my-3\">${t('lockScreenHelp')}</p>${cfg.method==='pattern'?`<div id=\"accountUnlockGrid\" class=\"grid grid-cols-3 gap-3 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:64px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountUnlockPatternText\" class=\"small muted mt-2\"></p><button id=\"accountUnlockClear\" class=\"tab w-full mt-2\">${t('cancel')}</button>`:`<input id=\"accountUnlockSecret\" type=\"password\" autocomplete=\"off\" placeholder=\"${t('lockSecret')}\">`}<button id=\"accountUnlockButton\" class=\"primary w-full mt-3\">${t('lockOpen')}</button><p id=\"accountUnlockError\" class=\"notice hidden\"></p><button class=\"tab w-full mt-3\" onclick=\"logout()\">${t('logout')}</button></section>`;let value='';if(cfg.method==='pattern'){const grid=document.getElementById('accountUnlockGrid'),label=document.getElementById('accountUnlockPatternText');grid.addEventListener('click',e=>{const b=e.target.closest('[data-dot]');if(b&&!value.includes(b.dataset.dot)&&value.length<9){value+=b.dataset.dot;b.classList.add('primary');label.textContent=value.split('').join(' · ')}});document.getElementById('accountUnlockClear').onclick=()=>{value='';grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''}}document.getElementById('accountUnlockButton').onclick=async()=>{const candidate=cfg.method==='pattern'?value:document.getElementById('accountUnlockSecret').value;const err=document.getElementById('accountUnlockError');if(cfg.method==='pattern'&&(!/^[1-9]{4,9}$/.test(candidate)||new Set(candidate).size<4)){err.textContent=t('lockWrong');err.classList.remove('hidden');return}if(await lockDigest(candidate,cfg.salt)===cfg.hash){accountUnlocked=true;renderHome()}else{err.textContent=t('lockWrong');err.classList.remove('hidden');value='';if(cfg.method==='pattern')document.getElementById('accountUnlockClear').click();else document.getElementById('accountUnlockSecret').value=''}};document.getElementById('accountUnlockSecret')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('accountUnlockButton').click()})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){token='';account=null;chosenRole='';accountUnlocked=false;localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(!confirm(t('factoryConfirm')))return;try{if(accountLockKey())localStorage.removeItem(accountLockKey());token='';account=null;chosenRole='';accountUnlocked=false;for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}

// Delegated ripple: covers every current and future button in passenger/driver UI.
document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

if(token)home();else start();
</script>
