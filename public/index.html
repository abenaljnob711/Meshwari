<style>

/* Global touch ripple for every button, including buttons rendered dynamically. */
button{position:relative;overflow:hidden;isolation:isolate;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:filter .12s ease,transform .12s ease}
button:active{filter:brightness(.88);transform:scale(.985)}
.ripple-wave{position:absolute;z-index:5;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.48);transform:translate(-50%,-50%) scale(0);animation:meshButtonRipple .58s ease-out forwards}
@keyframes meshButtonRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* Meshwari unified visual identity — based on the approved passenger registration reference */
:root{--bg:#020d1b;--card:#071b2c;--fg:#f4f8ff;--muted:#b6c9d7;--accent:#13c8ed;--green:#20d978}
[data-theme="dark"]{--bg:#020d1b;--card:#071b2c;--fg:#f4f8ff;--muted:#b6c9d7;--accent:#13c8ed;--green:#20d978}
[data-theme="light"]{--bg:#061629;--card:#0b2235;--fg:#f4f8ff;--muted:#c0d0dc;--accent:#16c8ee;--green:#20d978}
html,body{min-height:100%;background:#020d1b!important;color:#f4f8ff!important;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:560px;min-height:100dvh;background:radial-gradient(ellipse at 50% 28%,#0b2a3d 0%,#041629 55%,#020b18 100%);border-left:1px solid #00c7d866;border-right:1px solid #00c7d866;box-shadow:0 0 35px #00d5e51c}
.mesh-header{height:178px;position:relative;display:flex;align-items:flex-start;justify-content:flex-end;padding:18px 18px 0;background:linear-gradient(180deg,#020b18,#04182b);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#20e878,#13c8ed,#20e878) 1;overflow:hidden}
.mesh-brand-art{position:absolute;inset:0;background-image:url('/assets/mesh-header.jpg');background-repeat:no-repeat;background-position:left center;background-size:auto 100%;pointer-events:none}
.mesh-header-actions{position:relative;z-index:2;display:flex;gap:8px;margin-right:0}
.mesh-header-actions button{background:#071b2dcc!important;color:#f4fbff!important;border:1px solid #7894a866;border-radius:30px;min-width:44px;min-height:42px;padding:8px 13px;box-shadow:0 0 12px #00d5e51a}
main#app{padding:14px 14px 18px;flex:1}
.card{background:linear-gradient(145deg,#0b2638f2,#071a2bf5)!important;border:1px solid #00d5d477!important;border-radius:24px!important;padding:20px!important;box-shadow:inset 0 0 18px #00d5e511,0 0 16px #00d5e511!important;color:#f4f8ff!important}
.card>h2{background:linear-gradient(110deg,#09283c,#0b3147);border:1px solid #00cde866;border-radius:16px;padding:16px 12px;color:#f8fbff;font-size:20px!important;text-align:center;box-shadow:inset 0 0 14px #00cde822}
.card>h2::first-letter{color:#13c8ed}.role-icon{display:inline-block;margin-left:10px;font-size:25px;vertical-align:middle}.role-name{color:#13c8ed}
.card p,.card label,.card h3,.muted{color:#d7e6f0!important}
form label{position:relative;font-size:15px!important;color:#eaf5fb!important;margin-top:13px!important}
form label>input:not([type=file]),form label>select,form input:not([type=file]),form select{background:linear-gradient(120deg,#102c40,#0b2235)!important;border:2px solid #536f8099!important;border-radius:17px!important;color:#f6fbff!important;min-height:58px!important;padding:13px 18px!important;font-size:17px!important;box-shadow:inset 0 2px 10px #0003!important}
form input::placeholder{color:#b9cbd7!important;opacity:1}
.grid2:has(#country){direction:ltr;gap:10px}
#country{direction:ltr;text-align:left}
#phone{direction:rtl;text-align:right}
.upload-actions{direction:ltr;gap:12px;margin-top:12px}
.upload-actions button{min-height:54px!important;border-radius:15px!important;font-size:14px!important;background:linear-gradient(120deg,#092d47,#0b253b)!important;border:2px solid #08b9f1!important;color:#eaf9ff!important;box-shadow:0 0 10px #00bfff22}
.upload-actions button:nth-child(2){border-color:#20df80!important;color:#32e88c!important;background:linear-gradient(120deg,#082d2b,#0a2532)!important}
.upload-name{color:#c5d7e2!important;font-size:13px!important;line-height:1.7;margin-top:8px!important}
form hr{border-color:#16c9df66!important;margin:16px 0!important}
form h3{font-size:17px!important;font-weight:800!important;color:#f4fbff!important;margin-top:14px!important}
button.primary{background:linear-gradient(105deg,#20d978,#36e78a)!important;color:#031a18!important;border:1px solid #78ffb1!important;border-radius:15px!important;box-shadow:0 0 14px #1fe78335!important}
button.gold{background:linear-gradient(105deg,#092b43,#0b2338)!important;color:#18c9ed!important;border:1px solid #13bfe5!important;border-radius:15px!important}
#regForm>label:nth-of-type(1):after{content:"♟";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(2):after{content:"▤";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(3):after{content:"☎";position:absolute;right:15px;bottom:24px;color:#f4f8ff;font-size:23px;pointer-events:none}#regForm>label:nth-of-type(-n+3)>input{padding-right:52px!important}#regSubmit{min-height:58px!important;font-size:19px!important;font-weight:900!important;margin-top:17px!important}
#regForm~button.gold{background:transparent!important;border:0!important;color:#13c8ed!important;font-size:19px!important}
.notice{background:#0c3043!important;border:1px solid #17c9e077!important;color:#effaff!important;border-radius:14px!important}

@media(max-width:420px){.mesh-header{height:158px;padding:13px 12px 0}.mesh-brand-art{background-size:auto 100%}.mesh-header-actions button{min-width:38px;min-height:38px;padding:6px 10px}main#app{padding:11px}.card{padding:15px!important}.card>h2{font-size:17px!important}.form label{font-size:14px}}


.trip-map-shell{position:relative;margin:-14px -14px 14px;height:46vh;min-height:300px;max-height:520px;background:#dbeafe;overflow:hidden;border-radius:0 0 22px 22px}
#passengerMap{height:100%;width:100%;z-index:1}.trip-map-recenter{position:absolute;z-index:500;left:16px;bottom:16px;background:#fff;color:#17212b;border-radius:50%;width:52px;height:52px;box-shadow:0 4px 16px #0003;font-size:23px}
.trip-sheet{position:relative;background:#fff;color:#171717;border-radius:26px 26px 0 0;padding:18px 16px 22px;margin:-24px -14px 0;z-index:3;box-shadow:0 -5px 25px #0002}
.trip-sheet h2{color:#161616!important;background:transparent!important;border:0!important;box-shadow:none!important;text-align:right!important;padding:8px 0!important}
.trip-location-row,.trip-stop-row,.trip-search-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.trip-sheet input{background:#f7f7f7!important;color:#202020!important;border:1px solid #ddd!important;border-radius:14px!important;min-height:52px!important}
.trip-stop-row input,.trip-search-row input{flex:1;min-width:0}.trip-stop-row button{background:#eee;color:#333;min-width:40px;min-height:44px}
.trip-add-stop{background:transparent;color:#d98a18;padding:10px 0;display:flex;align-items:center;gap:8px}.trip-add-stop .plus{border:2px solid currentColor;border-radius:50%;width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center}
.trip-action{width:100%;min-height:58px;background:#e99413;color:#fff;font-size:19px;margin-top:12px}
.trip-search-row button{background:#e99413;color:#fff;min-width:58px}.trip-results{background:#fff;border:1px solid #ddd;border-radius:12px;max-height:180px;overflow:auto;color:#222}
.trip-result{display:block;width:100%;text-align:right;background:#fff;color:#222;border-bottom:1px solid #eee;border-radius:0}
.trip-driver{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;color:#17212b;border:1px solid #ddd;padding:12px;border-radius:12px;margin:7px 0}
.trip-map-note{font-size:12px;color:#64748b;margin:6px 0}.leaflet-container{font-family:Tahoma,Arial,sans-serif}

#themeBtn{min-width:150px;min-height:56px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:800;border-radius:15px;box-shadow:0 5px 16px #0002}#themeBtn span:first-child{font-size:23px;line-height:1}

'You already have a vehicle request under review',vehicleHistory:'Vehicle history',factory:'Factory reset',settings:'Settings',lockSettings:'Optional app lock',lockOff:'No extra lock',lockPattern:'Drawn pattern',lockPassword:'Local password',lockSave:'Save lock method',lockSecret:'Lock code',lockSecretAgain:'Confirm lock code',lockScreenTitle:'Unlock your account',lockScreenHelp:'Enter your selected lock method to continue.',lockOpen:'Unlock account',lockSaved:'Lock setting saved on this device.',lockWrong:'Incorrect lock code.',lockNeed:'Enter and confirm a valid code.',lockNote:'This is an additional local lock on this device and does not change OTP sign-in.',lockClear:'Disable extra lock',passengerSettings:'Passenger settings',driverSettings:'Driver settings',factoryWarn:'This signs you out and clears local app data on this device only. Your account, trips and server data will not be deleted.',factoryConfirm:'Reset this device? Your server account will not be deleted.',resetDone:'Local app data cleared. You can sign in again.',cancel:'Cancel',status:'Status',current:'Current vehicle',approved:'Approved',pendingStatus:'Pending approval',rejected:'Rejected',replaced:'Previous / replaced',date:'Request date',noHistory:'No vehicle history yet',loginFirst:'Please sign in first',colorNote:'Enter the vehicle color as shown in its photo and documents.',vehicleUrl:'Vehicle photo URL (optional)',vehicleRejected:'Rejection reason',closed:'Account is closed or suspended',idFront:'National ID - front side',idBack:'National ID - back side',vehicleDocs:'Vehicle documents (up to 3 images)',driverSelfie:'Clear driver selfie',vehiclePhoto:'Photo of the vehicle itself',cameraHint:'Take a photo with the camera or choose an image saved on your phone',camera:'Open camera',gallery:'Choose from gallery',selectedFiles:'Selected files',documentsRequired:'Complete all required images before submitting',uploading:'Preparing images and submitting...'}};
const t=k=>dict[lang][k]||k;function setDir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
function updateThemeButton(){const b=document.getElementById('themeBtn');if(!b)return;b.querySelector('span:first-child').textContent=theme==='light'?'☀️':'☾';document.getElementById('themeBtnLabel').textContent=(lang==='en'?(theme==='light'?'Light mode':'Dark mode'):(theme==='light'?'الوضع الفاتح':'الوضع الداكن'));b.setAttribute('aria-label',document.getElementById('themeBtnLabel').textContent)}document.getElementById('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;localStorage.setItem('mw_theme',theme);updateThemeButton()};

async function api(path,body,method='POST'){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body!==undefined?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||t('error'));return d}
function start(){if(APP_VARIANT==='passenger'||APP_VARIANT==='driver'){chosenRole=APP_VARIANT;formScreen(false);return}app.innerHTML=`<section class="card text-center"><h2 class="font-bold text-xl mb-3">${t('welcome')}</h2><p class="muted text-sm mb-4">${t('choose')}</p><div class="grid2"><button class="primary" onclick="chooseRole('passenger')">👤 ${t('passenger')}</button><button class="gold" onclick="chooseRole('driver')">🚕 ${t('driver')}</button></div></section>`}
function chooseRole(r){if(APP_VARIANT!=='all'&&r!==APP_VARIANT){alert('هذا التطبيق مخصص لدور مختلف');return}chosenRole=r;formScreen(false)}
function countryPhone(){return `<div class="grid2"><select id="country"><option value="+967">🇾🇪 Yemen +967</option><option value="+966">🇸🇦 Saudi Arabia +966</option><option value="+971">🇦🇪 UAE +971</option><option value="+968">🇴🇲 Oman +968</option><option value="+20">🇪🇬 Egypt +20</option><option value="+1">🇺🇸 USA +1</option><option value="+44">🇬🇧 UK +44</option></select><input id="phone" placeholder="${t('phone')}" inputmode="tel" required></div>`}
function documentInput(id,label,multiple=false,capture='environment'){
 return `<label class="mt-3">${label}<input id="${id}Camera" type="file" accept="image/*" capture="${capture}" onchange="showPickedFiles('${id}')"><input id="${id}Gallery" type="file" accept="image/*" ${multiple?'multiple':''} onchange="showPickedFiles('${id}')"><div class="upload-actions"><button type="button" class="primary" onclick="document.getElementById('${id}Camera').click()">📷 ${t('camera')}</button><button type="button" class="gold" onclick="document.getElementById('${id}Gallery').click()">🖼️ ${t('gallery')}</button></div><small id="${id}Selected" class="muted small upload-name">${t('cameraHint')}</small></label>`;
}

function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();reader.onerror=()=>reject(Error(t('error')));reader.onload=()=>{
  const img=new Image();img.onerror=()=>reject(Error(t('error')));img.onload=()=>{
   const scale=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let dataUrl=canvas.toDataURL('image/jpeg',0.78);
   if(dataUrl.length>2.55*1024*1024)dataUrl=canvas.toDataURL('image/jpeg',0.62);
   if(dataUrl.length>2.55*1024*1024)return reject(Error('حجم الصورة كبير. التقط صورة أوضح بحجم أصغر.'));
   resolve({dataUrl,fileName:(file.name||'image').replace(/[^\w.\-ء-ي]/g,'_').slice(0,120)+'.jpg'});
  };img.src=reader.result;
 };reader.readAsDataURL(file);
});}
async function collectRegistrationDocuments(){

function formatTripManeuver(step){
 const m=step.maneuver||{},name=step.name||'',modifier=m.modifier||'',type=m.type||'';
 if(lang==='en'){
  const action=type==='depart'?'Start':type==='arrive'?'You have arrived':type==='roundabout'?'At the roundabout, take exit '+(m.exit||''):type==='turn'?'Turn':type==='new name'?'Continue onto':'Continue';
  return (action+(modifier?' '+modifier:'')+(name?' onto '+name:'')).trim();
 }
 const directions={right:'يميناً',left:'يساراً',straight:'مباشرة',slight_right:'يميناً قليلاً',slight_left:'يساراً قليلاً',sharp_right:'يميناً حاداً',sharp_left:'يساراً حاداً',uturn:'استدر للخلف'};
 const action=type==='depart'?'ابدأ السير':type==='arrive'?'لقد وصلت إلى وجهتك':type==='roundabout'?'عند الدوار، اسلك المخرج رقم '+(m.exit||'') :type==='turn'?'انعطف':type==='new name'?'تابع السير':'واصل السير';
 return (action+(directions[modifier]?' '+directions[modifier]:'')+(name?' باتجاه '+name:'')).trim();
}

async function checkTripCoverage(point, label){
 if(!point||!Number.isFinite(point.lat)||!Number.isFinite(point.lng))return null;
 const key=point.lat.toFixed(5)+','+point.lng.toFixed(5),cached=tripCoverageCache.get(key);
 let coverage=cached&&Date.now()-cached.at<15000?cached.value:null;
 if(!coverage){
  try{coverage=await api('/coverage?lat='+encodeURIComponent(point.lat)+'&lng='+encodeURIComponent(point.lng),undefined,'GET');tripCoverageCache.set(key,{at:Date.now(),value:coverage});if(tripCoverageCache.size>30)tripCoverageCache.delete(tripCoverageCache.keys().next().value)}
  catch(_){tripMessage('تعذر التحقق من منطقة الخدمة بسبب الاتصال. تحقق من الإنترنت ثم أعد المحاولة.');return null}
 }
 if(coverage.enforced&&!coverage.allowed){
  tripMessage('عذراً، خدمات مشواري غير متوفرة في '+(coverage.countryName||coverage.regionName||'منطقتك')+' حالياً. يمكنك مشاهدة الخريطة، لكن لا يمكن طلب رحلة من هذه المنطقة.');
 }else if(coverage.enforced&&coverage.allowed){
  tripMessage('خدمات مشواري متاحة في '+(coverage.regionName||coverage.countryName||'منطقتك')+'.');
 }
 return coverage;
}

function locateTripPickup(){

 navigator.geolocation.getCurrentPosition(async p=>{
  if(requestId!==tripLocationRequest)return;

  if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180){
   tripMessage('وصلت إحداثيات GPS غير صالحة. أعد محاولة تحديد الموقع.');return;
  }
  const accuracy=Number(p.coords.accuracy);
  tripPickup={lat:latitude,lng:longitude,label:'موقعي الحالي',accuracy:Number.isFinite(accuracy)&&accuracy>0?accuracy:null};
  const pickupInput=document.getElementById('pickupLabel');if(pickupInput)pickupInput.value='موقعي الحالي';

   ?'تم تحديد موقعك بدقة تقريبية '+Math.round(accuracy)+' متر. تحرك إلى مكان مفتوح لتحسين الدقة إذا لزم.'
   :'تم تحديد موقع الانطلاق تلقائياً'+(Number.isFinite(accuracy)&&accuracy>0?' بدقة تقريبية '+Math.round(accuracy)+' متر.':'.'));

   const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error();

  }catch(error){if(error.name!=='AbortError')console.warn('Reverse geocoding unavailable:',error.message)}
  finally{if(tripReverseAbort===controller)tripReverseAbort=null}
 },e=>{if(requestId!==tripLocationRequest)return;const input=document.getElementById('pickupLabel');if(input)input.value='تعذر تحديد الموقع';tripMessage(e.code===1?'اسمح بإذن الموقع من إعدادات الهاتف ثم اضغط ◎.':'تعذر تحديد الموقع. تحقق من GPS ثم أعد المحاولة.')},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});

function drawTripMarkers(){
 const routeRequestId=++tripRouteRequest;
 tripVoiceInstructions=[];
 const directionsButton=document.getElementById('speakTripDirections');if(directionsButton)directionsButton.disabled=true;
 if(!tripMap)return;tripMarkers.forEach(x=>tripMap.removeLayer(x));tripMarkers=[];
 if(tripRouteLayer){tripMap.removeLayer(tripRouteLayer);tripRouteLayer=null}
 if(tripPickup)tripMarkers.push(L.marker([tripPickup.lat,tripPickup.lng]).addTo(tripMap).bindPopup('موقع الانطلاق'));
 tripStops.forEach((p,i)=>{if(Number.isFinite(p.lat)&&Number.isFinite(p.lng))tripMarkers.push(L.marker([p.lat,p.lng]).addTo(tripMap).bindPopup('نقطة توقف '+(i+1)))});
 if(tripDestination)tripMarkers.push(L.marker([tripDestination.lat,tripDestination.lng]).addTo(tripMap).bindPopup('وجهة الوصول'));
 const pts=[tripPickup,...tripStops,tripDestination].filter(p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng));
 if(tripRouteTimer)clearTimeout(tripRouteTimer);
 if(tripRouteAbort){tripRouteAbort.abort();tripRouteAbort=null}
 if(pts.length>1){
  const routeKey=pts.map(p=>p.lng.toFixed(5)+','+p.lat.toFixed(5)).join(';');
  // Do not leave an obsolete route visible while a different route is being calculated.
  if(tripRouteLayer){tripMap.removeLayer(tripRouteLayer);tripRouteLayer=null}
  tripVoiceInstructions=[];
  const speakButton=document.getElementById('speakTripDirections');
  if(speakButton)speakButton.disabled=true;
  const drawRoute=geometry=>{if(!tripMap||!geometry||routeRequestId!==tripRouteRequest)return;if(tripRouteLayer)tripMap.removeLayer(tripRouteLayer);tripRouteLayer=L.geoJSON(geometry,{style:{color:'#e99413',weight:5}}).addTo(tripMap)};
  const cachedRoute=tripRouteCache.get(routeKey);
  if(cachedRoute&&cachedRoute.expiresAt>Date.now()){tripRouteCache.delete(routeKey);tripRouteCache.set(routeKey,cachedRoute);drawRoute(cachedRoute.geometry);tripVoiceInstructions=(cachedRoute.steps||[]).map(formatTripManeuver);document.getElementById('speakTripDirections').disabled=!tripVoiceInstructions.length}
  else{
   tripRouteTimer=setTimeout(async()=>{
    const controller=new AbortController();tripRouteAbort=controller;
    try{
     const response=await fetch('https://router.project-osrm.org/route/v1/driving/'+routeKey+'?overview=full&geometries=geojson&steps=true',{signal:controller.signal});
     if(!response.ok)throw Error('Route service unavailable');
     const data=await response.json(),route=data.routes?.[0],geometry=route?.geometry;
     if(geometry&&!controller.signal.aborted&&routeRequestId===tripRouteRequest){const steps=(route.legs||[]).flatMap(leg=>leg.steps||[]);tripVoiceInstructions=steps.map(formatTripManeuver);tripRouteCache.set(routeKey,{geometry,steps,expiresAt:Date.now()+3*60*1000});if(tripRouteCache.size>25)tripRouteCache.delete(tripRouteCache.keys().next().value);document.getElementById('speakTripDirections').disabled=!tripVoiceInstructions.length;drawRoute(geometry)}
    }catch(error){if(error.name!=='AbortError'&&routeRequestId===tripRouteRequest){console.warn('Route preview unavailable:',error.message);tripMessage('تعذر حساب المسار حالياً. تحقق من الإنترنت أو حاول مرة أخرى. يمكنك متابعة تحديد الوجهة، لكن المسار لم يُحسب بعد.')}}
    finally{if(tripRouteAbort===controller)tripRouteAbort=null}
   },900);
  }
 }
 if(pts.length>1)tripMap.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[35,35]});
}
async function submitPassengerTrip(){
 const result=document.getElementById('result');result.classList.remove('hidden');
 if(!tripPickup){result.textContent='لم يتم تحديد موقع الانطلاق. فعّل GPS وإذن الموقع.';return}
 if(!tripDestination){result.textContent='حدد وجهة الوصول أولاً.';return}
 if(tripStops.some(p=>!p.label||!Number.isFinite(p.lat)||!Number.isFinite(p.lng))){result.textContent='أكمل تحديد نقاط التوقف أو احذف النقطة غير المكتملة.';return}
 result.textContent='جارٍ التحقق من مناطق الخدمة...';
 try{
  const coverageResults=await Promise.all([tripPickup,...tripStops,tripDestination].map(point=>checkTripCoverage(point,'trip')));
  if(coverageResults.some(item=>!item)){result.textContent='تعذر التحقق من توفر الخدمة لأحد مواقع الرحلة. تحقق من اتصال الإنترنت ثم أعد المحاولة.';return}
  const blocked=coverageResults.find(item=>item.enforced&&!item.allowed);
  if(blocked){result.textContent='عذراً، خدمات مشواري غير متوفرة في '+(blocked.countryName||blocked.regionName||'هذه المنطقة')+' حالياً.';return}
  const d=await api('/drivers/nearby?lat='+tripPickup.lat+'&lng='+tripPickup.lng,undefined,'GET'),list=document.getElementById('nearbyDriverList'),box=document.getElementById('nearbyDrivers');list.innerHTML='';
 if(!d.drivers?.length){box.classList.remove('hidden');result.textContent='لا توجد سيارات متاحة حالياً بالقرب منك.';return}
 d.drivers.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='trip-driver';b.innerHTML='<span>🚕 '+escapeHtml(v.car_type||'سيارة')+' '+escapeHtml(v.car_model||'')+'<small style="display:block;color:#64748b">'+escapeHtml(v.full_name||'سائق')+' · '+Number(v.distance_km).toFixed(1)+' كم</small></span><b>اختيار</b>';b.onclick=()=>{tripDriverId=v.id;list.querySelectorAll('button').forEach(x=>x.style.borderColor='#ddd');b.style.borderColor='#e99413';result.textContent='تم اختيار السيارة. اضغط إرسال الطلب.'};list.appendChild(b)});
 box.classList.remove('hidden');result.textContent='اختر سيارة متاحة لإرسال الطلب.';document.getElementById('trip').textContent='إرسال طلب التكسي';document.getElementById('trip').onclick=async()=>{if(!tripDriverId){result.textContent='اختر سيارة أولاً.';return}try{const out=await api('/trips',{destination:tripDestination.label,destinationLat:tripDestination.lat,destinationLng:tripDestination.lng,pickupLat:tripPickup.lat,pickupLng:tripPickup.lng,driverId:tripDriverId,stops:tripStops.map(p=>({label:p.label,lat:p.lat,lng:p.lng}))});result.textContent='تم إرسال الطلب. السعر التقديري: '+out.trip.fare_amount+' '+t('rial');document.getElementById('trip').disabled=true}catch(e){result.textContent=e.message}}}
 catch(e){result.textContent=e.message||'تعذر تحميل السيارات القريبة.'}
}

leHelp')}</div><button id="vehicleToggle" class="gold w-full">${t('changeVehicle')}</button><div id="vehicleForm" class="hidden mt-3"><form id="vehicleChangeForm"><label>${t('carType')}<input id="newCarType" required></label><label>${t('model')}<input id="newCarModel" required></label><label>${t('color')}<input id="newCarColor" required></label><label>${t('plate')}<input id="newPlate" required></label><label>${t('reg')}<input id="newReg" required></label><label>${t('vehicleUrl')}<input id="newVehicleUrl" type="url" placeholder="https://..."></label><button class="primary w-full mt-3">${t('sendVehicle')}</button></form><p id="vehicleMsg" class="notice hidden"></p></div><button id="historyToggle" class="tab gold w-full mt-3">${t('vehicleHistory')}</button><div id="vehicleHistory" class="hidden mt-2"></div></section>`}<section class="card mt-3"><button id="settingsToggle" class="gold w-full">${a.role==='passenger'?t('passengerSettings'):t('driverSettings')}</button><div id="settingsPanel" class="hidden mt-3"><p class="font-bold mb-2">${t('settings')}</p><p class="font-bold mb-2">${t('lockSettings')}</p><p class="muted small mb-2">${t('lockNote')}</p><label>${t('lockSettings')}<select id="accountLockMethod"><option value="off">${t('lockOff')}</option><option value="pattern">${t('lockPattern')}</option><option value="password">${t('lockPassword')}</option></select></label><div id="accountLockFields" class="hidden"><label>${t('lockSecret')}<input id="accountLockSecret" type="password" minlength="4" autocomplete="new-password"></label><label>${t('lockSecretAgain')}<input id="accountLockSecretAgain" type="password" minlength="4" autocomplete="new-password"></label></div><button id="saveAccountLock" class="primary w-full mt-2">${t('lockSave')}</button><p id="accountLockMessage" class="notice hidden"></p><hr class="my-3"><p class="muted small mb-2">${t('factoryWarn')}</p><button id="factoryResetButton" onclick="factoryReset()" class="danger w-full">${t('factory')}</button></div><button onclick="logout()" class="tab w-full mt-2">${t('logout')}</button></section>`;
document.getElementById('settingsToggle').onclick=()=>document.getElementById('settingsPanel').classList.toggle('hidden');
const lockMethodEl=document.getElementById('accountLockMethod'),lockFields=document.getElementById('accountLockFields');const existingLock=getLocalLockConfig();if(existingLock)lockMethodEl.value=existingLock.method;lockFields.classList.toggle('hidden',lockMethodEl.value==='off');renderAccountLockFields();lockMethodEl.onchange=()=>{lockFields.classList.toggle('hidden',lockMethodEl.value==='off');renderAccountLockFields()};document.getElementById('saveAccountLock').onclick=saveAccountLock;
if(a.role==='passenger'){initPassengerTripUI();}
else{document.getElementById('duty').onclick=async()=>{try{await api('/driver/duty',{offDuty:!a.is_off_duty},'PUT');a.is_off_duty=!a.is_off_duty;renderHome()}catch(e){alert(e.message)}};document.getElementById('vehicleToggle').onclick=()=>document.getElementById('vehicleForm').classList.toggle('hidden');document.getElementById('vehicleChangeForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/driver/vehicles',{car:{type:document.getElementById('newCarType').value,model:document.getElementById('newCarModel').value,color:document.getElementById('newCarColor').value,plateNumber:document.getElementById('newPlate').value,registrationNumber:document.getElementById('newReg').value,vehicleImageUrl:document.getElementById('newVehicleUrl').value}},'POST');document.getElementById('vehicleMsg').textContent=d.message||t('vehicleSent');document.getElementById('vehicleMsg').classList.remove('hidden');e.target.reset()}catch(x){document.getElementById('vehicleMsg').textContent=x.message;document.getElementById('vehicleMsg').classList.remove('hidden')}};document.getElementById('historyToggle').onclick=async()=>{const el=document.getElementById('vehicleHistory');el.classList.toggle('hidden');if(!el.classList.contains('hidden')){try{const d=await api('/driver/vehicles',undefined,'GET');el.innerHTML=(d.vehicles||[]).map(v=>`<article class="border-b py-2 text-sm"><b>${escapeHtml(v.car_type)} ${escapeHtml(v.car_model)}</b><p>${escapeHtml(v.car_color)} · ${escapeHtml(v.plate_number)}</p><p class="muted small">${t('status')}: ${t(v.status==='approved'?'approved':v.status==='pending'?'pendingStatus':v.status==='rejected'?'rejected':'replaced')} · ${new Date(v.submitted_at).toLocaleDateString(lang==='ar'?'ar':'en')}</p>${v.review_reason?`<p class="small">${t('vehicleRejected')}: ${escapeHtml(v.review_reason)}</p>`:''}</article>`).join('')||t('noHistory')}catch(e){el.textContent=e.message}}}}

function accountLockKey(){return account?`mw_account_lock_${account.role}_${account.id}`:''}
function getLocalLockConfig(){try{const raw=accountLockKey()&&localStorage.getItem(accountLockKey());return raw?JSON.parse(raw):null}catch{return null}}
async function lockDigest(value,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(value)),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16))),iterations:180000,hash:'SHA-256'},material,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAccountLockFields(){const method=document.getElementById('accountLockMethod').value,box=document.getElementById('accountLockFields');if(method==='pattern'){box.innerHTML=`<p class=\"small muted mt-2\">${t('lockSecret')}</p><div id=\"accountPatternGrid\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear\" class=\"tab w-full mt-1\">${t('cancel')}</button><p class=\"small muted mt-2\">${t('lockSecretAgain')}</p><div id=\"accountPatternGrid2\" class=\"grid grid-cols-3 gap-2 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:54px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountPatternText2\" class=\"small text-center muted\"></p><button type=\"button\" id=\"accountPatternClear2\" class=\"tab w-full mt-1\">${t('cancel')}</button>`;window.accountPatternA=wireAccountPattern('accountPatternGrid','accountPatternText','accountPatternClear');window.accountPatternB=wireAccountPattern('accountPatternGrid2','accountPatternText2','accountPatternClear2')}else{box.innerHTML=`<label>${t('lockSecret')}<input id=\"accountLockSecret\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label><label>${t('lockSecretAgain')}<input id=\"accountLockSecretAgain\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\"></label>`}}
function wireAccountPattern(gridId,textId,clearId){const grid=document.getElementById(gridId),label=document.getElementById(textId);let points=[];const add=e=>{const b=e.target.closest('[data-dot]');if(!b||!grid.contains(b))return;const n=b.dataset.dot;if(!points.includes(n)&&points.length<9){points.push(n);b.classList.add('primary');label.textContent=points.join(' · ')}};grid.addEventListener('click',add);document.getElementById(clearId).onclick=()=>{points=[];grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''};return()=>points.join('')}
async function saveAccountLock(){const method=document.getElementById('accountLockMethod').value,msg=document.getElementById('accountLockMessage');msg.classList.remove('hidden');try{if(method==='off'){localStorage.removeItem(accountLockKey());accountUnlocked=true;msg.textContent=t('lockSaved');return}let a,b;if(method==='pattern'){a=window.accountPatternA?.()||'';b=window.accountPatternB?.()||''}else{a=document.getElementById('accountLockSecret').value;b=document.getElementById('accountLockSecretAgain').value}if(a.length<4||a!==b||(method==='pattern'&&(!/^[1-9]{4,9}$/.test(a)||new Set(a).size<4))){msg.textContent=t('lockNeed');return}const salt=lockSalt();localStorage.setItem(accountLockKey(),JSON.stringify({method,salt,hash:await lockDigest(a,salt)}));accountUnlocked=true;msg.textContent=t('lockSaved')}catch(e){msg.textContent=t('error')}}
function showAccountUnlock(cfg){app.innerHTML=`<section class=\"card text-center\"><h2 class=\"font-bold text-xl\">${t('lockScreenTitle')}</h2><p class=\"muted text-sm my-3\">${t('lockScreenHelp')}</p>${cfg.method==='pattern'?`<div id=\"accountUnlockGrid\" class=\"grid grid-cols-3 gap-3 max-w-xs mx-auto\">${Array.from({length:9},(_,i)=>`<button type=\"button\" class=\"tab\" data-dot=\"${i+1}\" style=\"height:64px;border-radius:50%\">●</button>`).join('')}</div><p id=\"accountUnlockPatternText\" class=\"small muted mt-2\"></p><button id=\"accountUnlockClear\" class=\"tab w-full mt-2\">${t('cancel')}</button>`:`<input id=\"accountUnlockSecret\" type=\"password\" autocomplete=\"off\" placeholder=\"${t('lockSecret')}\">`}<button id=\"accountUnlockButton\" class=\"primary w-full mt-3\">${t('lockOpen')}</button><p id=\"accountUnlockError\" class=\"notice hidden\"></p><button class=\"tab w-full mt-3\" onclick=\"logout()\">${t('logout')}</button></section>`;let value='';if(cfg.method==='pattern'){const grid=document.getElementById('accountUnlockGrid'),label=document.getElementById('accountUnlockPatternText');grid.addEventListener('click',e=>{const b=e.target.closest('[data-dot]');if(b&&!value.includes(b.dataset.dot)&&value.length<9){value+=b.dataset.dot;b.classList.add('primary');label.textContent=value.split('').join(' · ')}});document.getElementById('accountUnlockClear').onclick=()=>{value='';grid.querySelectorAll('button').forEach(b=>b.classList.remove('primary'));label.textContent=''}}document.getElementById('accountUnlockButton').onclick=async()=>{const candidate=cfg.method==='pattern'?value:document.getElementById('accountUnlockSecret').value;const err=document.getElementById('accountUnlockError');if(cfg.method==='pattern'&&(!/^[1-9]{4,9}$/.test(candidate)||new Set(candidate).size<4)){err.textContent=t('lockWrong');err.classList.remove('hidden');return}if(await lockDigest(candidate,cfg.salt)===cfg.hash){accountUnlocked=true;renderHome()}else{err.textContent=t('lockWrong');err.classList.remove('hidden');value='';if(cfg.method==='pattern')document.getElementById('accountUnlockClear').click();else document.getElementById('accountUnlockSecret').value=''}};document.getElementById('accountUnlockSecret')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('accountUnlockButton').click()})}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){token='';account=null;chosenRole='';accountUnlocked=false;localStorage.removeItem('mw_token');start()}
async function factoryReset(){if(!confirm(t('factoryConfirm')))return;try{if(accountLockKey())localStorage.removeItem(accountLockKey());token='';account=null;chosenRole='';accountUnlocked=false;for(const k of ['mw_token','mw_lang','mw_theme'])localStorage.removeItem(k);sessionStorage.removeItem('mw_token');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/mesh|mw|pwa/i.test(k)).map(k=>caches.delete(k)))}alert(t('resetDone'));location.reload()}catch(e){alert(e.message||t('error'))}}

// Delegated ripple: covers every current and future button in passenger/driver UI.
document.addEventListener('pointerdown',function(event){
 const button=event.target.closest('button');
 if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
 const rect=button.getBoundingClientRect();
 const diameter=Math.max(rect.width,rect.height)*2.2;
 const wave=document.createElement('span');
 wave.className='ripple-wave';
 wave.style.width=diameter+'px';wave.style.height=diameter+'px';
 wave.style.left=(event.clientX-rect.left)+'px';wave.style.top=(event.clientY-rect.top)+'px';
 button.appendChild(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});
});

if(token)home();else start();
