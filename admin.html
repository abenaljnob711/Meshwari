<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشواري - لوحة الإدارة المتكاملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://fwsizwqzmgrxqdjgtyvm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dvXnOm9j_Jzam6WGXMYVZA_7PZGlLjH';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [activeTab, setActiveTab] = useState('passengers');
      const [passengers, setPassengers] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [trips, setTrips] = useState([]);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      const fetchData = async () => {
        setLoading(true);
        setErrorMsg('');
        
        try {
          // جلب الركاب
          const { data: pData, error: pError } = await supabase.from('passengers').select('*').order('created_at', { ascending: false });
          if (pError) throw pError;
          if (pData) setPassengers(pData);

          // جلب السائقين
          const { data: dData, error: dError } = await supabase.from('drivers').select('*').order('created_at', { ascending: false });
          if (dError) throw dError;
          if (dData) setDrivers(dData);

          // جلب الرحلات
          const { data: tData, error: tError } = await supabase.from('trips').select('*').order('created_at', { ascending: false });
          if (tError) throw tError;
          if (tData) setTrips(tData);

        } catch (error) {
          console.error(error);
          setErrorMsg('حدث خطأ في الاتصال بقاعدة البيانات: ' + error.message);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchData();
      }, []);

      // توليد كود للراكب
      const generateCode = async (nationalId) => {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const { error } = await supabase.from('passengers').update({ verification_code: code, is_verified: 1 }).eq('national_id', nationalId);
        if (!error) {
          alert(`تم التفعيل! الكود: ${code}`);
          fetchData();
        } else {
          alert('خطأ في التفعيل: ' + error.message);
        }
      };

      // اعتماد السائق
      const approveDriver = async (driverId) => {
        await supabase.from('drivers').update({ status: 'approved', is_verified: 1 }).eq('id', driverId);
        fetchData();
      };

      const TabButton = ({ id, label }) => (
        <button onClick={() => setActiveTab(id)} className={`flex-1 py-3 rounded-xl font-bold transition ${activeTab === id ? 'bg-amber-400 text-slate-900 shadow' : 'bg-white text-slate-600'}`}>
          {label}
        </button>
      );

      return (
        <div className="max-w-4xl mx-auto p-4 pb-20">
          <header className="bg-slate-900 text-white p-4 rounded-2xl shadow-lg mb-6 flex justify-between items-center">
            <h1 className="font-black text-xl">لوحة إدارة مشواري</h1>
            <button onClick={fetchData} className="bg-amber-400 text-slate-900 px-4 py-2 rounded-lg text-xs font-bold hover:bg-amber-300">تحديث البيانات</button>
          </header>

          <div className="flex gap-2 mb-6">
            <TabButton id="passengers" label="الركاب" />
            <TabButton id="drivers" label="السائقون" />
            <TabButton id="trips" label="الرحلات" />
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 min-h-[400px]">
            {loading ? (
              <div className="text-center py-20 text-slate-500 animate-pulse">جارٍ تحميل البيانات...</div>
            ) : errorMsg ? (
              <div className="text-center py-20 text-red-500 font-bold">{errorMsg}</div>
            ) : (
              <>
                {/* قسم الركاب */}
                {activeTab === 'passengers' && (
                  <div className="space-y-3">
                    <h2 className="text-lg font-black mb-4">قائمة الركاب</h2>
                    {passengers.length === 0 ? (
                      <p className="text-center py-10 text-slate-500">لا يوجد ركاب مسجلون حالياً.</p>
                    ) : (
                      passengers.map(p => (
                        <div key={p.national_id} className="p-4 border border-slate-200 rounded-xl flex justify-between items-center bg-slate-50">
                          <div>
                            <p className="font-bold">{p.full_name}</p>
                            <p className="text-xs text-slate-500 font-mono">بطاقة: {p.national_id} | جوال: {p.phone}</p>
                          </div>
                          {p.is_verified === 0 ? (
                            <button onClick={() => generateCode(p.national_id)} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold">توليد كود</button>
                          ) : (
                            <span className="text-xs text-emerald-600 font-bold bg-emerald-100 px-2 py-1 rounded">مفعل</span>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                )}

                {/* قسم السائقين */}
                {activeTab === 'drivers' && (
                  <div className="space-y-3">
                    <h2 className="text-lg font-black mb-4">قائمة السائقين</h2>
                    {drivers.length === 0 ? (
                      <p className="text-center py-10 text-slate-500">لا يوجد سائقون مسجلون حالياً.</p>
                    ) : (
                      drivers.map(d => (
                        <div key={d.id} className="p-4 border border-slate-200 rounded-xl bg-slate-50">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <p className="font-bold">{d.full_name}</p>
                              <p className="text-xs text-slate-500 font-mono">بطاقة: {d.national_id}</p>
                            </div>
                            <span className={`text-xs px-2 py-1 rounded-lg font-bold ${d.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                              {d.status === 'approved' ? 'معتمد' : 'قيد المراجعة'}
                            </span>
                          </div>
                          {d.status === 'pending' && (
                            <button onClick={() => approveDriver(d.id)} className="w-full bg-emerald-600 text-white font-bold text-xs py-2 rounded-lg mt-2">اعتماد السائق</button>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                )}

                {/* قسم الرحلات */}
                {activeTab === 'trips' && (
                  <div className="space-y-3">
                    <h2 className="text-lg font-black mb-4">سجل الرحلات</h2>
                    {trips.length === 0 ? (
                      <p className="text-center py-10 text-slate-500">لا توجد رحلات مسجلة حالياً.</p>
                    ) : (
                      trips.map(t => (
                        <div key={t.id} className="p-3 border border-slate-200 rounded-xl bg-slate-50 text-sm">
                          <p className="font-bold">رحلة #{t.id}</p>
                          <p className="text-xs text-slate-500">الراكب: {t.passenger_id} | السعر: {t.fare_amount} ريال</p>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
